<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <title>Roncin 货代后台</title>
    <!--
      首屏启动画面：位于 #root 之外的唯一加载层，React 不会清空或替换它；
      认证初始化与首屏路由懒加载期间持续覆盖，首个真实页面提交时由
      src/app/bootLoading.ts 在绘制前移除，全程同一元素不跳动。
    -->
    <style>
      #boot-loading {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #f5f7fa;
        line-height: 1.5;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      }
      #boot-loading .boot-loading-ring {
        box-sizing: border-box;
        width: 36px;
        height: 36px;
        margin: 20px;
        border-radius: 50%;
        border: 3px solid transparent;
        border-top-color: #1677ff;
        animation: boot-loading-rotation 1s linear infinite;
      }
      #boot-loading .boot-loading-title {
        margin-top: 8px;
        font-size: 17.6px;
        font-weight: 500;
        color: #0f172a;
      }
      @keyframes boot-loading-rotation {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-loading">
      <span class="boot-loading-ring" role="status" aria-label="正在加载资源"></span>
      <div class="boot-loading-title">正在加载资源</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
