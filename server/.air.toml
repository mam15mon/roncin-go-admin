root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/roncin-server.exe ./cmd/server"
entrypoint = ["./tmp/roncin-server.exe", "-conf", "configs"]
include_ext = ["go", "yaml", "yml"]
exclude_dir = ["bin", "tmp", "var"]
delay = 500
stop_on_error = true
send_interrupt = true
kill_delay = "500ms"
