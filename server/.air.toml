root = "."
tmp_dir = "tmp"

[build]
cmd = "go run ./cmd/migrate -dir migrations && go build -o ./tmp/roncin-server ./cmd/server"
entrypoint = ["./tmp/roncin-server", "-conf", "configs"]
include_ext = ["go", "yaml", "yml", "sql"]
exclude_dir = ["bin", "tmp", "var"]
delay = 500
stop_on_error = true
send_interrupt = false
kill_delay = "500ms"
