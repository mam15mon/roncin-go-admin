root = "."
tmp_dir = "tmp"

[build]
cmd = "go run ./cmd/migrate -dir migrations; if ($LASTEXITCODE -eq 0) { go build -o ./tmp/roncin-server.exe ./cmd/server } else { exit $LASTEXITCODE }"
entrypoint = ["./tmp/roncin-server.exe", "-conf", "configs"]
include_ext = ["go", "yaml", "yml", "sql"]
exclude_dir = ["bin", "tmp", "var"]
delay = 500
stop_on_error = true
send_interrupt = true
kill_delay = "500ms"
