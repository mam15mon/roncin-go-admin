syntax = "proto3";

package partner.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";

option go_package = "github.com/roncin/roncin-go-admin/server/api/partner/v1;v1";

service PartnerService {
  rpc GetPartner(GetPartnerRequest) returns (PartnerReply) {
    option (google.api.http) = {get: "/api/v1/partners/{id}"};
  }

  rpc ListPartners(ListPartnersRequest) returns (PartnerListReply) {
    option (google.api.http) = {get: "/api/v1/partners"};
  }

  rpc ListPartnerAssignmentOptions(ListPartnerAssignmentOptionsRequest) returns (PartnerAssignmentOptionListReply) {
    option (google.api.http) = {get: "/api/v1/partners/assignment-options"};
  }

  rpc CreatePartner(CreatePartnerRequest) returns (PartnerReply) {
    option (google.api.http) = {
      post: "/api/v1/partners"
      body: "*"
    };
  }

  rpc UpdatePartner(UpdatePartnerRequest) returns (PartnerReply) {
    option (google.api.http) = {
      put: "/api/v1/partners/{id}"
      body: "*"
    };
  }

  rpc SetSupplierBlacklist(SetSupplierBlacklistRequest) returns (PartnerReply) {
    option (google.api.http) = {
      post: "/api/v1/partners/{id}/supplier-blacklist"
      body: "*"
    };
  }

  rpc ListPartnerAccounts(ListPartnerAccountsRequest) returns (PartnerAccountListReply) {
    option (google.api.http) = {get: "/api/v1/partners/{partner_id}/accounts"};
  }

  rpc CreatePartnerAccount(CreatePartnerAccountRequest) returns (PartnerAccountReply) {
    option (google.api.http) = {
      post: "/api/v1/partners/{partner_id}/accounts"
      body: "*"
    };
  }

  rpc UpdatePartnerAccount(UpdatePartnerAccountRequest) returns (PartnerAccountReply) {
    option (google.api.http) = {
      put: "/api/v1/partners/{partner_id}/accounts/{id}"
      body: "*"
    };
  }

  rpc ListPartnerContracts(ListPartnerContractsRequest) returns (PartnerContractListReply) {
    option (google.api.http) = {get: "/api/v1/partners/{partner_id}/contracts"};
  }

  rpc CreatePartnerContract(CreatePartnerContractRequest) returns (PartnerContractReply) {
    option (google.api.http) = {
      post: "/api/v1/partners/{partner_id}/contracts"
      body: "*"
    };
  }

  rpc UpdatePartnerContract(UpdatePartnerContractRequest) returns (PartnerContractReply) {
    option (google.api.http) = {
      put: "/api/v1/partners/{partner_id}/contracts/{id}"
      body: "*"
    };
  }

  rpc ListPartnerSettlementRules(ListPartnerSettlementRulesRequest) returns (PartnerSettlementRuleListReply) {
    option (google.api.http) = {get: "/api/v1/partners/{partner_id}/roles/{role_type}/settlement-rules"};
  }

  rpc CreatePartnerSettlementRule(CreatePartnerSettlementRuleRequest) returns (PartnerSettlementRuleReply) {
    option (google.api.http) = {
      post: "/api/v1/partners/{partner_id}/roles/{role_type}/settlement-rules"
      body: "*"
    };
  }

  rpc UpdatePartnerSettlementRule(UpdatePartnerSettlementRuleRequest) returns (PartnerSettlementRuleReply) {
    option (google.api.http) = {
      put: "/api/v1/partners/{partner_id}/roles/{role_type}/settlement-rules/{id}"
      body: "*"
    };
  }

  rpc ListPartnerAttachments(ListPartnerAttachmentsRequest) returns (PartnerAttachmentListReply) {
    option (google.api.http) = {get: "/api/v1/partners/{partner_id}/attachments"};
  }

  rpc RegisterPartnerAttachment(RegisterPartnerAttachmentRequest) returns (PartnerAttachmentReply) {
    option (google.api.http) = {
      post: "/api/v1/partners/{partner_id}/attachments"
      body: "*"
    };
  }

  rpc ImportPartners(ImportPartnersRequest) returns (PartnerImportReply) {
    option (google.api.http) = {
      post: "/api/v1/partners/import"
      body: "*"
    };
  }

  rpc ExportPartners(ExportPartnersRequest) returns (PartnerExportReply) {
    option (google.api.http) = {get: "/api/v1/partners/export"};
  }

  rpc ListPartnerShippingPresets(ListPartnerShippingPresetsRequest) returns (PartnerShippingPresetListReply) {
    option (google.api.http) = {get: "/api/v1/partners/{partner_id}/shipping-presets"};
  }

  rpc CreatePartnerShippingPreset(CreatePartnerShippingPresetRequest) returns (PartnerShippingPresetReply) {
    option (google.api.http) = {
      post: "/api/v1/partners/{partner_id}/shipping-presets"
      body: "*"
    };
  }

  rpc UpdatePartnerShippingPreset(UpdatePartnerShippingPresetRequest) returns (PartnerShippingPresetReply) {
    option (google.api.http) = {
      put: "/api/v1/partners/{partner_id}/shipping-presets/{id}"
      body: "*"
    };
  }
}

enum PartnerRoleType {
  PARTNER_ROLE_TYPE_UNSPECIFIED = 0;
  PARTNER_ROLE_TYPE_CUSTOMER = 1;
  PARTNER_ROLE_TYPE_SUPPLIER = 2;
  PARTNER_ROLE_TYPE_FOREIGN_AGENT = 3;
  PARTNER_ROLE_TYPE_CARRIER = 4;
}

enum PartnerCustomerType {
  PARTNER_CUSTOMER_TYPE_UNSPECIFIED = 0;
  PARTNER_CUSTOMER_TYPE_DIRECT = 1;
  PARTNER_CUSTOMER_TYPE_PEER = 2;
}

enum PartnerBusinessType {
  PARTNER_BUSINESS_TYPE_UNSPECIFIED = 0;
  PARTNER_BUSINESS_TYPE_SE = 1;
  PARTNER_BUSINESS_TYPE_SI = 2;
  PARTNER_BUSINESS_TYPE_AE = 3;
  PARTNER_BUSINESS_TYPE_AI = 4;
  PARTNER_BUSINESS_TYPE_LAND = 5;
  PARTNER_BUSINESS_TYPE_RAIL = 6;
}

enum PartnerAssignmentRole {
  PARTNER_ASSIGNMENT_ROLE_UNSPECIFIED = 0;
  PARTNER_ASSIGNMENT_ROLE_CREATOR = 1;
  PARTNER_ASSIGNMENT_ROLE_OPERATOR = 2;
  PARTNER_ASSIGNMENT_ROLE_SALES = 3;
  PARTNER_ASSIGNMENT_ROLE_CUSTOMER_SERVICE = 4;
  PARTNER_ASSIGNMENT_ROLE_DOCUMENT = 5;
  PARTNER_ASSIGNMENT_ROLE_COMMERCIAL = 6;
  PARTNER_ASSIGNMENT_ROLE_INTERNAL_CONTACT = 7;
}

message PartnerRole {
  PartnerRoleType type = 1;
  bool enabled = 2;
  bool blacklisted = 3;
  string blacklist_reason = 4;
  string blacklisted_at = 5;
  string blacklisted_by = 6;
  PartnerSettlementRule settlement_rule = 7;
}

message PartnerContact {
  string id = 1;
  string name = 2;
  string phone = 3;
  string email = 4;
  string note = 5;
  bool is_primary = 6;
  string created_at = 7;
  string updated_at = 8;
}

message PartnerAlias {
  string id = 1;
  string alias_name = 2;
  int32 sort_order = 3;
  string created_at = 4;
  string updated_at = 5;
}

message PartnerProfile {
  string name_en = 1;
  string address_en = 2;
  string country_code = 3;
  string province_code = 4;
  string city_code = 5;
  string district_code = 6;
  string address_detail = 7;
  string nature = 8;
  string development_method = 9;
  repeated PartnerCustomerType customer_types = 10;
  repeated PartnerBusinessType business_types = 11;
  string remark = 12;
}

message PartnerAssignment {
  string id = 1;
  PartnerAssignmentRole role = 2;
  string user_id = 3;
  string organization_id = 4;
  string created_at = 5;
  string updated_at = 6;
  int32 sort_order = 7;
}

message PartnerAssignmentInput {
  PartnerAssignmentRole role = 1 [(google.api.field_behavior) = REQUIRED];
  string user_id = 2 [(google.api.field_behavior) = REQUIRED];
  string organization_id = 3 [(google.api.field_behavior) = REQUIRED];
}

message PartnerAssignmentOption {
  string user_id = 1;
  string display_name = 2;
  string organization_id = 3;
  string organization_name = 4;
  bool membership_enabled = 5;
}

message ListPartnerAssignmentOptionsRequest {}

message PartnerAssignmentOptionListReply {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated PartnerAssignmentOption data = 4;
  string trace_id = 5;
}

message Partner {
  string id = 1;
  string organization_id = 2;
  string code = 3;
  string legal_name = 4;
  string unified_social_credit_code = 5;
  string registered_address = 6;
  bool enabled = 7;
  repeated PartnerRole roles = 8;
  repeated PartnerContact contacts = 9;
  repeated PartnerAlias aliases = 10;
  string created_at = 11;
  string updated_at = 12;
  PartnerProfile profile = 13;
  repeated PartnerAssignment assignments = 14;
}

message PartnerRoleInput {
  PartnerRoleType type = 1;
  bool enabled = 2;
  PartnerSettlementRuleInput settlement_rule = 3;
}

message PartnerContactInput {
  string name = 1;
  string phone = 2;
  string email = 3;
  string note = 4;
  bool is_primary = 5;
}

message PartnerAliasInput {
  string alias_name = 1;
  int32 sort_order = 2;
}

message GetPartnerRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message ListPartnersRequest {
  int32 page = 1;
  int32 page_size = 2;
  string keyword = 3;
  PartnerRoleType role = 4;
  optional bool enabled = 5;
}

message CreatePartnerRequest {
  string code = 1 [(google.api.field_behavior) = REQUIRED];
  string legal_name = 2 [(google.api.field_behavior) = REQUIRED];
  string unified_social_credit_code = 3;
  string registered_address = 4;
  repeated PartnerRoleInput roles = 5;
  repeated PartnerContactInput contacts = 6;
  repeated PartnerAliasInput aliases = 7;
  PartnerProfile profile = 8;
  repeated PartnerAssignmentInput assignments = 9;
}

message UpdatePartnerRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  string legal_name = 2 [(google.api.field_behavior) = REQUIRED];
  string unified_social_credit_code = 3;
  string registered_address = 4;
  bool enabled = 5;
  repeated PartnerRoleInput roles = 6;
  repeated PartnerContactInput contacts = 7;
  repeated PartnerAliasInput aliases = 8;
  PartnerProfile profile = 9;
  repeated PartnerAssignmentInput assignments = 10;
}

enum PartnerImportMode {
  PARTNER_IMPORT_MODE_UNSPECIFIED = 0;
  PARTNER_IMPORT_MODE_CREATE_ONLY = 1;
  PARTNER_IMPORT_MODE_UPSERT = 2;
}

message PartnerImportItemInput {
  string code = 1 [(google.api.field_behavior) = REQUIRED];
  string legal_name = 2 [(google.api.field_behavior) = REQUIRED];
  string unified_social_credit_code = 3;
  string registered_address = 4;
  repeated PartnerRoleInput roles = 5;
  repeated PartnerContactInput contacts = 6;
  repeated PartnerAliasInput aliases = 7;
  PartnerProfile profile = 8;
  repeated PartnerAssignmentInput assignments = 9;
}

message ImportPartnersRequest {
  string source = 1 [(google.api.field_behavior) = REQUIRED];
  PartnerImportMode mode = 2 [(google.api.field_behavior) = REQUIRED];
  repeated PartnerImportItemInput items = 3 [(google.api.field_behavior) = REQUIRED];
}

message PartnerImportReply {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  int32 created_count = 4;
  int32 updated_count = 5;
  string trace_id = 6;
}

message ExportPartnersRequest {
  string keyword = 1;
  PartnerRoleType role = 2;
  optional bool enabled = 3;
}

message PartnerExportItem {
  string code = 1;
  string legal_name = 2;
  string unified_social_credit_code = 3;
  string registered_address = 4;
  bool enabled = 5;
  repeated PartnerRoleType roles = 6;
}

message PartnerExportReply {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated PartnerExportItem data = 4;
  string trace_id = 5;
}

enum PartnerShippingPresetType {
  PARTNER_SHIPPING_PRESET_TYPE_UNSPECIFIED = 0;
  PARTNER_SHIPPING_PRESET_TYPE_SHIPPER = 1;
  PARTNER_SHIPPING_PRESET_TYPE_CONSIGNEE = 2;
  PARTNER_SHIPPING_PRESET_TYPE_NOTIFY_PARTY = 3;
  PARTNER_SHIPPING_PRESET_TYPE_ENGLISH_CARGO_NAME = 4;
  PARTNER_SHIPPING_PRESET_TYPE_HS_CODE = 5;
  PARTNER_SHIPPING_PRESET_TYPE_MARKS = 6;
}

message PartnerShippingPartyPayload {
  string company_name = 1;
  string address = 2;
  string contact_name = 3;
  string phone = 4;
  string email = 5;
  string country_code = 6;
  string tax_identifier = 7;
}

message PartnerShippingTextPayload {
  string content = 1;
  string code = 2;
}

message PartnerShippingPreset {
  string id = 1;
  string partner_id = 2;
  PartnerShippingPresetType preset_type = 3;
  string title = 4;
  oneof payload {
    PartnerShippingPartyPayload party = 5;
    PartnerShippingTextPayload text = 6;
  }
  bool is_default = 7;
  int32 sort_order = 8;
  string remark = 9;
  bool enabled = 10;
  string created_at = 11;
  string updated_at = 12;
}

message PartnerShippingPresetInput {
  PartnerShippingPresetType preset_type = 1 [(google.api.field_behavior) = REQUIRED];
  string title = 2 [(google.api.field_behavior) = REQUIRED];
  oneof payload {
    PartnerShippingPartyPayload party = 3;
    PartnerShippingTextPayload text = 4;
  }
  bool is_default = 5;
  int32 sort_order = 6;
  string remark = 7;
  bool enabled = 8;
}

message ListPartnerShippingPresetsRequest {
  string partner_id = 1 [(google.api.field_behavior) = REQUIRED];
  optional PartnerShippingPresetType preset_type = 2;
  optional bool enabled = 3;
}

message CreatePartnerShippingPresetRequest {
  string partner_id = 1 [(google.api.field_behavior) = REQUIRED];
  PartnerShippingPresetInput preset = 2 [(google.api.field_behavior) = REQUIRED];
}

message UpdatePartnerShippingPresetRequest {
  string partner_id = 1 [(google.api.field_behavior) = REQUIRED];
  string id = 2 [(google.api.field_behavior) = REQUIRED];
  PartnerShippingPresetInput preset = 3 [(google.api.field_behavior) = REQUIRED];
}

message PartnerShippingPresetReply {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  PartnerShippingPreset data = 4;
  string trace_id = 5;
}

message PartnerShippingPresetListReply {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated PartnerShippingPreset data = 4;
  string trace_id = 5;
}

message SetSupplierBlacklistRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  bool blacklisted = 2;
  string reason = 3 [(google.api.field_behavior) = REQUIRED];
}

enum PartnerAccountStatus {
  PARTNER_ACCOUNT_STATUS_UNSPECIFIED = 0;
  PARTNER_ACCOUNT_STATUS_ACTIVE = 1;
  PARTNER_ACCOUNT_STATUS_INACTIVE = 2;
}

message PartnerAccount {
  string id = 1;
  string partner_role_id = 2;
  string account_type = 3;
  string currency = 4;
  string invoice_title = 5;
  string unified_social_credit_code = 6;
  string billing_address = 7;
  string billing_phone = 8;
  string bank_name = 9;
  string bank_account = 10;
  string swift_code = 11;
  bool is_default = 12;
  PartnerAccountStatus status = 13;
  string remark = 14;
  string created_at = 15;
  string updated_at = 16;
}

message PartnerAccountInput {
  string currency = 1 [(google.api.field_behavior) = REQUIRED];
  string invoice_title = 2 [(google.api.field_behavior) = REQUIRED];
  string unified_social_credit_code = 3;
  string billing_address = 4;
  string billing_phone = 5;
  string bank_name = 6;
  string bank_account = 7;
  string swift_code = 8;
  bool is_default = 9;
  PartnerAccountStatus status = 10 [(google.api.field_behavior) = REQUIRED];
  string remark = 11;
}

message ListPartnerAccountsRequest {
  string partner_id = 1 [(google.api.field_behavior) = REQUIRED];
  optional bool enabled = 2;
}

message CreatePartnerAccountRequest {
  string partner_id = 1 [(google.api.field_behavior) = REQUIRED];
  PartnerAccountInput account = 2 [(google.api.field_behavior) = REQUIRED];
}

message UpdatePartnerAccountRequest {
  string partner_id = 1 [(google.api.field_behavior) = REQUIRED];
  string id = 2 [(google.api.field_behavior) = REQUIRED];
  PartnerAccountInput account = 3 [(google.api.field_behavior) = REQUIRED];
}

message PartnerAccountReply {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  PartnerAccount data = 4;
  string trace_id = 5;
}

message PartnerAccountListReply {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated PartnerAccount data = 4;
  string trace_id = 5;
}

enum PartnerContractStatus {
  PARTNER_CONTRACT_STATUS_UNSPECIFIED = 0;
  PARTNER_CONTRACT_STATUS_PENDING = 1;
  PARTNER_CONTRACT_STATUS_ACTIVE = 2;
  PARTNER_CONTRACT_STATUS_EXPIRED = 3;
  PARTNER_CONTRACT_STATUS_TERMINATED = 4;
}

message PartnerContract {
  string id = 1;
  string partner_id = 2;
  string contract_no = 3;
  string name = 4;
  PartnerContractStatus status = 5;
  string start_date = 6;
  string end_date = 7;
  string payment_terms = 8;
  string dispute_resolution = 9;
  string other_notes = 10;
  string created_at = 12;
  string updated_at = 13;
}

message CreatePartnerContractInput {
  string contract_no = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  PartnerContractStatus status = 3 [(google.api.field_behavior) = REQUIRED];
  string start_date = 4 [(google.api.field_behavior) = REQUIRED];
  string end_date = 5 [(google.api.field_behavior) = REQUIRED];
  string payment_terms = 6;
  string dispute_resolution = 7;
  string other_notes = 8;
}

message UpdatePartnerContractInput {
  string name = 1 [(google.api.field_behavior) = REQUIRED];
  PartnerContractStatus status = 2 [(google.api.field_behavior) = REQUIRED];
  string start_date = 3 [(google.api.field_behavior) = REQUIRED];
  string end_date = 4 [(google.api.field_behavior) = REQUIRED];
  string payment_terms = 5;
  string dispute_resolution = 6;
  string other_notes = 7;
}

message ListPartnerContractsRequest {
  string partner_id = 1 [(google.api.field_behavior) = REQUIRED];
  optional PartnerContractStatus status = 2;
}

message CreatePartnerContractRequest {
  string partner_id = 1 [(google.api.field_behavior) = REQUIRED];
  CreatePartnerContractInput contract = 2 [(google.api.field_behavior) = REQUIRED];
}

message UpdatePartnerContractRequest {
  string partner_id = 1 [(google.api.field_behavior) = REQUIRED];
  string id = 2 [(google.api.field_behavior) = REQUIRED];
  UpdatePartnerContractInput contract = 3 [(google.api.field_behavior) = REQUIRED];
}

message PartnerContractReply {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  PartnerContract data = 4;
  string trace_id = 5;
}

message PartnerContractListReply {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated PartnerContract data = 4;
  string trace_id = 5;
}

enum PartnerStatementMode {
  PARTNER_STATEMENT_MODE_UNSPECIFIED = 0;
  PARTNER_STATEMENT_MODE_SINGLE = 1;
  PARTNER_STATEMENT_MODE_MULTI = 2;
}

enum PartnerSettlementMethod {
  PARTNER_SETTLEMENT_METHOD_UNSPECIFIED = 0;
  PARTNER_SETTLEMENT_METHOD_BY_TICKET = 1;
  PARTNER_SETTLEMENT_METHOD_MONTHLY = 2;
  PARTNER_SETTLEMENT_METHOD_WEEKLY = 3;
  PARTNER_SETTLEMENT_METHOD_SEMI_MONTHLY = 4;
  PARTNER_SETTLEMENT_METHOD_BI_MONTHLY = 5;
  PARTNER_SETTLEMENT_METHOD_QUARTERLY = 6;
  PARTNER_SETTLEMENT_METHOD_DAYS_45 = 7;
  PARTNER_SETTLEMENT_METHOD_PREPAID = 8;
}

enum PartnerSettlementBase {
  PARTNER_SETTLEMENT_BASE_UNSPECIFIED = 0;
  PARTNER_SETTLEMENT_BASE_BILL_DATE = 1;
  PARTNER_SETTLEMENT_BASE_SAILING_DATE = 2;
  PARTNER_SETTLEMENT_BASE_ARRIVAL_DATE = 3;
}

message PartnerSettlementRule {
  string id = 1;
  string partner_role_id = 2;
  PartnerStatementMode statement_mode = 3;
  PartnerSettlementMethod settlement_method = 4;
  optional int32 settlement_day = 5;
  optional int32 settlement_cycle_days = 6;
  optional PartnerSettlementBase settlement_base = 7;
  string settlement_currency = 8;
  bool is_active = 9;
  string created_at = 10;
  string updated_at = 11;
  optional int64 credit_limit_minor = 12;
  optional string credit_currency = 13;
}

message PartnerSettlementRuleInput {
  PartnerStatementMode statement_mode = 1 [(google.api.field_behavior) = REQUIRED];
  PartnerSettlementMethod settlement_method = 2 [(google.api.field_behavior) = REQUIRED];
  optional int32 settlement_day = 3;
  optional int32 settlement_cycle_days = 4;
  optional PartnerSettlementBase settlement_base = 5;
  string settlement_currency = 6 [(google.api.field_behavior) = REQUIRED];
  bool is_active = 7;
  optional int64 credit_limit_minor = 8;
  optional string credit_currency = 9;
}

message ListPartnerSettlementRulesRequest {
  string partner_id = 1 [(google.api.field_behavior) = REQUIRED];
  PartnerRoleType role_type = 2 [(google.api.field_behavior) = REQUIRED];
}

message CreatePartnerSettlementRuleRequest {
  string partner_id = 1 [(google.api.field_behavior) = REQUIRED];
  PartnerRoleType role_type = 2 [(google.api.field_behavior) = REQUIRED];
  PartnerSettlementRuleInput rule = 3 [(google.api.field_behavior) = REQUIRED];
}

message UpdatePartnerSettlementRuleRequest {
  string partner_id = 1 [(google.api.field_behavior) = REQUIRED];
  PartnerRoleType role_type = 2 [(google.api.field_behavior) = REQUIRED];
  string id = 3 [(google.api.field_behavior) = REQUIRED];
  PartnerSettlementRuleInput rule = 4 [(google.api.field_behavior) = REQUIRED];
}

message PartnerSettlementRuleReply {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  PartnerSettlementRule data = 4;
  string trace_id = 5;
}

message PartnerSettlementRuleListReply {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated PartnerSettlementRule data = 4;
  string trace_id = 5;
}

message PartnerAttachment {
  string id = 1;
  string partner_id = 2;
  string idempotency_key = 3;
  string file_name = 4;
  string mime_type = 5;
  int64 file_size = 6;
  string object_key = 7;
  string checksum = 8;
  string uploaded_by = 9;
  string created_at = 10;
  string updated_at = 11;
}

message RegisterPartnerAttachmentRequest {
  string partner_id = 1 [(google.api.field_behavior) = REQUIRED];
  string idempotency_key = 2 [(google.api.field_behavior) = REQUIRED];
  string file_name = 3 [(google.api.field_behavior) = REQUIRED];
  string mime_type = 4 [(google.api.field_behavior) = REQUIRED];
  int64 file_size = 5 [(google.api.field_behavior) = REQUIRED];
  string object_key = 6 [(google.api.field_behavior) = REQUIRED];
  string checksum = 7;
}

message ListPartnerAttachmentsRequest {
  string partner_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message PartnerAttachmentReply {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  PartnerAttachment data = 4;
  string trace_id = 5;
}

message PartnerAttachmentListReply {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated PartnerAttachment data = 4;
  string trace_id = 5;
}

message PartnerReply {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  Partner data = 4;
  string trace_id = 5;
}

message PartnerListReply {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated Partner data = 4;
  int32 total = 5;
  int32 page = 6;
  int32 page_size = 7;
  string trace_id = 8;
}
