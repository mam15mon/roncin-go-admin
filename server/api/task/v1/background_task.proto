syntax = "proto3";

package task.v1;

import "access/v1/access.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";

option go_package = "github.com/roncin/roncin-go-admin/server/api/task/v1;v1";

// BackgroundTaskService 后台任务追踪服务，只暴露查询与回放，
// 不暴露租约凭据，也不提供直接入队接口（入队由业务用例触发）。
service BackgroundTaskService {
  // ListBackgroundTasks 查询当前组织的后台任务。
  rpc ListBackgroundTasks(ListBackgroundTasksRequest) returns (ListBackgroundTasksResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.task.read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/background-tasks"};
  }

  // GetBackgroundTask 查询单个后台任务。
  rpc GetBackgroundTask(GetBackgroundTaskRequest) returns (GetBackgroundTaskResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.task.read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/background-tasks/{id}"};
  }

  // RequeueBackgroundTask 回放失败或死信任务：重置为待执行并清空租约。
  rpc RequeueBackgroundTask(RequeueBackgroundTaskRequest) returns (RequeueBackgroundTaskResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.task.requeue" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {
      post: "/api/v1/background-tasks/{id}/requeue"
      body: "*"
    };
  }
}

// BackgroundTaskKind 后台任务类型。
enum BackgroundTaskKind {
  BACKGROUND_TASK_KIND_UNSPECIFIED = 0;
  BACKGROUND_TASK_KIND_MASTER_DATA_IMPORT = 1;
  BACKGROUND_TASK_KIND_UNLOCODE_IMPORT = 2;
  BACKGROUND_TASK_KIND_ORDER_REMINDER = 3;
  BACKGROUND_TASK_KIND_INTEGRATION = 4;
  BACKGROUND_TASK_KIND_DINGTALK_NOTIFICATION = 5;
}

// BackgroundTaskStatus 后台任务状态。
enum BackgroundTaskStatus {
  BACKGROUND_TASK_STATUS_UNSPECIFIED = 0;
  BACKGROUND_TASK_STATUS_PENDING = 1;
  BACKGROUND_TASK_STATUS_RUNNING = 2;
  BACKGROUND_TASK_STATUS_SUCCEEDED = 3;
  BACKGROUND_TASK_STATUS_FAILED = 4;
  BACKGROUND_TASK_STATUS_DEAD_LETTER = 5;
}

// BackgroundTaskPhase 后台任务所处阶段。
enum BackgroundTaskPhase {
  BACKGROUND_TASK_PHASE_UNSPECIFIED = 0;
  BACKGROUND_TASK_PHASE_ACTIVE = 1;
  BACKGROUND_TASK_PHASE_HISTORY = 2;
}

// BackgroundTask 后台任务信息，不包含租约令牌与租约到期时间。
message BackgroundTask {
  string id = 1;
  BackgroundTaskKind kind = 2;
  string idempotency_key = 3;
  BackgroundTaskStatus status = 4;
  int32 attempts = 5;
  int32 max_attempts = 6;
  string next_run_at = 7;
  optional string last_error = 8;
  string created_at = 9;
  string updated_at = 10;
  optional string recipient_display_name = 11;
  optional string recipient_user_id = 12;
}

// ListBackgroundTasksRequest 查询后台任务列表请求，枚举为零值时不过滤。
message ListBackgroundTasksRequest {
  int32 page = 1;
  int32 page_size = 2;
  BackgroundTaskStatus status = 3;
  BackgroundTaskKind kind = 4;
  string start_time = 5;
  string end_time = 6;
  BackgroundTaskPhase phase = 7;
}

// GetBackgroundTaskRequest 查询单个后台任务请求。
message GetBackgroundTaskRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

// RequeueBackgroundTaskRequest 回放后台任务请求。
message RequeueBackgroundTaskRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

// GetBackgroundTaskResponse 单条后台任务响应。
message GetBackgroundTaskResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  BackgroundTask data = 4;
  string trace_id = 5;
}

message RequeueBackgroundTaskResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  BackgroundTask data = 4;
  string trace_id = 5;
}

// ListBackgroundTasksResponse 后台任务列表响应。
message ListBackgroundTasksResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated BackgroundTask data = 4;
  int32 total = 5;
  int32 page = 6;
  int32 page_size = 7;
  string trace_id = 8;
}
