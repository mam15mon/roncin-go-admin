syntax = "proto3";

package task.v1;

option go_package = "github.com/roncin/roncin-go-admin/server/api/task/v1;v1";

// ErrorReason 定义后台任务业务错误原因。
enum ErrorReason {
  TASK_UNSPECIFIED = 0;
  BACKGROUND_TASK_NOT_FOUND = 1;
  BACKGROUND_TASK_INVALID_ARGUMENT = 2;
  BACKGROUND_TASK_EXISTS = 3;
  BACKGROUND_TASK_LEASE_MISMATCH = 4;
  BACKGROUND_TASK_NO_TASK = 5;
  BACKGROUND_TASK_INVALID_STATUS = 6;
  BACKGROUND_TASK_NOT_REQUEUEABLE = 7;
}
