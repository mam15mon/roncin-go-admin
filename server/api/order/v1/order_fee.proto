}

message CancelApprovedOrderFeeSupplementRequest {
  string order_id = 1 [(google.api.field_behavior) = REQUIRED];
  string id = 2 [(google.api.field_behavior) = REQUIRED];
  // 目标费用乐观锁版本；版本竞争时稳定拒绝且零写入。
  uint64 expected_version = 3 [(google.api.field_behavior) = REQUIRED];
  string reason = 4 [(google.api.field_behavior) = REQUIRED];
}

message CancelApprovedOrderFeeSupplementResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  reserved 4;
  reserved "fee";
  string trace_id = 5;
  // 撤销成功后刷新的申请数据：申请保持 APPROVED，fee_id 为空表示生成费用已删除，
  // can_cancel=false 并携带阻断原因；不再返回已删除的费用实体。
  OrderFeeSupplementRequestData data = 6;
}

message FeeSupplementCommissionImpact {
  string commission_id = 1; string commission_no = 2; string employee_id = 3; string employee_name = 4;
  string base_currency = 5; string amount_before = 6; string amount_after = 7; string decrease_amount = 8;
  string excess_amount = 9; string commission_status = 10;
  string adjustment_direction = 11; string adjustment_amount = 12;
}

