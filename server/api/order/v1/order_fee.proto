syntax = "proto3";

package order.v1;

import "access/v1/access.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "order/v1/order.proto";

option go_package = "github.com/roncin/roncin-go-admin/server/api/order/v1;v1";

// OrderFeeService 订单费用录入服务。
// 管理订单费用明细；费用进入账单后，修改范围由财务自定义策略控制。
service OrderFeeService {
  // ListFeeOptions 获取费用录入所需的费用设置、计费单位、结算单位和币种候选项。
  rpc ListFeeOptions(ListFeeOptionsRequest) returns (ListFeeOptionsResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_ORDER_PERMISSION order_operation: "fee.read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/orders/{order_id}/fee-options"};
  }

  // ListFees 获取指定订单的费用列表。
  rpc ListFees(ListFeesRequest) returns (ListFeesResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_ORDER_PERMISSION order_operation: "fee.read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/orders/{order_id}/fees"};
  }

  // ResolveFeeExchangeRate 按费用发生日解析币种折本位币的公共参考汇率。
  rpc ResolveFeeExchangeRate(ResolveFeeExchangeRateRequest) returns (ResolveFeeExchangeRateResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_ORDER_PERMISSION order_operation: "fee.read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/orders/{order_id}/fee-exchange-rate"};
  }

  // AddFee 录入订单费用，总金额由服务端按数量乘单价精确计算。
  rpc AddFee(AddFeeRequest) returns (AddFeeResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_ORDER_PERMISSION order_operation: "fee.create" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {
      post: "/api/v1/orders/{order_id}/fees"
      body: "*"
    };
  }

  // UpdateFee 更新订单费用，总金额由服务端重新精确计算；已建账单费用仅允许按策略修改并同步草稿账单。
  rpc UpdateFee(UpdateFeeRequest) returns (UpdateFeeResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_ORDER_PERMISSION order_operation: "fee.update" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {
      put: "/api/v1/orders/{order_id}/fees/{id}"
      body: "*"
    };
  }

  // ConfirmFee 确认费用；确认后方可进入账单，未建账单时修改前必须先撤回确认。
  rpc ConfirmFee(ConfirmFeeRequest) returns (ConfirmFeeResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_ORDER_PERMISSION order_operation: "fee.update" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {
      post: "/api/v1/orders/{order_id}/fees/{id}/confirm"
      body: "*"
    };
  }

  // ReopenFee 撤回尚未进入账单的已确认费用，使其重新可编辑。
  rpc ReopenFee(ReopenFeeRequest) returns (ReopenFeeResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_ORDER_PERMISSION order_operation: "fee.update" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {
      post: "/api/v1/orders/{order_id}/fees/{id}/reopen"
      body: "*"
    };
  }

  // RemoveFee 作废尚未进入账单的订单费用，并保留完整历史数据。
  rpc RemoveFee(RemoveFeeRequest) returns (RemoveFeeResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_ORDER_PERMISSION order_operation: "fee.delete" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {delete: "/api/v1/orders/{order_id}/fees/{id}"};
  }

  // CreateOrderFeeSupplement 在业务锁或提成净额财务锁成立期间发起锁后应付费用补录申请。
  // 锁类型、锁代次与财务锁证据均由服务端在 Order 行锁内判定固化；双锁均不存在时
  // 稳定拒绝并引导普通费用新增。
  rpc CreateOrderFeeSupplement(CreateOrderFeeSupplementRequest) returns (CreateOrderFeeSupplementResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_ORDER_PERMISSION order_operation: "fee.create" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {
      post: "/api/v1/orders/{order_id}/fee-supplement-requests"
      body: "*"
    };
  }

  // ListOrderFeeSupplementRequests 订单维度分页读取补录申请。逐行授权
  // （fee.read 或发起人本人或实时 lock grant）在领域层执行，不得被组织级
  // fee.read 注解提前挡住，也不泄露无权申请。
  rpc ListOrderFeeSupplementRequests(ListOrderFeeSupplementRequestsRequest) returns (ListOrderFeeSupplementRequestsResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_AUTHENTICATED};
    option (google.api.http) = {get: "/api/v1/orders/{order_id}/fee-supplement-requests"};
  }

  // ApproveOrderFeeSupplement 审批通过补录申请：按申请固化的锁依据复核原始依据，
  // 在同一事务创建 CONFIRMED 补录费用、DECREASE+DRAFT 冲减建议并逐员工通知。
  rpc ApproveOrderFeeSupplement(ApproveOrderFeeSupplementRequest) returns (ApproveOrderFeeSupplementResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_AUTHENTICATED};
    option (google.api.http) = {
      post: "/api/v1/orders/{order_id}/fee-supplement-requests/{id}/approve"
      body: "*"
    };
  }

  // RejectOrderFeeSupplement 驳回补录申请：只写申请终态与审计，不产生费用或调整。
  rpc RejectOrderFeeSupplement(RejectOrderFeeSupplementRequest) returns (RejectOrderFeeSupplementResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_AUTHENTICATED};
    option (google.api.http) = {
      post: "/api/v1/orders/{order_id}/fee-supplement-requests/{id}/reject"
      body: "*"
    };
  }

  // WithdrawOrderFeeSupplement 发起人撤回本人仍处于 PENDING 的申请；与审批并发时
  // 在同一申请行锁内竞争，只有先提交的一方成功，撤回成功不产生费用或调整。
  rpc WithdrawOrderFeeSupplement(WithdrawOrderFeeSupplementRequest) returns (WithdrawOrderFeeSupplementResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_AUTHENTICATED};
    option (google.api.http) = {
      post: "/api/v1/orders/{order_id}/fee-supplement-requests/{id}/withdraw"
      body: "*"
    };
  }

  // CancelApprovedOrderFeeSupplement 专用作废已批准补录生成的费用：仅限最新有效、
  // CONFIRMED、无活动账单行且关联冲减从未确认/扣回的补录；费用与仍为 DRAFT 的
  // 关联冲减建议在同一事务转为 CANCELLED，APPROVED 申请保持不变。
  rpc CancelApprovedOrderFeeSupplement(CancelApprovedOrderFeeSupplementRequest) returns (CancelApprovedOrderFeeSupplementResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_AUTHENTICATED};
    option (google.api.http) = {
      post: "/api/v1/orders/{order_id}/fee-supplement-requests/{id}/cancel-fee"
      body: "*"
    };
  }

  rpc ListOrderFeeTagOptions(ListOrderFeeTagOptionsRequest) returns (ListOrderFeeTagOptionsResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_ORDER_PERMISSION order_operation: "fee.read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/orders/{order_id}/fee-tag-options"};
  }
  rpc BatchAssignOrderFeeTags(BatchAssignOrderFeeTagsRequest) returns (BatchAssignOrderFeeTagsResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_ORDER_PERMISSION order_operation: "fee.update" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {post: "/api/v1/orders/{order_id}/fee-tags/batch-assign" body: "*"};
  }
  rpc BatchRemoveOrderFeeTags(BatchRemoveOrderFeeTagsRequest) returns (BatchRemoveOrderFeeTagsResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_ORDER_PERMISSION order_operation: "fee.update" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {post: "/api/v1/orders/{order_id}/fee-tags/batch-remove" body: "*"};
  }
}

enum OrderFeeDirection {
  ORDER_FEE_DIRECTION_UNSPECIFIED = 0;
  ORDER_FEE_DIRECTION_RECEIVABLE = 1;
  ORDER_FEE_DIRECTION_PAYABLE = 2;
}

enum OrderFeeStatus {
  ORDER_FEE_STATUS_UNSPECIFIED = 0;
  ORDER_FEE_STATUS_DRAFT = 1;
  ORDER_FEE_STATUS_CONFIRMED = 2;
  ORDER_FEE_STATUS_BILLED = 3;
  ORDER_FEE_STATUS_CANCELLED = 4;
}

// OrderFee 是一条订单应收或应付费用。
// 所有十进制字段均使用普通十进制字符串，禁止科学计数法和浮点传输。
message OrderFee {
  string id = 1;
  string order_id = 2;
  OrderFeeDirection direction = 3;
  string fee_code = 4;
  string fee_name = 5;
  string settlement_party_id = 6;
  string settlement_party_name = 7;
  string billing_unit = 8;
  string quantity = 9;
  string unit_price = 10;
  string total_amount = 11;
  string currency = 12;
  string exchange_rate = 13;
  string expense_date = 14;
  optional string note = 15;
  string created_at = 16;
  string updated_at = 17;
  string exchange_rate_source = 18;
  string exchange_rate_date = 19;
  optional string exchange_rate_setting_id = 20;
  optional string fee_setting_id = 21;
  optional string billing_unit_id = 22;
  optional string fee_name_en = 23;
  optional string tax_rate = 24;
  optional string taxable_service_name = 25;
  OrderFeeStatus status = 26;
  bool tax_inclusive = 27;
  string net_amount = 28;
  string tax_amount = 29;
  string base_currency = 30;
  string base_currency_amount = 31;
  uint64 version = 32;
  optional string cancelled_at = 33;
  optional string cancelled_by = 34;
  optional string cancellation_reason = 35;
  repeated BusinessTagSummary tags = 36;
}

message ListFeesRequest {
  string order_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message ListFeeOptionsRequest {
  string order_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message OrderFeeSettlementPartyOption {
  string id = 1;
  string code = 2;
  string name = 3;
}

message OrderFeeCurrencyOption {
  string code = 1;
  string name = 2;
  int32 minor_unit = 3;
}

message OrderFeeSettingOption {
  string id = 1;
  string fee_code = 2;
  string name_zh = 3;
  optional string name_en = 4;
  optional string alias_name = 5;
  string default_currency = 6;
  string default_billing_unit_id = 7;
  string default_billing_unit_name = 8;
  string tax_rate = 9;
  string taxable_service_name = 10;
}

message OrderFeeBillingUnitOption {
  string id = 1;
  string code = 2;
  string name = 3;
}

message ListFeeOptionsResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated OrderFeeSettlementPartyOption settlement_parties = 4;
  repeated OrderFeeCurrencyOption currencies = 5;
  string trace_id = 6;
  string base_currency = 7;
  repeated OrderFeeSettingOption fee_settings = 8;
  repeated OrderFeeBillingUnitOption billing_units = 9;
  bool finance_locked = 10;
  optional string finance_lock_reason = 11;
  repeated string finance_lock_commission_nos = 12;
  string customer_id = 13;
  string customer_name = 14;
}

message AddFeeRequest {
  string order_id = 1 [(google.api.field_behavior) = REQUIRED];
  OrderFeeDirection direction = 2 [(google.api.field_behavior) = REQUIRED];
  reserved 3, 4, 6;
  reserved "fee_code", "fee_name", "billing_unit";
  string settlement_party_id = 5 [(google.api.field_behavior) = REQUIRED];
  string quantity = 7 [(google.api.field_behavior) = REQUIRED];
  string unit_price = 8 [(google.api.field_behavior) = REQUIRED];
  string currency = 9 [(google.api.field_behavior) = REQUIRED];
  reserved 10;
  string expense_date = 11 [(google.api.field_behavior) = REQUIRED];
  optional string note = 12;
  optional string exchange_rate_override = 13;
  string fee_setting_id = 14 [(google.api.field_behavior) = REQUIRED];
  string billing_unit_id = 15 [(google.api.field_behavior) = REQUIRED];
  string idempotency_key = 16 [(google.api.field_behavior) = REQUIRED];
  optional bool tax_inclusive = 17;
}

message UpdateFeeRequest {
  string order_id = 1 [(google.api.field_behavior) = REQUIRED];
  string id = 2 [(google.api.field_behavior) = REQUIRED];
  OrderFeeDirection direction = 3 [(google.api.field_behavior) = REQUIRED];
  reserved 4, 5, 7;
  reserved "fee_code", "billing_unit";
  string settlement_party_id = 6 [(google.api.field_behavior) = REQUIRED];
  string quantity = 8 [(google.api.field_behavior) = REQUIRED];
  string unit_price = 9 [(google.api.field_behavior) = REQUIRED];
  string currency = 10 [(google.api.field_behavior) = REQUIRED];
  reserved 11;
  string expense_date = 12 [(google.api.field_behavior) = REQUIRED];
  optional string note = 13;
  optional string exchange_rate_override = 14;
  string fee_setting_id = 15 [(google.api.field_behavior) = REQUIRED];
  string billing_unit_id = 16 [(google.api.field_behavior) = REQUIRED];
  uint64 expected_version = 17 [(google.api.field_behavior) = REQUIRED];
  optional bool tax_inclusive = 18;
  // tax_rate 仅在修改已进入草稿账单的费用时作为目标税率；不传时沿用费用项目默认或现有税率。
  optional string tax_rate = 19;
  // fee_name 仅覆盖当前费用及其草稿账单行快照，不修改费用设置主数据。
  optional string fee_name = 20;
}

message RemoveFeeRequest {
  string order_id = 1 [(google.api.field_behavior) = REQUIRED];
  string id = 2 [(google.api.field_behavior) = REQUIRED];
  uint64 expected_version = 3 [(google.api.field_behavior) = REQUIRED];
  // reason 作废原因：选填，最长 500 字。
  optional string reason = 4;
}

message ConfirmFeeRequest {
  string order_id = 1 [(google.api.field_behavior) = REQUIRED];
  string id = 2 [(google.api.field_behavior) = REQUIRED];
  uint64 expected_version = 3 [(google.api.field_behavior) = REQUIRED];
}

message ReopenFeeRequest {
  string order_id = 1 [(google.api.field_behavior) = REQUIRED];
  string id = 2 [(google.api.field_behavior) = REQUIRED];
  uint64 expected_version = 3 [(google.api.field_behavior) = REQUIRED];
  // reason 撤回原因：选填，最长 500 字。
  optional string reason = 4;
}

message ResolveFeeExchangeRateRequest {
  string order_id = 1 [(google.api.field_behavior) = REQUIRED];
  OrderFeeDirection direction = 2 [(google.api.field_behavior) = REQUIRED];
  string currency = 3 [(google.api.field_behavior) = REQUIRED];
  string expense_date = 4 [(google.api.field_behavior) = REQUIRED];
}

message ResolveFeeExchangeRateResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  string exchange_rate = 4;
  string exchange_rate_source = 5;
  string exchange_rate_date = 6;
  optional string exchange_rate_setting_id = 7;
  string trace_id = 8;
}

message ListFeesResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated OrderFee data = 4;
  string trace_id = 5;
}

message AddFeeResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  OrderFee data = 4;
  string trace_id = 5;
}

message UpdateFeeResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  OrderFee data = 4;
  string trace_id = 5;
}

message RemoveFeeResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  string trace_id = 4;
}

message ConfirmFeeResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  OrderFee data = 4;
  string trace_id = 5;
}

message ReopenFeeResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  OrderFee data = 4;
  string trace_id = 5;
}

message ListOrderFeeTagOptionsRequest {
  string order_id = 1 [(google.api.field_behavior) = REQUIRED];
  string keyword = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListOrderFeeTagOptionsResponse {
  repeated BusinessTagSummary tags = 1;
  int64 total = 2;
  string trace_id = 3;
}

message BatchAssignOrderFeeTagsRequest {
  string order_id = 1 [(google.api.field_behavior) = REQUIRED];
  repeated string fee_ids = 2 [(google.api.field_behavior) = REQUIRED];
  repeated string tag_ids = 3 [(google.api.field_behavior) = REQUIRED];
}

message BatchAssignOrderFeeTagsResponse {
  int32 assigned_count = 1;
  string trace_id = 2;
}

message BatchRemoveOrderFeeTagsRequest {
  string order_id = 1 [(google.api.field_behavior) = REQUIRED];
  repeated string fee_ids = 2 [(google.api.field_behavior) = REQUIRED];
  repeated string tag_ids = 3 [(google.api.field_behavior) = REQUIRED];
}

message BatchRemoveOrderFeeTagsResponse {
  int32 removed_count = 1;
  string trace_id = 2;
}

// -------------------------------------------------------------
// 锁单后费用补录申请
// -------------------------------------------------------------

// OrderFeeSupplementRequestData 是补录申请及其不可变费用快照的投影。
// 锁依据字段由服务端在 Order 行锁内判定固化，客户端传入值一律被忽略。
message OrderFeeSupplementRequestData {
  string id = 1;
  string order_id = 2;
  // 锁依据类型：BUSINESS / FINANCIAL / BOTH。
  string lock_basis = 3;
  optional uint64 business_lock_generation = 4;
  optional string financial_lock_evidence_version = 5;
  optional string financial_lock_evidence_hash = 6;
  // 提交当时固化的有效提成净额快照（8 位十进制字符串）。
  optional string financial_lock_net_amount = 7;
  // 状态：PENDING / APPROVED / REJECTED / WITHDRAWN。
  string status = 8;
  uint64 version = 9;
  // 不可变应付费用快照，字段语义与 OrderFee 对齐。
  OrderFeeDirection direction = 10;
  optional string fee_setting_id = 11;
  string fee_code = 12;
  string fee_name = 13;
  optional string fee_name_en = 14;
  string settlement_party_id = 15;
  string settlement_party_name = 16;
  optional string billing_unit_id = 17;
  string billing_unit = 18;
  optional string tax_rate = 19;
  optional string taxable_service_name = 20;
  string quantity = 21;
  string unit_price = 22;
  string total_amount = 23;
  bool tax_inclusive = 24;
  string net_amount = 25;
  string tax_amount = 26;
  string currency = 27;
  string exchange_rate = 28;
  string exchange_rate_source = 29;
  string exchange_rate_date = 30;
  optional string exchange_rate_setting_id = 31;
  string base_currency = 32;
  string base_currency_amount = 33;
  string expense_date = 34;
  optional string note = 35;
  string reason = 36;
  string requested_by = 37;
  string requested_at = 38;
  optional string decided_by = 39;
  optional string decided_at = 40;
  optional string decision_reason = 41;
  // 当前调用人能力投影：由后端按实时资格与申请状态计算，前端只消费结果。
  bool can_approve = 42;
  bool can_withdraw = 43;
  bool can_cancel = 44;
  // can_cancel=false 时的稳定阻断原因（如「已建账需先取消账单」「存在更晚有效补录」「冲减已确认或已扣回」）。
  optional string cancel_blocked_reason = 45;
  // APPROVED 申请生成费用的当前状态与 ID（费用已专用作废时为 CANCELLED）。
  optional string fee_id = 46;
  optional string fee_status = 47;
  // 当前是否仍存在具备实时 lock grant 的审批人；提交后资格全部失效时申请保持
  // PENDING 并投影 false，发起人仍可撤回。
  bool approver_available = 48;
}

message CreateOrderFeeSupplementRequest {
  string order_id = 1 [(google.api.field_behavior) = REQUIRED];
  // 补录仅接受正数应付成本；应收方向在服务边界与领域边界双重拒绝。
  OrderFeeDirection direction = 2 [(google.api.field_behavior) = REQUIRED];
  string fee_setting_id = 3 [(google.api.field_behavior) = REQUIRED];
  string settlement_party_id = 4 [(google.api.field_behavior) = REQUIRED];
  string billing_unit_id = 5 [(google.api.field_behavior) = REQUIRED];
  string quantity = 6 [(google.api.field_behavior) = REQUIRED];
  string unit_price = 7 [(google.api.field_behavior) = REQUIRED];
  string currency = 8 [(google.api.field_behavior) = REQUIRED];
  string expense_date = 9 [(google.api.field_behavior) = REQUIRED];
  optional string note = 10;
  optional string exchange_rate_override = 11;
  optional bool tax_inclusive = 12;
  // 补录原因必填，参与 request_fingerprint。
  string reason = 13 [(google.api.field_behavior) = REQUIRED];
  string idempotency_key = 14 [(google.api.field_behavior) = REQUIRED];
}

message CreateOrderFeeSupplementResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  OrderFeeSupplementRequestData data = 4;
  string trace_id = 5;
}

message ListOrderFeeSupplementRequestsRequest {
  string order_id = 1 [(google.api.field_behavior) = REQUIRED];
  int32 page = 2;
  int32 page_size = 3;
}

message ListOrderFeeSupplementRequestsData {
  repeated OrderFeeSupplementRequestData items = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListOrderFeeSupplementRequestsResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  ListOrderFeeSupplementRequestsData data = 4;
  string trace_id = 5;
}

message ApproveOrderFeeSupplementRequest {
  string order_id = 1 [(google.api.field_behavior) = REQUIRED];
  string id = 2 [(google.api.field_behavior) = REQUIRED];
  uint64 expected_version = 3 [(google.api.field_behavior) = REQUIRED];
}

message ApproveOrderFeeSupplementResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  OrderFeeSupplementRequestData data = 4;
  // 审批生成的 CONFIRMED 补录费用。
  OrderFee fee = 5;
  string trace_id = 6;
}

message RejectOrderFeeSupplementRequest {
  string order_id = 1 [(google.api.field_behavior) = REQUIRED];
  string id = 2 [(google.api.field_behavior) = REQUIRED];
  uint64 expected_version = 3 [(google.api.field_behavior) = REQUIRED];
  optional string reason = 4;
}

message RejectOrderFeeSupplementResponse {
