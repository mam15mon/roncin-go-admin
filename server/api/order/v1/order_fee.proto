syntax = "proto3";

package order.v1;

import "access/v1/access.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";

option go_package = "github.com/roncin/roncin-go-admin/server/api/order/v1;v1";

// OrderFeeService 订单费用录入服务。
// 本阶段只管理费用明细，不包含账单、开票、核销等财务生命周期。
service OrderFeeService {
  // ListFeeOptions 获取费用录入所需的费用设置、计费单位、结算单位和币种候选项。
  rpc ListFeeOptions(ListFeeOptionsRequest) returns (ListFeeOptionsResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_ORDER_PERMISSION order_operation: "fee.read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/orders/{order_id}/fee-options"};
  }

  // ListFees 获取指定订单的费用列表。
  rpc ListFees(ListFeesRequest) returns (ListFeesResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_ORDER_PERMISSION order_operation: "fee.read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/orders/{order_id}/fees"};
  }

  // ResolveFeeExchangeRate 按汇率（折本币）的时间标准、币种和收付方向预览汇率。
  rpc ResolveFeeExchangeRate(ResolveFeeExchangeRateRequest) returns (ResolveFeeExchangeRateResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_ORDER_PERMISSION order_operation: "fee.read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/orders/{order_id}/fee-exchange-rate"};
  }

  // AddFee 录入订单费用，总金额由服务端按数量乘单价精确计算。
  rpc AddFee(AddFeeRequest) returns (AddFeeResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_ORDER_PERMISSION order_operation: "fee.create" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {
      post: "/api/v1/orders/{order_id}/fees"
      body: "*"
    };
  }

  // UpdateFee 更新订单费用，总金额由服务端重新精确计算。
  rpc UpdateFee(UpdateFeeRequest) returns (UpdateFeeResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_ORDER_PERMISSION order_operation: "fee.update" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {
      put: "/api/v1/orders/{order_id}/fees/{id}"
      body: "*"
    };
  }

  // RemoveFee 删除尚未进入后续财务流程的订单费用。
  rpc RemoveFee(RemoveFeeRequest) returns (RemoveFeeResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_ORDER_PERMISSION order_operation: "fee.delete" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {delete: "/api/v1/orders/{order_id}/fees/{id}"};
  }
}

enum OrderFeeDirection {
  ORDER_FEE_DIRECTION_UNSPECIFIED = 0;
  ORDER_FEE_DIRECTION_RECEIVABLE = 1;
  ORDER_FEE_DIRECTION_PAYABLE = 2;
}

// OrderFee 是一条订单应收或应付费用。
// 所有十进制字段均使用普通十进制字符串，禁止科学计数法和浮点传输。
message OrderFee {
  string id = 1;
  string order_id = 2;
  OrderFeeDirection direction = 3;
  string fee_code = 4;
  string fee_name = 5;
  string settlement_party_id = 6;
  string settlement_party_name = 7;
  string billing_unit = 8;
  string quantity = 9;
  string unit_price = 10;
  string total_amount = 11;
  string currency = 12;
  string exchange_rate = 13;
  string expense_date = 14;
  optional string note = 15;
  string created_at = 16;
  string updated_at = 17;
  string exchange_rate_source = 18;
  string exchange_rate_date = 19;
  optional string exchange_rate_setting_id = 20;
  optional string fee_setting_id = 21;
  optional string billing_unit_id = 22;
  optional string fee_name_en = 23;
  optional string tax_rate = 24;
  optional string taxable_service_name = 25;
}

message ListFeesRequest {
  string order_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message ListFeeOptionsRequest {
  string order_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message OrderFeeSettlementPartyOption {
  string id = 1;
  string code = 2;
  string name = 3;
}

message OrderFeeCurrencyOption {
  string code = 1;
  string name = 2;
  int32 minor_unit = 3;
}

message OrderFeeSettingOption {
  string id = 1;
  string fee_code = 2;
  string name_zh = 3;
  optional string name_en = 4;
  optional string alias_name = 5;
  string default_currency = 6;
  string default_billing_unit_id = 7;
  string default_billing_unit_name = 8;
  string tax_rate = 9;
  string taxable_service_name = 10;
}

message OrderFeeBillingUnitOption {
  string id = 1;
  string code = 2;
  string name = 3;
}

message ListFeeOptionsResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated OrderFeeSettlementPartyOption settlement_parties = 4;
  repeated OrderFeeCurrencyOption currencies = 5;
  string trace_id = 6;
  string base_currency = 7;
  repeated OrderFeeSettingOption fee_settings = 8;
  repeated OrderFeeBillingUnitOption billing_units = 9;
}

message AddFeeRequest {
  string order_id = 1 [(google.api.field_behavior) = REQUIRED];
  OrderFeeDirection direction = 2 [(google.api.field_behavior) = REQUIRED];
  reserved 3, 4, 6;
  reserved "fee_code", "fee_name", "billing_unit";
  string settlement_party_id = 5 [(google.api.field_behavior) = REQUIRED];
  string quantity = 7 [(google.api.field_behavior) = REQUIRED];
  string unit_price = 8 [(google.api.field_behavior) = REQUIRED];
  string currency = 9 [(google.api.field_behavior) = REQUIRED];
  reserved 10;
  string expense_date = 11 [(google.api.field_behavior) = REQUIRED];
  optional string note = 12;
  optional string exchange_rate_override = 13;
  string fee_setting_id = 14 [(google.api.field_behavior) = REQUIRED];
  string billing_unit_id = 15 [(google.api.field_behavior) = REQUIRED];
}

message UpdateFeeRequest {
  string order_id = 1 [(google.api.field_behavior) = REQUIRED];
  string id = 2 [(google.api.field_behavior) = REQUIRED];
  OrderFeeDirection direction = 3 [(google.api.field_behavior) = REQUIRED];
  reserved 4, 5, 7;
  reserved "fee_code", "fee_name", "billing_unit";
  string settlement_party_id = 6 [(google.api.field_behavior) = REQUIRED];
  string quantity = 8 [(google.api.field_behavior) = REQUIRED];
  string unit_price = 9 [(google.api.field_behavior) = REQUIRED];
  string currency = 10 [(google.api.field_behavior) = REQUIRED];
  reserved 11;
  string expense_date = 12 [(google.api.field_behavior) = REQUIRED];
  optional string note = 13;
  optional string exchange_rate_override = 14;
  string fee_setting_id = 15 [(google.api.field_behavior) = REQUIRED];
  string billing_unit_id = 16 [(google.api.field_behavior) = REQUIRED];
}

message RemoveFeeRequest {
  string order_id = 1 [(google.api.field_behavior) = REQUIRED];
  string id = 2 [(google.api.field_behavior) = REQUIRED];
}

message ResolveFeeExchangeRateRequest {
  string order_id = 1 [(google.api.field_behavior) = REQUIRED];
  OrderFeeDirection direction = 2 [(google.api.field_behavior) = REQUIRED];
  string currency = 3 [(google.api.field_behavior) = REQUIRED];
  string expense_date = 4 [(google.api.field_behavior) = REQUIRED];
}

message ResolveFeeExchangeRateResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  string exchange_rate = 4;
  string exchange_rate_source = 5;
  string exchange_rate_date = 6;
  optional string exchange_rate_setting_id = 7;
  string trace_id = 8;
}

message ListFeesResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated OrderFee data = 4;
  string trace_id = 5;
}

message AddFeeResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  OrderFee data = 4;
  string trace_id = 5;
}

message UpdateFeeResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  OrderFee data = 4;
  string trace_id = 5;
}

message RemoveFeeResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  string trace_id = 4;
}
