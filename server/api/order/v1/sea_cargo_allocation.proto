syntax = "proto3";

package order.v1;

import "access/v1/access.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";

option go_package = "github.com/roncin/roncin-go-admin/server/api/order/v1;v1";

// SeaSharedContainerService 管理明确标记为客户拼货的跨订单共享物理箱。
service SeaSharedContainerService {
  rpc ListSeaSharedContainers(ListSeaSharedContainersRequest) returns (ListSeaSharedContainersResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_ORDER_PERMISSION order_operation: "read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/orders/sea-shared-containers"};
  }
  rpc GetSeaSharedContainer(GetSeaSharedContainerRequest) returns (GetSeaSharedContainerResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_ORDER_PERMISSION order_operation: "read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/orders/sea-shared-containers/{id}"};
  }
  rpc ListSeaSharedContainerCandidates(ListSeaSharedContainerCandidatesRequest) returns (ListSeaSharedContainerCandidatesResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_ORDER_PERMISSION order_operation: "read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/orders/sea-shared-container-candidates"};
  }
  rpc CreateSeaSharedContainer(CreateSeaSharedContainerRequest) returns (CreateSeaSharedContainerResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_ORDER_PERMISSION order_operation: "update" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {post: "/api/v1/orders/sea-shared-containers" body: "*"};
  }
  rpc UpdateSeaSharedContainer(UpdateSeaSharedContainerRequest) returns (UpdateSeaSharedContainerResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_ORDER_PERMISSION order_operation: "update" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {put: "/api/v1/orders/sea-shared-containers/{id}" body: "*"};
  }
  rpc DeleteSeaSharedContainer(DeleteSeaSharedContainerRequest) returns (DeleteSeaSharedContainerResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_ORDER_PERMISSION order_operation: "update" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {delete: "/api/v1/orders/sea-shared-containers/{id}"};
  }
  rpc SaveSeaSharedContainerAllocationsDraft(SaveSeaSharedContainerAllocationsDraftRequest) returns (SaveSeaSharedContainerAllocationsDraftResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_ORDER_PERMISSION order_operation: "update" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {put: "/api/v1/orders/sea-shared-containers/{id}/allocations/draft" body: "*"};
  }
  rpc ConfirmSeaSharedContainer(ConfirmSeaSharedContainerRequest) returns (ConfirmSeaSharedContainerResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_ORDER_PERMISSION order_operation: "update" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {post: "/api/v1/orders/sea-shared-containers/{id}/confirm" body: "*"};
  }
  rpc WithdrawSeaSharedContainer(WithdrawSeaSharedContainerRequest) returns (WithdrawSeaSharedContainerResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_ORDER_PERMISSION order_operation: "update" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {post: "/api/v1/orders/sea-shared-containers/{id}/withdraw" body: "*"};
  }
}

enum SeaSharedContainerStatus {
  SEA_SHARED_CONTAINER_STATUS_UNSPECIFIED = 0;
  SEA_SHARED_CONTAINER_STATUS_DRAFT = 1;
  SEA_SHARED_CONTAINER_STATUS_CONFIRMED = 2;
}

message SeaSharedContainerInput {
  string transport_execution_id = 1 [(google.api.field_behavior) = REQUIRED];
  string container_no = 2 [(google.api.field_behavior) = REQUIRED];
  string container_spec_id = 3 [(google.api.field_behavior) = REQUIRED];
  optional string seal_no = 4;
  int32 package_count = 5 [(google.api.field_behavior) = REQUIRED];
  string gross_weight_kg = 6 [(google.api.field_behavior) = REQUIRED];
  string volume_cbm = 7 [(google.api.field_behavior) = REQUIRED];
  optional string note = 8;
}

message SeaSharedContainerAllocationInput {
  string order_id = 1 [(google.api.field_behavior) = REQUIRED];
  string house_bill_id = 2 [(google.api.field_behavior) = REQUIRED];
  string cargo_item_id = 3 [(google.api.field_behavior) = REQUIRED];
  int32 package_count = 4 [(google.api.field_behavior) = REQUIRED];
  string gross_weight_kg = 5 [(google.api.field_behavior) = REQUIRED];
  string volume_cbm = 6 [(google.api.field_behavior) = REQUIRED];
  uint64 expected_order_version = 7 [(google.api.field_behavior) = REQUIRED];
  uint64 expected_link_version = 8 [(google.api.field_behavior) = REQUIRED];
  uint64 expected_house_bill_version = 9 [(google.api.field_behavior) = REQUIRED];
  uint64 expected_cargo_item_version = 10 [(google.api.field_behavior) = REQUIRED];
}

message SeaSharedContainerAllocation {
  string id = 1;
  string shared_container_id = 2;
  string order_id = 3;
  string order_no = 4;
  string house_bill_id = 5;
  string house_no = 6;
  string cargo_item_id = 7;
  string cargo_name = 8;
  int32 package_count = 9;
  string gross_weight_kg = 10;
  string volume_cbm = 11;
  uint64 version = 12;
  string created_at = 13;
  string updated_at = 14;
  uint64 order_version = 15;
  uint64 link_version = 16;
  uint64 house_bill_version = 17;
  uint64 cargo_item_version = 18;
}

message SeaSharedContainerProgress {
  int32 allocated_package_count = 1;
  string allocated_gross_weight_kg = 2;
  string allocated_volume_cbm = 3;
  int32 remaining_package_count = 4;
  string remaining_gross_weight_kg = 5;
  string remaining_volume_cbm = 6;
  bool container_balanced = 7;
  bool cargo_balanced = 8;
}

message SeaSharedContainer {
  string id = 1;
  string organization_id = 2;
  string transport_execution_id = 3;
  string container_no = 4;
  string container_spec_id = 5;
  string container_spec_name = 6;
  optional string seal_no = 7;
  int32 package_count = 8;
  string gross_weight_kg = 9;
  string volume_cbm = 10;
  SeaSharedContainerStatus status = 11;
  optional string confirmed_at = 12;
  optional string confirmed_by = 13;
  optional string confirmed_by_name = 14;
  optional string note = 15;
  uint64 version = 16;
  repeated SeaSharedContainerAllocation allocations = 17;
  SeaSharedContainerProgress progress = 18;
  string created_at = 19;
  string updated_at = 20;
}

message SeaSharedContainerCandidateCargoItem {
  string id = 1;
  string cargo_name = 2;
  int32 package_count = 3;
  string gross_weight_kg = 4;
  string volume_cbm = 5;
  uint64 version = 6;
}

message SeaSharedContainerCandidateOrder {
  string order_id = 1;
  string order_no = 2;
  string house_bill_id = 3;
  string house_no = 4;
  uint64 order_version = 5;
  uint64 link_version = 6;
  uint64 house_bill_version = 7;
  repeated SeaSharedContainerCandidateCargoItem cargo_items = 8;
}

message ListSeaSharedContainersRequest {
  string transport_execution_id = 1 [(google.api.field_behavior) = REQUIRED];
  int32 page = 2;
  int32 page_size = 3;
  string keyword = 4;
}

message ListSeaSharedContainersResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated SeaSharedContainer data = 4;
  string trace_id = 5;
  int32 total = 6;
  int32 page = 7;
  int32 page_size = 8;
}

message GetSeaSharedContainerRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message GetSeaSharedContainerResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  SeaSharedContainer data = 4;
  string trace_id = 5;
}

message ListSeaSharedContainerCandidatesRequest {
  string transport_execution_id = 1 [(google.api.field_behavior) = REQUIRED];
  int32 page = 2;
  int32 page_size = 3;
  string keyword = 4;
}

message ListSeaSharedContainerCandidatesResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated SeaSharedContainerCandidateOrder data = 4;
  string trace_id = 5;
  int32 total = 6;
  int32 page = 7;
  int32 page_size = 8;
}

message CreateSeaSharedContainerRequest {
  SeaSharedContainerInput input = 1 [(google.api.field_behavior) = REQUIRED];
}

message CreateSeaSharedContainerResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  SeaSharedContainer data = 4;
  string trace_id = 5;
}

message UpdateSeaSharedContainerRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  uint64 expected_version = 2 [(google.api.field_behavior) = REQUIRED];
  SeaSharedContainerInput input = 3 [(google.api.field_behavior) = REQUIRED];
}

message UpdateSeaSharedContainerResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  SeaSharedContainer data = 4;
  string trace_id = 5;
}

message DeleteSeaSharedContainerRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  uint64 expected_version = 2 [(google.api.field_behavior) = REQUIRED];
}

message DeleteSeaSharedContainerResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  string trace_id = 4;
}

message SaveSeaSharedContainerAllocationsDraftRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  uint64 expected_version = 2 [(google.api.field_behavior) = REQUIRED];
  repeated SeaSharedContainerAllocationInput allocations = 3;
}

message SaveSeaSharedContainerAllocationsDraftResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  SeaSharedContainer data = 4;
  string trace_id = 5;
}

message ConfirmSeaSharedContainerRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  uint64 expected_version = 2 [(google.api.field_behavior) = REQUIRED];
}

message ConfirmSeaSharedContainerResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  SeaSharedContainer data = 4;
  string trace_id = 5;
}

message WithdrawSeaSharedContainerRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  uint64 expected_version = 2 [(google.api.field_behavior) = REQUIRED];
}

message WithdrawSeaSharedContainerResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  SeaSharedContainer data = 4;
  string trace_id = 5;
}
