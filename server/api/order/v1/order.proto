syntax = "proto3";

package order.v1;

import "access/v1/access.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "order/v1/order_personnel.proto";
import "order/v1/order_shipping_document.proto";

option go_package = "github.com/roncin/roncin-go-admin/server/api/order/v1;v1";

// OrderService 订单核心服务。
service OrderService {
  rpc MatchSeaMasterBillCandidate(MatchSeaMasterBillCandidateRequest) returns (MatchSeaMasterBillCandidateResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_ORDER_PERMISSION order_operation: "read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/orders/sea-master-bill-candidate"};
  }

  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_ORDER_PERMISSION order_operation: "read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/orders/{id}"};
  }

  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_ORDER_PERMISSION order_operation: "read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/orders"};
  }

  rpc CheckOrderReference(CheckOrderReferenceRequest) returns (CheckOrderReferenceResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_ORDER_PERMISSION order_operation: "create" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/order-reference-check"};
  }

  rpc ListPersonnelOptions(ListPersonnelOptionsRequest) returns (ListPersonnelOptionsResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_ORDER_PERMISSION order_operation: "create" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/order-personnel-options"};
  }

  rpc ListOrderConsolidations(ListOrderConsolidationsRequest) returns (ListOrderConsolidationsResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_ORDER_PERMISSION order_operation: "read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/orders/{id}/consolidations"};
  }

  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_ORDER_PERMISSION order_operation: "create" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {
      post: "/api/v1/orders"
      body: "*"
    };
  }

  rpc UpdateOrder(UpdateOrderRequest) returns (UpdateOrderResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_ORDER_PERMISSION order_operation: "update" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {
      put: "/api/v1/orders/{id}"
      body: "*"
    };
  }

  rpc TransitionOrderStatus(TransitionOrderStatusRequest) returns (TransitionOrderStatusResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_ORDER_PERMISSION order_operation: "transition" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {
      post: "/api/v1/orders/{id}/status"
      body: "*"
    };
  }

  rpc TransitionOrderTermination(TransitionOrderTerminationRequest) returns (TransitionOrderTerminationResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_ORDER_PERMISSION order_operation: "transition" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {
      post: "/api/v1/orders/{id}/termination"
      body: "*"
    };
  }

  rpc TransitionOrderClosure(TransitionOrderClosureRequest) returns (TransitionOrderClosureResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_ORDER_PERMISSION order_operation: "transition" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {
      post: "/api/v1/orders/{id}/closure"
      body: "*"
    };
  }
}

// BusinessType 业务类型。
enum BusinessType {
  BUSINESS_TYPE_UNSPECIFIED = 0;
  BUSINESS_TYPE_SE = 1;
  BUSINESS_TYPE_SI = 2;
  BUSINESS_TYPE_AE = 3;
  BUSINESS_TYPE_AI = 4;
  BUSINESS_TYPE_LAND = 5;
  BUSINESS_TYPE_RAIL = 6;
}

// TradeDirection 贸易进出口方向。
enum TradeDirection {
  TRADE_DIRECTION_UNSPECIFIED = 0;
  TRADE_DIRECTION_EXPORT = 1;
  TRADE_DIRECTION_IMPORT = 2;
}

// TradeTerm 国际贸易术语。
enum TradeTerm {
  TRADE_TERM_UNSPECIFIED = 0;
  TRADE_TERM_EXW = 1;
  TRADE_TERM_FCA = 2;
  TRADE_TERM_FOB = 3;
  TRADE_TERM_CFR = 4;
  TRADE_TERM_CIF = 5;
  TRADE_TERM_CPT = 6;
  TRADE_TERM_CIP = 7;
  TRADE_TERM_DAP = 8;
  TRADE_TERM_DPU = 9;
  TRADE_TERM_DDU = 10;
  TRADE_TERM_DDP = 11;
  TRADE_TERM_LDP = 12;
}

// PaymentTerm 付款方式条款。
enum PaymentTerm {
  PAYMENT_TERM_UNSPECIFIED = 0;
  PAYMENT_TERM_PREPAID = 1;
  PAYMENT_TERM_COLLECT = 2;
}

// ShipmentType 装载类型。
enum ShipmentType {
  SHIPMENT_TYPE_UNSPECIFIED = 0;
  SHIPMENT_TYPE_FCL = 1;
  SHIPMENT_TYPE_LCL = 2;
  SHIPMENT_TYPE_BREAK_BULK = 3;
}

// ContainerOwnership 集装箱箱源归属。
enum ContainerOwnership {
  CONTAINER_OWNERSHIP_UNSPECIFIED = 0;
  CONTAINER_OWNERSHIP_COC = 1;
  CONTAINER_OWNERSHIP_SOC = 2;
}

// ShipmentMode 运输模式。
enum ShipmentMode {
  SHIPMENT_MODE_UNSPECIFIED = 0;
  SHIPMENT_MODE_TRADITIONAL_FORWARDING = 1;
  SHIPMENT_MODE_CROSS_BORDER = 2;
}

// OrderReferenceType 订单业务编号类型。
enum OrderReferenceType {
  ORDER_REFERENCE_TYPE_UNSPECIFIED = 0;
  ORDER_REFERENCE_TYPE_CUSTOMER = 1;
  ORDER_REFERENCE_TYPE_INTERNAL = 2;
}

// OrderNumberFilterType 订单列表复合单号查询类型。
enum OrderNumberFilterType {
  ORDER_NUMBER_FILTER_TYPE_UNSPECIFIED = 0;
  ORDER_NUMBER_FILTER_TYPE_ORDER = 1;
  ORDER_NUMBER_FILTER_TYPE_MASTER = 2;
  ORDER_NUMBER_FILTER_TYPE_CONSOLIDATED_MASTER = 3;
}

// OrderFlowStatus 海运出口订单主流程状态。
enum OrderFlowStatus {
  ORDER_FLOW_STATUS_UNSPECIFIED = 0;
  ORDER_FLOW_STATUS_DRAFT = 1;
  ORDER_FLOW_STATUS_BOOKED = 2;
  ORDER_FLOW_STATUS_SPACE_ALLOCATED = 3;
  ORDER_FLOW_STATUS_TRUCKING_ARRANGED = 4;
  ORDER_FLOW_STATUS_DOCUMENT_CUTOFF = 5;
  ORDER_FLOW_STATUS_CUSTOMS_DECLARATION_ARRANGED = 6;
  ORDER_FLOW_STATUS_DOCUMENT_RELEASED = 7;
}

// OrderTerminationStatus 订单终止处理状态。
enum OrderTerminationStatus {
  ORDER_TERMINATION_STATUS_UNSPECIFIED = 0;
  ORDER_TERMINATION_STATUS_ACTIVE = 1;
  ORDER_TERMINATION_STATUS_TERMINATING = 2;
  ORDER_TERMINATION_STATUS_TERMINATED = 3;
}

// OrderTerminationType 订单终止原因类别。
enum OrderTerminationType {
  ORDER_TERMINATION_TYPE_UNSPECIFIED = 0;
  ORDER_TERMINATION_TYPE_CUSTOMER_CANCEL = 1;
  ORDER_TERMINATION_TYPE_CARRIER_CANCEL = 2;
  ORDER_TERMINATION_TYPE_CUSTOMS_RETURN = 3;
  ORDER_TERMINATION_TYPE_OPERATION_CANCEL = 4;
  ORDER_TERMINATION_TYPE_OTHER = 5;
}

// OrderClosureStatus 订单业务与财务结案状态。
enum OrderClosureStatus {
  ORDER_CLOSURE_STATUS_UNSPECIFIED = 0;
  ORDER_CLOSURE_STATUS_OPEN = 1;
  ORDER_CLOSURE_STATUS_CLOSED = 2;
}

// OrderAllowedAction 服务端计算的订单可执行动作。
enum OrderAllowedAction {
  ORDER_ALLOWED_ACTION_UNSPECIFIED = 0;
  ORDER_ALLOWED_ACTION_EDIT = 1;
  ORDER_ALLOWED_ACTION_TRANSITION_FLOW = 2;
  ORDER_ALLOWED_ACTION_START_TERMINATION = 3;
  ORDER_ALLOWED_ACTION_COMPLETE_TERMINATION = 4;
  ORDER_ALLOWED_ACTION_CANCEL_TERMINATION = 5;
  ORDER_ALLOWED_ACTION_CLOSE = 6;
  ORDER_ALLOWED_ACTION_REOPEN = 7;
}

// Order 订单核心信息。
// BusinessTagSummary 订单返回的组织标签概要。
message BusinessTagSummary {
  string id = 1;
  string name = 2;
  string group_id = 3;
  string group_name = 4;
  string group_color = 5;
  bool enabled = 6;
}

message Order {
  string id = 1;
  string organization_id = 2;
  string order_no = 3;
  string customer_id = 4;
  optional string carrier_id = 5;
  optional string booking_agent_id = 6;
  BusinessType business_type = 7;
  TradeDirection trade_direction = 8;
  TradeTerm trade_term = 9;
  PaymentTerm payment_term = 10;
  optional ShipmentType shipment_type = 11;
  optional ContainerOwnership container_ownership = 12;
  optional ShipmentMode shipment_mode = 13;
  OrderFlowStatus flow_status = 14;
  reserved 15;
  reserved "status_template_id";
  repeated string service_type_ids = 16;
  repeated string cargo_category_ids = 17;
  optional string origin_location_id = 18;
  optional string destination_location_id = 19;
  optional string discharge_location_id = 20;
  optional string transit_location_id = 21;
  optional string vessel_voyage = 22;
  optional string etd = 23;
  optional string eta = 24;
  optional string si_cutoff = 25;
  optional string doc_cutoff = 26;
  optional string customs_cutoff = 27;
  optional string vgm_cutoff = 28;
  optional string goods_description = 29;
  optional int32 total_packages = 30;
  optional string total_package_unit = 31;
  optional string special_requirements = 32;
  optional string order_date = 33;
  optional string notes = 34;
  string created_at = 35;
  string updated_at = 36;
  optional string customer_reference_no = 37;
  optional string foreign_agent_id = 38;
  optional string contract_no = 39;
  optional string cargo_value = 40;
  optional string cargo_currency = 41;
  optional string internal_reference_no = 42;
  optional string shipping_agent_id = 43;
  optional string insurance_premium = 44;
  optional string insurance_currency = 45;
  optional string un_number = 46;
  optional string hazard_class = 47;
  optional string factory_name = 48;
  optional string cargo_ready_at = 49;
  optional string loading_terms = 50;
  optional string received_at = 51;
  string organization_name = 52;
  bool can_modify = 53;
  optional string booking_notes = 54;
  optional string allocation_notes = 55;
  optional string operation_notes = 56;
  repeated OrderShippingDocument shipping_documents = 57;
  repeated OrderContainerRequest container_requests = 58;
  optional string declaration_cutoff_at = 59;
  optional double total_gross_weight_kg = 60;
  optional double total_volume_cbm = 61;
  OrderTerminationStatus termination_status = 62;
  optional OrderTerminationType termination_type = 63;
  optional string termination_reason = 64;
  optional string terminated_at = 65;
  optional string terminated_by = 66;
  OrderClosureStatus closure_status = 67;
  optional string closure_reason = 68;
  optional string closed_at = 69;
  optional string closed_by = 70;
  uint64 version = 71;
  bool has_active_exception = 72;
  int32 active_exception_count = 73;
  repeated OrderAllowedAction allowed_actions = 74;
  optional string shipper_short_name = 75;
  optional string consignee_short_name = 76;
  optional string locked_at = 77;
  bool is_shared = 78;
  repeated BusinessTagSummary tags = 79;
  repeated OrderFlowStatus allowed_target_flow_statuses = 80;
  optional SeaMasterBillSummary sea_master_bill = 81;
}

message OrderCargoMeasurement {
  int32 packages = 1;
  double gross_weight_kg = 2;
  double volume_cbm = 3;
}

message OrderConsolidationMember {
  string order_id = 1;
  string order_no = 2;
  optional string customer_reference_no = 3;
  repeated string house_nos = 4;
  OrderCargoMeasurement entrusted = 5;
  OrderCargoMeasurement actual = 6;
}

message OrderConsolidationSummary {
  string consolidation_id = 1;
  string master_no = 2;
  int32 member_count = 3;
  OrderCargoMeasurement entrusted = 4;
  OrderCargoMeasurement actual = 5;
  repeated OrderConsolidationMember members = 6;
}

// OrderShippingDocumentInput 订单表单中的分单输入。
message OrderShippingDocumentInput {
  optional string id = 1;
  reserved 2;
  reserved "master_no";
  string house_no = 3 [(google.api.field_behavior) = REQUIRED];
  // release_type 是分单（HBL）签放方式。
  optional string release_type = 4;
  optional string note = 5;
  reserved 6, 7;
  reserved "master_document_type", "master_release_method";
}

// OrderContainerRequestInput 订单订舱阶段的箱型箱量输入。
message OrderContainerRequestInput {
  optional string id = 1;
  string container_spec_id = 2 [(google.api.field_behavior) = REQUIRED];
  int32 quantity = 3 [(google.api.field_behavior) = REQUIRED];
}

// OrderContainerRequest 订单订舱阶段的箱型箱量计划。
message OrderContainerRequest {
  string id = 1;
  string order_id = 2;
  string container_spec_id = 3;
  int32 quantity = 4;
  string created_at = 5;
  string updated_at = 6;
}

// OrderPersonnelAssignmentInput 新建订单时的协作人员配置。
message OrderPersonnelAssignmentInput {
  string user_id = 1 [(google.api.field_behavior) = REQUIRED];
  string organization_id = 2 [(google.api.field_behavior) = REQUIRED];
  OrderPersonnelRole role = 3 [(google.api.field_behavior) = REQUIRED];
}

// OrderPersonnelOption 订单人员及其所属公司候选项。
message OrderPersonnelOption {
  string user_id = 1;
  string display_name = 2;
  string organization_id = 3;
  string organization_name = 4;
}

// OrderServiceSelection 订单服务类型选择。
message OrderServiceSelection {
  string id = 1;
  string order_id = 2;
  string master_data_item_id = 3;
  string created_at = 4;
}

// OrderCargoSelection 订单货物类别选择。
message OrderCargoSelection {
  string id = 1;
  string order_id = 2;
  string master_data_item_id = 3;
  string created_at = 4;
}

// OrderStatusLog 订单状态流转记录。
message OrderStatusLog {
  string id = 1;
  string order_id = 2;
  string from_status = 3;
  string to_status = 4;
  optional string action = 5;
  optional string reason = 6;
  optional string operator_id = 7;
  string changed_at = 8;
}

// GetOrderRequest 获取订单详情请求。
message GetOrderRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

// ListOrdersRequest 获取订单列表请求。
message ListOrdersRequest {
  int32 page = 1;
  int32 page_size = 2;
  string keyword = 3;
  optional OrderFlowStatus flow_status = 4;
  optional BusinessType business_type = 5;
  string customer_id = 6;
  optional OrderTerminationStatus termination_status = 7;
  optional OrderClosureStatus closure_status = 8;
  optional bool has_active_exception = 9;
  optional OrderNumberFilterType number_type = 10;
  string number_keyword = 11;
  string created_at_from = 12;
  string created_at_to = 13;
  string etd_from = 14;
  string etd_to = 15;
  string eta_from = 16;
  string eta_to = 17;
  string status_time_from = 18;
  string status_time_to = 19;
  string locked_at_from = 20;
  string locked_at_to = 21;
  string origin_location_id = 22;
  string destination_location_id = 23;
  string carrier_id = 24;
  string consignee_short_name = 25;
  string shipper_short_name = 26;
  string operator_id = 27;
  string operator_organization_id = 28;
  string sales_id = 29;
  string sales_organization_id = 30;
  string customer_service_id = 31;
  string customer_service_organization_id = 32;
  string creator_id = 33;
  string creator_organization_id = 34;
  repeated string tag_ids = 35;
  optional bool is_locked = 37;
  optional bool is_shared = 38;
}

// CheckOrderReferenceRequest 检查订单业务编号是否重复。
message CheckOrderReferenceRequest {
  OrderReferenceType reference_type = 1 [(google.api.field_behavior) = REQUIRED];
  string reference_no = 2 [(google.api.field_behavior) = REQUIRED];
  optional string customer_id = 3;
  optional string exclude_order_id = 4;
}

message ListPersonnelOptionsRequest {
  BusinessType business_type = 1 [(google.api.field_behavior) = REQUIRED];
  string keyword = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListOrderConsolidationsRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

// OrderReferenceCheck 订单业务编号查重结果。
message OrderReferenceCheck {
  bool duplicate = 1;
  optional string order_id = 2;
  optional string order_no = 3;
}

// CreateOrderRequest 创建订单请求。
message CreateOrderRequest {
  string customer_id = 1 [(google.api.field_behavior) = REQUIRED];
  BusinessType business_type = 2 [(google.api.field_behavior) = REQUIRED];
  TradeDirection trade_direction = 3 [(google.api.field_behavior) = REQUIRED];
  TradeTerm trade_term = 4 [(google.api.field_behavior) = REQUIRED];
  PaymentTerm payment_term = 5 [(google.api.field_behavior) = REQUIRED];
  reserved 6;
  reserved "status_template_id";
  optional string carrier_id = 7;
  optional string booking_agent_id = 8;
  optional ShipmentType shipment_type = 9;
  optional ContainerOwnership container_ownership = 10;
  optional ShipmentMode shipment_mode = 11;
  repeated string service_type_ids = 12;
  repeated string cargo_category_ids = 13;
  optional string origin_location_id = 14;
  optional string destination_location_id = 15;
  optional string discharge_location_id = 16;
  optional string transit_location_id = 17;
  optional string vessel_voyage = 18;
  optional string etd = 19;
  optional string eta = 20;
  optional string si_cutoff = 21;
  optional string doc_cutoff = 22;
  optional string customs_cutoff = 23;
  optional string vgm_cutoff = 24;
  optional string goods_description = 25;
  optional int32 total_packages = 26;
  optional string total_package_unit = 27;
  optional string special_requirements = 28;
  optional string order_date = 29;
  optional string notes = 30;
  optional string customer_reference_no = 31;
  optional string foreign_agent_id = 32;
  optional string contract_no = 33;
  optional string cargo_value = 34;
  optional string cargo_currency = 35;
  optional string internal_reference_no = 36;
  optional string shipping_agent_id = 37;
  optional string insurance_premium = 38;
  optional string insurance_currency = 39;
  optional string un_number = 40;
  optional string hazard_class = 41;
  optional string factory_name = 42;
  optional string cargo_ready_at = 43;
  optional string loading_terms = 44;
  optional string received_at = 45;
  optional string booking_notes = 46;
  optional string allocation_notes = 47;
  optional string operation_notes = 48;
  repeated OrderPersonnelAssignmentInput personnel_assignments = 49;
  repeated OrderShippingDocumentInput shipping_documents = 50;
  repeated OrderContainerRequestInput container_requests = 51;
  optional string declaration_cutoff_at = 52;
  optional double total_gross_weight_kg = 53;
  optional double total_volume_cbm = 54;
  optional string shipper_short_name = 55;
  optional string consignee_short_name = 56;
  optional SeaMasterBillInput sea_master_bill = 57;
}

// UpdateOrderRequest 更新草稿订单请求（禁止修改 order_no 和生命周期状态）。
message UpdateOrderRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  uint64 expected_version = 2 [(google.api.field_behavior) = REQUIRED];
  optional string customer_id = 3;
  optional BusinessType business_type = 4;
  optional TradeDirection trade_direction = 5;
  optional TradeTerm trade_term = 6;
  optional PaymentTerm payment_term = 7;
  optional string carrier_id = 8;
  optional string booking_agent_id = 9;
  optional ShipmentType shipment_type = 10;
  optional ContainerOwnership container_ownership = 11;
  optional ShipmentMode shipment_mode = 12;
  repeated string service_type_ids = 13;
  repeated string cargo_category_ids = 14;
  optional string origin_location_id = 15;
  optional string destination_location_id = 16;
  optional string discharge_location_id = 17;
  optional string transit_location_id = 18;
  optional string vessel_voyage = 19;
  optional string etd = 20;
  optional string eta = 21;
  optional string si_cutoff = 22;
  optional string doc_cutoff = 23;
  optional string customs_cutoff = 24;
  optional string vgm_cutoff = 25;
  optional string goods_description = 26;
  optional int32 total_packages = 27;
  optional string total_package_unit = 28;
  optional string special_requirements = 29;
  optional string order_date = 30;
  optional string notes = 31;
  optional string customer_reference_no = 32;
  optional string foreign_agent_id = 33;
  optional string contract_no = 34;
  optional string cargo_value = 35;
  optional string cargo_currency = 36;
  optional string internal_reference_no = 37;
  optional string shipping_agent_id = 38;
  optional string insurance_premium = 39;
  optional string insurance_currency = 40;
  optional string un_number = 41;
  optional string hazard_class = 42;
  optional string factory_name = 43;
  optional string cargo_ready_at = 44;
  optional string loading_terms = 45;
  optional string received_at = 46;
  optional string booking_notes = 47;
  optional string allocation_notes = 48;
  optional string operation_notes = 49;
  repeated OrderShippingDocumentInput shipping_documents = 50;
  repeated OrderContainerRequestInput container_requests = 51;
  optional string declaration_cutoff_at = 52;
  optional double total_gross_weight_kg = 53;
  optional double total_volume_cbm = 54;
  optional string shipper_short_name = 55;
  optional string consignee_short_name = 56;
  optional SeaMasterBillInput sea_master_bill = 57;
}

// TransitionOrderStatusRequest 流转订单状态请求。
message TransitionOrderStatusRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  uint64 expected_version = 2 [(google.api.field_behavior) = REQUIRED];
  OrderFlowStatus target_flow_status = 3 [(google.api.field_behavior) = REQUIRED];
  optional string reason = 4;
}

message TransitionOrderTerminationRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  uint64 expected_version = 2 [(google.api.field_behavior) = REQUIRED];
  OrderTerminationStatus target_status = 3 [(google.api.field_behavior) = REQUIRED];
  optional OrderTerminationType termination_type = 4;
  string reason = 5 [(google.api.field_behavior) = REQUIRED];
}

message TransitionOrderClosureRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  uint64 expected_version = 2 [(google.api.field_behavior) = REQUIRED];
  OrderClosureStatus target_status = 3 [(google.api.field_behavior) = REQUIRED];
  string reason = 4 [(google.api.field_behavior) = REQUIRED];
}

// GetOrderResponse 单条订单响应。
message GetOrderResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  Order data = 4;
  string trace_id = 5;
}

message CreateOrderResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  Order data = 4;
  string trace_id = 5;
}

message UpdateOrderResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  Order data = 4;
  string trace_id = 5;
}

message TransitionOrderStatusResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  Order data = 4;
  string trace_id = 5;
}

message TransitionOrderTerminationResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  Order data = 4;
  string trace_id = 5;
}

message TransitionOrderClosureResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  Order data = 4;
  string trace_id = 5;
}

// ListOrdersResponse 订单列表响应。
message ListOrdersResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated Order data = 4;
  int32 total = 5;
  int32 page = 6;
  int32 page_size = 7;
  string trace_id = 8;
}

message ListOrderConsolidationsResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated OrderConsolidationSummary data = 4;
  string trace_id = 5;
}

// CheckOrderReferenceResponse 订单业务编号查重响应。
message CheckOrderReferenceResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  OrderReferenceCheck data = 4;
  string trace_id = 5;
}

message ListPersonnelOptionsResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated OrderPersonnelOption data = 4;
  string trace_id = 5;
  int32 total = 6;
  int32 page = 7;
  int32 page_size = 8;
}

// SeaTransportExecution 独立运输执行摘要。
message SeaTransportExecution {
  string id = 1;
  optional string carrier_id = 2;
  optional string carrier_name = 3;
  optional string origin_location_id = 4;
  optional string origin_location_name = 5;
  optional string discharge_location_id = 6;
  optional string discharge_location_name = 7;
  optional string transit_location_id = 8;
  optional string transit_location_name = 9;
  string vessel_name = 10;
  string voyage_no = 11;
  optional string etd = 12;
  optional string eta = 13;
  uint64 version = 14;
}

// SeaMasterBillSummary 海运主单及当前航程摘要。
message SeaMasterBillSummary {
  string master_bill_id = 1;
  string master_no = 2;
  string issuer_partner_id = 3;
  optional string issuer_partner_name = 4;
  string transport_execution_id = 5;
  optional string carrier_id = 6;
  optional string carrier_name = 7;
  optional string origin_location_id = 8;
  optional string origin_location_name = 9;
  optional string discharge_location_id = 10;
  optional string discharge_location_name = 11;
  optional string transit_location_id = 12;
  optional string transit_location_name = 13;
  string vessel_name = 14;
  string voyage_no = 15;
  optional string etd = 16;
  optional string eta = 17;
  string status = 18;
  uint64 version = 19;
  int32 member_count = 20;
}

// SeaMasterBillInput 海运主单输入（新建或确认关联已有主单）。
message SeaMasterBillInput {
  string master_no = 1 [(google.api.field_behavior) = REQUIRED];
  string issuer_partner_id = 2 [(google.api.field_behavior) = REQUIRED];
  optional string candidate_id = 3;
  optional uint64 expected_candidate_version = 4;
  optional string correction_reason = 5;
}

// SeaVoyageConflict 航程冲突详情。
message SeaVoyageConflict {
  string field = 1;
  string master_value = 2;
  string order_value = 3;
  string message = 4;
}

// SeaMasterBillMemberSummary 共享主单成员操作票摘要。
message SeaMasterBillMemberSummary {
  string order_id = 1;
  string order_no = 2;
  optional string customer_reference_no = 3;
}

// SeaMasterBillCandidate 匹配到的已有主单候选。
message SeaMasterBillCandidate {
  string id = 1;
  uint64 version = 2;
  string master_no = 3;
  string issuer_partner_id = 4;
  optional string issuer_partner_name = 5;
  SeaTransportExecution transport_execution = 6;
  int32 member_count = 7;
  repeated SeaMasterBillMemberSummary members = 8;
}

// MatchSeaMasterBillCandidateRequest 共享主单候选匹配请求。
message MatchSeaMasterBillCandidateRequest {
  string issuer_partner_id = 1 [(google.api.field_behavior) = REQUIRED];
  string master_no = 2 [(google.api.field_behavior) = REQUIRED];
  optional string carrier_id = 3;
  optional string origin_location_id = 4;
  optional string discharge_location_id = 5;
  optional string transit_location_id = 6;
  optional string vessel_name = 7;
  optional string voyage_no = 8;
  optional string etd = 9;
  optional string eta = 10;
}

// MatchSeaMasterBillCandidateResponse 共享主单候选匹配响应。
message MatchSeaMasterBillCandidateResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  bool matched = 4;
  optional SeaMasterBillCandidate candidate = 5;
  repeated SeaVoyageConflict conflicts = 6;
  string trace_id = 7;
}
