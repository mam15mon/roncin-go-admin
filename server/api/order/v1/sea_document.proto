syntax = "proto3";

package order.v1;

import "access/v1/access.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";

option go_package = "github.com/roncin/roncin-go-admin/server/api/order/v1;v1";

// SeaDocumentService 海运单证核心服务。
service SeaDocumentService {
  // GetSeaOrderDocuments 获取海运单证聚合信息。
  rpc GetSeaOrderDocuments(GetSeaOrderDocumentsRequest) returns (GetSeaOrderDocumentsResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_ORDER_PERMISSION order_operation: "read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/orders/{order_id}/sea-documents"};
  }

  // ListSeaMasterBillVersions 分页读取当前订单共享 MBL 的不可变版本。
  rpc ListSeaMasterBillVersions(ListSeaMasterBillVersionsRequest) returns (ListSeaMasterBillVersionsResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_ORDER_PERMISSION order_operation: "read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/orders/{order_id}/sea-documents/master-bill/versions"};
  }

  // ListSeaHouseBillVersions 分页读取一张 HBL 的不可变版本。
  rpc ListSeaHouseBillVersions(ListSeaHouseBillVersionsRequest) returns (ListSeaHouseBillVersionsResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_ORDER_PERMISSION order_operation: "read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/orders/{order_id}/sea-documents/house-bills/{house_bill_id}/versions"};
  }

  // GetSeaDocumentVersion 读取一条不可变版本，不回读当前工作字段。
  rpc GetSeaDocumentVersion(GetSeaDocumentVersionRequest) returns (GetSeaDocumentVersionResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_ORDER_PERMISSION order_operation: "read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/orders/{order_id}/sea-documents/versions/{version_id}"};
  }

  // ListSeaDocumentEvents 分页读取改单、作废与模式切换历史。
  rpc ListSeaDocumentEvents(ListSeaDocumentEventsRequest) returns (ListSeaDocumentEventsResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_ORDER_PERMISSION order_operation: "read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/orders/{order_id}/sea-documents/events"};
  }

  // PreviewSeaDocumentAmendment 基于当前不可变版本重算改单差异与影响。
  rpc PreviewSeaDocumentAmendment(PreviewSeaDocumentAmendmentRequest) returns (PreviewSeaDocumentAmendmentResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_ORDER_PERMISSION order_operation: "amend" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {
      post: "/api/v1/orders/{order_id}/sea-documents/amendments/preview"
      body: "*"
    };
  }

  // ExecuteSeaDocumentAmendment 发布改单版本。
  rpc ExecuteSeaDocumentAmendment(ExecuteSeaDocumentAmendmentRequest) returns (ExecuteSeaDocumentAmendmentResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_ORDER_PERMISSION order_operation: "amend" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {
      post: "/api/v1/orders/{order_id}/sea-documents/amendments"
      body: "*"
    };
  }

  // PreviewSeaDocumentVoid 基于当前不可变版本预览作废影响。
  rpc PreviewSeaDocumentVoid(PreviewSeaDocumentVoidRequest) returns (PreviewSeaDocumentVoidResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_ORDER_PERMISSION order_operation: "void" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {
      post: "/api/v1/orders/{order_id}/sea-documents/voids/preview"
      body: "*"
    };
  }

  // ExecuteSeaDocumentVoid 作废单证身份并追加不可变版本与事件。
  rpc ExecuteSeaDocumentVoid(ExecuteSeaDocumentVoidRequest) returns (ExecuteSeaDocumentVoidResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_ORDER_PERMISSION order_operation: "void" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {
      post: "/api/v1/orders/{order_id}/sea-documents/voids"
      body: "*"
    };
  }

  // PreviewChangeSeaDocumentMode 预览单证模式切换（HOUSE <-> DIRECT）影响。
  rpc PreviewChangeSeaDocumentMode(PreviewChangeSeaDocumentModeRequest) returns (PreviewChangeSeaDocumentModeResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_ORDER_PERMISSION order_operation: "update" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {
      post: "/api/v1/orders/{order_id}/sea-documents/mode-change/preview"
      body: "*"
    };
  }

  // ExecuteChangeSeaDocumentMode 执行单证模式切换（HOUSE <-> DIRECT）。
  rpc ExecuteChangeSeaDocumentMode(ExecuteChangeSeaDocumentModeRequest) returns (ExecuteChangeSeaDocumentModeResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_ORDER_PERMISSION order_operation: "update" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {
      post: "/api/v1/orders/{order_id}/sea-documents/mode-change"
      body: "*"
    };
  }

  // UpdateSeaHouseBill 更新海运分单。
  rpc UpdateSeaHouseBill(UpdateSeaHouseBillRequest) returns (UpdateSeaHouseBillResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_ORDER_PERMISSION order_operation: "update" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {
      put: "/api/v1/orders/{order_id}/sea-documents/house-bills/{id}"
      body: "*"
    };
  }

  // UpdateSeaMasterBillContent 更新共享 MBL 提单内容。
  rpc UpdateSeaMasterBillContent(UpdateSeaMasterBillContentRequest) returns (UpdateSeaMasterBillContentResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_ORDER_PERMISSION order_operation: "update" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {
      put: "/api/v1/orders/{order_id}/sea-documents/master-bill-content"
      body: "*"
    };
  }
}

// SeaDocumentStructure 海运单证结构两态。
enum SeaDocumentStructure {
  SEA_DOCUMENT_STRUCTURE_UNSPECIFIED = 0;
  reserved 1;
  reserved "SEA_DOCUMENT_STRUCTURE_UNDETERMINED";
  SEA_DOCUMENT_STRUCTURE_DIRECT = 2;
  SEA_DOCUMENT_STRUCTURE_HOUSE = 3;
}

// SeaHouseBillIssuerSource HBL 签发主体来源。
enum SeaHouseBillIssuerSource {
  SEA_HOUSE_BILL_ISSUER_SOURCE_UNSPECIFIED = 0;
  SEA_HOUSE_BILL_ISSUER_SOURCE_SELF_ORGANIZATION = 1;
  SEA_HOUSE_BILL_ISSUER_SOURCE_CUSTOMER_PARTNER = 2;
  SEA_HOUSE_BILL_ISSUER_SOURCE_OTHER_PARTNER = 3;
}

// SeaHouseBillStatus HBL 状态枚举。
enum SeaHouseBillStatus {
  SEA_HOUSE_BILL_STATUS_UNSPECIFIED = 0;
  SEA_HOUSE_BILL_STATUS_DRAFT = 1;
  SEA_HOUSE_BILL_STATUS_CONFIRMED = 2;
  SEA_HOUSE_BILL_STATUS_RELEASED = 3;
  SEA_HOUSE_BILL_STATUS_VOIDED = 4;
  reserved 5;
  reserved "SEA_HOUSE_BILL_STATUS_REPLACED";
}

// SeaDocumentAction 单证操作动作枚举。
enum SeaDocumentAction {
  SEA_DOCUMENT_ACTION_UNSPECIFIED = 0;
  reserved 1, 2, 3, 5;
  reserved "SEA_DOCUMENT_ACTION_MARK_DIRECT", "SEA_DOCUMENT_ACTION_CANCEL_DIRECT", "SEA_DOCUMENT_ACTION_ADD_HOUSE_BILL", "SEA_DOCUMENT_ACTION_REMOVE_HOUSE_BILL";
  SEA_DOCUMENT_ACTION_UPDATE_HOUSE_BILL = 4;
  SEA_DOCUMENT_ACTION_UPDATE_MASTER_BILL_CONTENT = 6;
  SEA_DOCUMENT_ACTION_CHANGE_MODE = 7;
}

// SeaDocumentType 区分共享 MBL 与订单内真实 HBL。
enum SeaDocumentType {
  SEA_DOCUMENT_TYPE_UNSPECIFIED = 0;
  SEA_DOCUMENT_TYPE_MASTER_BILL = 1;
  SEA_DOCUMENT_TYPE_HOUSE_BILL = 2;
}

// SeaDocumentVersionSource 不可变版本的形成原因。
enum SeaDocumentVersionSource {
  SEA_DOCUMENT_VERSION_SOURCE_UNSPECIFIED = 0;
  SEA_DOCUMENT_VERSION_SOURCE_ORDER_LOCK = 1;
  SEA_DOCUMENT_VERSION_SOURCE_AMENDMENT = 2;
  reserved 3;
  reserved "SEA_DOCUMENT_VERSION_SOURCE_SWITCH";
  SEA_DOCUMENT_VERSION_SOURCE_VOID = 4;
  SEA_DOCUMENT_VERSION_SOURCE_MODE_CHANGE = 5;
}

// SeaDocumentEventType 低频单证历史事件类型。
enum SeaDocumentEventType {
  SEA_DOCUMENT_EVENT_TYPE_UNSPECIFIED = 0;
  SEA_DOCUMENT_EVENT_TYPE_AMENDMENT = 1;
  SEA_DOCUMENT_EVENT_TYPE_VOID = 2;
  reserved 3;
  reserved "SEA_DOCUMENT_EVENT_TYPE_SWITCH";
  SEA_DOCUMENT_EVENT_TYPE_MODE_CHANGE = 4;
}

// SeaBillContent 通用提单内容（MBL 与 HBL 独立维护）。
message SeaBillContent {
  optional string shipper_text = 1;
  optional string consignee_text = 2;
  optional string notify_party_text = 3;
  optional string second_notify_party_text = 4;
  optional string marks_text = 5;
  optional string goods_description_text = 6;
  optional int32 package_count = 7;
  optional string package_unit = 8;
  optional double gross_weight_kg = 9;
  optional double volume_cbm = 10;
  optional string freight_terms = 11;
  optional string transport_terms = 12;
  optional string bill_form = 13;
  optional string release_type = 14;
  optional string clauses = 15;
}

// SeaHouseBill 海运分单（HBL）信息。
message SeaHouseBill {
  string id = 1;
  string organization_id = 2;
  string order_id = 3;
  string master_bill_id = 4;
  string house_no = 5;
  SeaHouseBillIssuerSource issuer_source = 6;
  optional string issuer_organization_id = 7;
  optional string issuer_organization_name = 8;
  optional string issuer_partner_id = 9;
  optional string issuer_partner_name = 10;
  SeaHouseBillStatus status = 11;
  uint64 version = 12;
  optional string note = 13;
  SeaBillContent content = 14;
  string created_at = 15;
  string updated_at = 16;
  optional string current_version_id = 17;
  uint64 immutable_version_count = 18;
}

// SeaHouseBillInput 表单中的海运分单输入。
message SeaHouseBillInput {
  optional string id = 1;
  string house_no = 2 [(google.api.field_behavior) = REQUIRED];
  SeaHouseBillIssuerSource issuer_source = 3 [(google.api.field_behavior) = REQUIRED];
  optional string issuer_partner_id = 4;
  optional string note = 5;
  optional SeaBillContent content = 6;
  optional uint64 expected_version = 7;
}

// SeaMasterBillDetail 海运主单内容详情。
message SeaMasterBillDetail {
  string id = 1;
  string master_no = 2;
  string shipping_line_id = 3;
  optional string shipping_line_name = 4;
  string status = 5;
  uint64 version = 6;
  SeaBillContent content = 7;
  int32 member_count = 8;
  optional string current_version_id = 9;
  uint64 immutable_version_count = 10;
}

// SeaOrderDocumentSummary 订单中的海运单证摘要。
message SeaOrderDocumentSummary {
  SeaDocumentStructure document_structure = 1;
  uint64 link_version = 2;
  reserved 3, 4;
  reserved "house_bill_count", "house_nos";
  optional string house_no = 5;
}

// SeaOrderDocumentInput 订单创建/更新中的海运单证整包输入。
message SeaOrderDocumentInput {
  optional SeaDocumentStructure document_structure = 1;
  optional uint64 expected_link_version = 2;
  optional uint64 expected_mbl_version = 3;
  optional SeaBillContent master_bill_content = 4;
  reserved 5;
  reserved "house_bills";
  optional SeaHouseBillInput house_bill = 6;
}

// SeaOrderDocuments 聚合单证响应。
message SeaOrderDocuments {
  string order_id = 1;
  SeaDocumentStructure document_structure = 2;
  uint64 link_version = 3;
  optional SeaMasterBillDetail master_bill = 4;
  reserved 5;
  reserved "house_bills";
  repeated SeaDocumentAction allowed_actions = 6;
  optional SeaHouseBill house_bill = 7;
}

// GetSeaOrderDocumentsRequest 获取海运单证聚合信息请求。
message GetSeaOrderDocumentsRequest {
  string order_id = 1 [(google.api.field_behavior) = REQUIRED];
}

// GetSeaOrderDocumentsResponse 获取海运单证聚合信息响应。
message GetSeaOrderDocumentsResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  SeaOrderDocuments data = 4;
  string trace_id = 5;
}

// SeaExternalConfirmationInput 外部确认输入。
message SeaExternalConfirmationInput {
  string confirmed_by_party = 1 [(google.api.field_behavior) = REQUIRED];
  string confirmed_at = 2 [(google.api.field_behavior) = REQUIRED];
  string confirmation_note = 3 [(google.api.field_behavior) = REQUIRED];
  optional string confirmation_attachment_id = 4;
}

// SeaExternalConfirmationSummary 外部确认摘要。
message SeaExternalConfirmationSummary {
  string confirmed_by_party = 1;
  string confirmed_at = 2;
  string confirmation_note = 3;
  optional string confirmation_attachment_id = 4;
  optional string confirmation_attachment_name = 5;
}

// PreviewChangeSeaDocumentModeRequest 预览模式切换请求。
message PreviewChangeSeaDocumentModeRequest {
  string order_id = 1 [(google.api.field_behavior) = REQUIRED];
  SeaDocumentStructure target_mode = 2 [(google.api.field_behavior) = REQUIRED];
  optional SeaHouseBillInput new_house_bill = 3;
  string reason = 4 [(google.api.field_behavior) = REQUIRED];
}

// PreviewChangeSeaDocumentModeResponse 预览模式切换响应。
message PreviewChangeSeaDocumentModeResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  SeaDocumentModeChangePreview data = 4;
  string trace_id = 5;
}

// SeaDocumentModeChangePreview 模式切换预览数据。
message SeaDocumentModeChangePreview {
  SeaDocumentStructure previous_mode = 1;
  SeaDocumentStructure target_mode = 2;
  repeated SeaDocumentFieldDifference differences = 3;
  repeated SeaDocumentDownstreamImpact impacts = 4;
  bool executable = 5;
}

// ExecuteChangeSeaDocumentModeRequest 执行模式切换请求。
message ExecuteChangeSeaDocumentModeRequest {
  string order_id = 1 [(google.api.field_behavior) = REQUIRED];
  uint64 expected_order_version = 2 [(google.api.field_behavior) = REQUIRED];
  uint64 expected_link_version = 3 [(google.api.field_behavior) = REQUIRED];
  optional uint64 expected_house_bill_version = 4;
  optional string expected_current_version_id = 5;
  SeaDocumentStructure target_mode = 6 [(google.api.field_behavior) = REQUIRED];
  optional SeaHouseBillInput new_house_bill = 7;
  string reason = 8 [(google.api.field_behavior) = REQUIRED];
  SeaExternalConfirmationInput confirmation = 9 [(google.api.field_behavior) = REQUIRED];
  string idempotency_key = 10 [(google.api.field_behavior) = REQUIRED];
}

// ExecuteChangeSeaDocumentModeResponse 执行模式切换响应。
message ExecuteChangeSeaDocumentModeResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  SeaOrderDocuments data = 4;
  string trace_id = 5;
}

// UpdateSeaHouseBillRequest 更新分单请求。
message UpdateSeaHouseBillRequest {
  string order_id = 1 [(google.api.field_behavior) = REQUIRED];
  string id = 2 [(google.api.field_behavior) = REQUIRED];
  uint64 expected_version = 3 [(google.api.field_behavior) = REQUIRED];
  uint64 expected_link_version = 4 [(google.api.field_behavior) = REQUIRED];
  SeaHouseBillInput house_bill = 5 [(google.api.field_behavior) = REQUIRED];
}

// UpdateSeaHouseBillResponse 更新分单响应。
message UpdateSeaHouseBillResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  SeaHouseBill data = 4;
  string trace_id = 5;
}

// UpdateSeaMasterBillContentRequest 更新共享 MBL 内容请求。
message UpdateSeaMasterBillContentRequest {
  string order_id = 1 [(google.api.field_behavior) = REQUIRED];
  uint64 expected_mbl_version = 2 [(google.api.field_behavior) = REQUIRED];
  SeaBillContent content = 3 [(google.api.field_behavior) = REQUIRED];
}

// UpdateSeaMasterBillContentResponse 更新共享 MBL 内容响应。
message UpdateSeaMasterBillContentResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  SeaMasterBillDetail data = 4;
  string trace_id = 5;
}

// SeaDocumentVersion 完整、不可变的主单或分单内容版本。
message SeaDocumentVersion {
  string id = 1;
  SeaDocumentType document_type = 2;
  string document_id = 3;
  string order_id = 4;
  string master_bill_id = 5;
  uint64 version_no = 6;
  uint64 source_entity_version = 7;
  string document_no = 8;
  string normalized_document_no = 9;
  string status = 10;
  SeaDocumentVersionSource source = 11;
  optional string reason = 12;
  optional string issuer_partner_id = 13;
  optional string issuer_organization_id = 14;
  SeaHouseBillIssuerSource issuer_source = 15;
  optional string transport_execution_id = 16;
  optional string vessel_name = 17;
  optional string voyage_no = 18;
  optional string etd = 19;
  optional string eta = 20;
  optional string note = 21;
  SeaBillContent content = 22;
  optional string created_by = 23;
  string created_at = 24;
  optional string shipping_line_id = 25;
  optional string shipping_line_name = 26;
  optional SeaExternalConfirmationSummary confirmation = 27;
}

message SeaDocumentFieldDifference {
  string field = 1;
  string label = 2;
  string before_value = 3;
  string after_value = 4;
}

message SeaDocumentDownstreamImpact {
  string fact_type = 1;
  string reference_id = 2;
  string reference_no = 3;
  string message = 4;
  bool blocks_execution = 5;
}

message SeaDocumentEvent {
  reserved 8 to 13, 16;
  reserved "old_house_bill_id", "old_house_no", "new_house_bill_id", "new_house_no", "chain_id", "sequence", "surrender_info";
  string id = 1;
  SeaDocumentEventType event_type = 2;
  SeaDocumentType document_type = 3;
  optional string document_id = 4;
  optional string document_no = 5;
  optional string previous_version_id = 6;
  optional string result_version_id = 7;
  string reason = 14;
  optional string impact_summary = 15;
  optional string created_by = 17;
  string created_at = 18;
  optional SeaDocumentStructure previous_mode = 19;
  optional SeaDocumentStructure target_mode = 20;
  optional SeaExternalConfirmationSummary confirmation = 21;
}

message SeaDocumentAmendmentInput {
  optional SeaBillContent master_bill_content = 1;
  optional SeaHouseBillInput house_bill = 2;
}

message SeaDocumentAmendmentPreview {
  SeaDocumentVersion base_version = 1;
  repeated SeaDocumentFieldDifference differences = 2;
  repeated SeaDocumentDownstreamImpact impacts = 3;
  bool executable = 4;
}

message SeaDocumentVoidPreview {
  SeaDocumentVersion base_version = 1;
  repeated SeaDocumentFieldDifference differences = 2;
  repeated SeaDocumentDownstreamImpact impacts = 3;
  bool executable = 4;
}

message ListSeaMasterBillVersionsRequest {
  string order_id = 1 [(google.api.field_behavior) = REQUIRED];
  int32 page = 2;
  int32 page_size = 3;
}

message ListSeaHouseBillVersionsRequest {
  string order_id = 1 [(google.api.field_behavior) = REQUIRED];
  string house_bill_id = 2 [(google.api.field_behavior) = REQUIRED];
  int32 page = 3;
  int32 page_size = 4;
}

message ListSeaMasterBillVersionsResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated SeaDocumentVersion data = 4;
  int32 total = 5;
  string trace_id = 6;
}

message ListSeaHouseBillVersionsResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated SeaDocumentVersion data = 4;
  int32 total = 5;
  string trace_id = 6;
}

message GetSeaDocumentVersionRequest {
  string order_id = 1 [(google.api.field_behavior) = REQUIRED];
  string version_id = 2 [(google.api.field_behavior) = REQUIRED];
  SeaDocumentType document_type = 3 [(google.api.field_behavior) = REQUIRED];
}

message GetSeaDocumentVersionResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  SeaDocumentVersion data = 4;
  string trace_id = 5;
}

message ListSeaDocumentEventsRequest {
  string order_id = 1 [(google.api.field_behavior) = REQUIRED];
  int32 page = 2;
  int32 page_size = 3;
}

message ListSeaDocumentEventsResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated SeaDocumentEvent data = 4;
  int32 total = 5;
  string trace_id = 6;
}

message PreviewSeaDocumentAmendmentRequest {
  string order_id = 1 [(google.api.field_behavior) = REQUIRED];
  SeaDocumentType document_type = 2 [(google.api.field_behavior) = REQUIRED];
  string document_id = 3 [(google.api.field_behavior) = REQUIRED];
  uint64 expected_order_version = 4 [(google.api.field_behavior) = REQUIRED];
  uint64 expected_document_version = 5 [(google.api.field_behavior) = REQUIRED];
  string expected_current_version_id = 6 [(google.api.field_behavior) = REQUIRED];
  string reason = 7 [(google.api.field_behavior) = REQUIRED];
  SeaDocumentAmendmentInput input = 8 [(google.api.field_behavior) = REQUIRED];
}

message PreviewSeaDocumentAmendmentResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  SeaDocumentAmendmentPreview data = 4;
  string trace_id = 5;
}

message ExecuteSeaDocumentAmendmentRequest {
  string order_id = 1 [(google.api.field_behavior) = REQUIRED];
  SeaDocumentType document_type = 2 [(google.api.field_behavior) = REQUIRED];
  string document_id = 3 [(google.api.field_behavior) = REQUIRED];
  uint64 expected_order_version = 4 [(google.api.field_behavior) = REQUIRED];
  uint64 expected_document_version = 5 [(google.api.field_behavior) = REQUIRED];
  string expected_current_version_id = 6 [(google.api.field_behavior) = REQUIRED];
  string reason = 7 [(google.api.field_behavior) = REQUIRED];
  string idempotency_key = 8 [(google.api.field_behavior) = REQUIRED];
  SeaDocumentAmendmentInput input = 9 [(google.api.field_behavior) = REQUIRED];
  SeaExternalConfirmationInput confirmation = 10 [(google.api.field_behavior) = REQUIRED];
}

message ExecuteSeaDocumentAmendmentResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  SeaDocumentVersion data = 4;
  string trace_id = 5;
}

message PreviewSeaDocumentVoidRequest {
  string order_id = 1 [(google.api.field_behavior) = REQUIRED];
  SeaDocumentType document_type = 2 [(google.api.field_behavior) = REQUIRED];
  string document_id = 3 [(google.api.field_behavior) = REQUIRED];
  uint64 expected_order_version = 4 [(google.api.field_behavior) = REQUIRED];
  uint64 expected_document_version = 5 [(google.api.field_behavior) = REQUIRED];
  string expected_current_version_id = 6 [(google.api.field_behavior) = REQUIRED];
  string reason = 7 [(google.api.field_behavior) = REQUIRED];
}

message PreviewSeaDocumentVoidResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  SeaDocumentVoidPreview data = 4;
  string trace_id = 5;
}

message ExecuteSeaDocumentVoidRequest {
  string order_id = 1 [(google.api.field_behavior) = REQUIRED];
  SeaDocumentType document_type = 2 [(google.api.field_behavior) = REQUIRED];
  string document_id = 3 [(google.api.field_behavior) = REQUIRED];
  uint64 expected_order_version = 4 [(google.api.field_behavior) = REQUIRED];
  uint64 expected_document_version = 5 [(google.api.field_behavior) = REQUIRED];
  string expected_current_version_id = 6 [(google.api.field_behavior) = REQUIRED];
  string reason = 7 [(google.api.field_behavior) = REQUIRED];
  string idempotency_key = 8 [(google.api.field_behavior) = REQUIRED];
  SeaExternalConfirmationInput confirmation = 9 [(google.api.field_behavior) = REQUIRED];
}

message ExecuteSeaDocumentVoidResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  SeaDocumentEvent data = 4;
  string trace_id = 5;
}
