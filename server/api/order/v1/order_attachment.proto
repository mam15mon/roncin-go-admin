syntax = "proto3";

package order.v1;

import "access/v1/access.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";

option go_package = "github.com/roncin/roncin-go-admin/server/api/order/v1;v1";

// OrderAttachmentService 订单附件服务。
service OrderAttachmentService {
  // ListAttachments 获取指定订单的附件列表。
  rpc ListAttachments(ListAttachmentsRequest) returns (ListAttachmentsResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_ORDER_PERMISSION order_operation: "attachment.read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/orders/{order_id}/attachments"};
  }

  // PrepareAttachmentUpload 为当前订单准备附件上传。
  rpc PrepareAttachmentUpload(PrepareAttachmentUploadRequest) returns (PrepareAttachmentUploadResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_ORDER_PERMISSION order_operation: "attachment.register" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {post: "/api/v1/orders/{order_id}/attachments/upload" body: "*"};
  }

  // GetAttachmentAccess 获取短期附件访问链接。
  rpc GetAttachmentAccess(GetAttachmentAccessRequest) returns (GetAttachmentAccessResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_ORDER_PERMISSION order_operation: "attachment.read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/orders/{order_id}/attachments/{id}/access"};
  }

  // RegisterAttachment 注册订单附件。
  rpc RegisterAttachment(RegisterAttachmentRequest) returns (RegisterAttachmentResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_ORDER_PERMISSION order_operation: "attachment.register" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {
      post: "/api/v1/orders/{order_id}/attachments"
      body: "*"
    };
  }

  // RemoveAttachmentReference 解除订单附件引用。
  rpc RemoveAttachmentReference(RemoveAttachmentReferenceRequest) returns (RemoveAttachmentReferenceResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_ORDER_PERMISSION order_operation: "attachment.register" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {
      delete: "/api/v1/orders/{order_id}/attachments/{id}"
    };
  }
}

// OrderAttachment 订单附件信息。
message OrderAttachment {
  string id = 1;
  string order_id = 2;
  string doc_type = 3;
  string idempotency_key = 4;
  string file_name = 5;
  string mime_type = 6;
  int64 file_size = 7;
  string object_key = 8;
  optional string checksum = 9;
  optional string uploaded_by = 10;
  string created_at = 11;
  string updated_at = 12;
  optional string asset_id = 13;
}

// ListAttachmentsRequest 获取订单附件列表请求。
message ListAttachmentsRequest {
  string order_id = 1 [(google.api.field_behavior) = REQUIRED];
}

// RegisterAttachmentRequest 注册订单附件请求。
message RegisterAttachmentRequest {
  string order_id = 1 [(google.api.field_behavior) = REQUIRED];
  reserved 2 to 8;
  reserved "doc_type", "idempotency_key", "file_name", "mime_type", "file_size", "object_key", "checksum";
  string upload_token = 9 [(google.api.field_behavior) = REQUIRED];
}

// RegisterAttachmentResponse 单条订单附件响应。
message RegisterAttachmentResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  OrderAttachment data = 4;
  string trace_id = 5;
}

// ListAttachmentsResponse 订单附件列表响应。
message ListAttachmentsResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated OrderAttachment data = 4;
  string trace_id = 5;
}

// RemoveAttachmentReferenceRequest 解除订单附件引用请求。
message RemoveAttachmentReferenceRequest {
  string order_id = 1 [(google.api.field_behavior) = REQUIRED];
  string id = 2 [(google.api.field_behavior) = REQUIRED];
}

// RemoveAttachmentReferenceResponse 解除订单附件引用响应。
message RemoveAttachmentReferenceResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  string trace_id = 4;
}

// PrepareAttachmentUploadRequest 描述即将上传的单个文件。
message PrepareAttachmentUploadRequest {
  string order_id = 1 [(google.api.field_behavior) = REQUIRED];
  string doc_type = 2 [(google.api.field_behavior) = REQUIRED];
  string file_name = 3 [(google.api.field_behavior) = REQUIRED];
  string mime_type = 4 [(google.api.field_behavior) = REQUIRED];
  int64 file_size = 5 [(google.api.field_behavior) = REQUIRED];
  string checksum = 6 [(google.api.field_behavior) = REQUIRED];
}

// AttachmentUpload 包含直传地址与服务端登记凭证。
message AttachmentUpload {
  string upload_url = 1;
  string upload_token = 2;
  map<string, string> headers = 3;
  string expires_at = 4;
}

message PrepareAttachmentUploadResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  AttachmentUpload data = 4;
  string trace_id = 5;
}

message GetAttachmentAccessRequest {
  string order_id = 1 [(google.api.field_behavior) = REQUIRED];
  string id = 2 [(google.api.field_behavior) = REQUIRED];
  bool download = 3;
}

// AttachmentAccess 是短期有效的私有对象访问地址。
message AttachmentAccess {
  string url = 1;
  string expires_at = 2;
}

message GetAttachmentAccessResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  AttachmentAccess data = 4;
  string trace_id = 5;
}
