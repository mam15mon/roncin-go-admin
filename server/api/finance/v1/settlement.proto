  }
  // ListFinanceBillTagAssignmentOptions 仅为账单标签写入提供候选，按 bill.update 可写组织过滤。
  rpc ListFinanceBillTagAssignmentOptions(ListFinanceBillTagAssignmentOptionsRequest) returns (ListFinanceBillTagAssignmentOptionsResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.bill.update" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/finance/bill-tag-assignment-options"};
  }
  rpc BatchAssignFinanceBillTags(BatchAssignFinanceBillTagsRequest) returns (BatchAssignFinanceBillTagsResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.bill.update" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {post: "/api/v1/finance/bill-tags/batch-assign" body: "*"};
  }
  rpc BatchRemoveFinanceBillTags(BatchRemoveFinanceBillTagsRequest) returns (BatchRemoveFinanceBillTagsResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.bill.update" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {post: "/api/v1/finance/bill-tags/batch-remove" body: "*"};
  }

  rpc ListFinanceFeeTagOptions(ListFinanceFeeTagOptionsRequest) returns (ListFinanceFeeTagOptionsResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.fee.read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/finance/fee-tag-options"};
  }
  // ListFinanceFeeTagAssignmentOptions 仅为费用标签写入提供候选，按 fee.tag 可写组织过滤。
  rpc ListFinanceFeeTagAssignmentOptions(ListFinanceFeeTagAssignmentOptionsRequest) returns (ListFinanceFeeTagAssignmentOptionsResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.fee.tag" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/finance/fee-tag-assignment-options"};
  }
  rpc BatchAssignFinanceFeeTags(BatchAssignFinanceFeeTagsRequest) returns (BatchAssignFinanceFeeTagsResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.fee.tag" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {post: "/api/v1/finance/fee-tags/batch-assign" body: "*"};
  }
  rpc BatchRemoveFinanceFeeTags(BatchRemoveFinanceFeeTagsRequest) returns (BatchRemoveFinanceFeeTagsResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.fee.tag" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {post: "/api/v1/finance/fee-tags/batch-remove" body: "*"};
