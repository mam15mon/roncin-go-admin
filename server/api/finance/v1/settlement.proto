syntax = "proto3";

package finance.v1;

import "access/v1/access.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";

option go_package = "github.com/roncin/roncin-go-admin/server/api/finance/v1;v1";

// SettlementService 提供跨业务费用台账及后续账单、开票、收付和核销能力。
service SettlementService {
  // ListFeeLedger 获取当前组织全部业务线的应收应付费用总台账。
  rpc ListFeeLedger(ListFeeLedgerRequest) returns (ListFeeLedgerResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.fee.read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/finance/fees"};
  }

  rpc ListBills(ListBillsRequest) returns (ListBillsResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.bill.read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/finance/bills"};
  }

  rpc GetBill(GetBillRequest) returns (GetBillResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.bill.read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/finance/bills/{id}"};
  }

  rpc CreateBill(CreateBillRequest) returns (CreateBillResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.bill.create" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {post: "/api/v1/finance/bills" body: "*"};
  }

  rpc PreviewBillBatch(PreviewBillBatchRequest) returns (PreviewBillBatchResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.bill.create" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {post: "/api/v1/finance/bill-batches/preview" body: "*"};
  }

  rpc CreateBillBatch(CreateBillBatchRequest) returns (CreateBillBatchResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.bill.create" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {post: "/api/v1/finance/bill-batches" body: "*"};
  }

  rpc ConfirmBillBatch(ConfirmBillBatchRequest) returns (ConfirmBillBatchResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.bill.confirm" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {post: "/api/v1/finance/bill-batches/{id}/confirm" body: "*"};
  }

  rpc UpdateBill(UpdateBillRequest) returns (UpdateBillResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.bill.update" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {put: "/api/v1/finance/bills/{id}" body: "*"};
  }

  rpc ConfirmBill(ConfirmBillRequest) returns (ConfirmBillResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.bill.confirm" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {post: "/api/v1/finance/bills/{id}/confirm" body: "*"};
  }

  rpc CancelBill(CancelBillRequest) returns (CancelBillResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.bill.update" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {post: "/api/v1/finance/bills/{id}/cancel" body: "*"};
  }
  rpc ListInvoices(ListInvoicesRequest) returns (ListInvoicesResponse) { option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.invoice.read" scope: DATA_SCOPE_ORGANIZATION}; option (google.api.http) = {get: "/api/v1/finance/invoices"}; }
  rpc GetInvoice(GetInvoiceRequest) returns (GetInvoiceResponse) { option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.invoice.read" scope: DATA_SCOPE_ORGANIZATION}; option (google.api.http) = {get: "/api/v1/finance/invoices/{id}"}; }
  rpc CreateInvoice(CreateInvoiceRequest) returns (CreateInvoiceResponse) { option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.invoice.create" scope: DATA_SCOPE_ORGANIZATION}; option (google.api.http) = {post: "/api/v1/finance/invoices" body: "*"}; }
  rpc IssueInvoice(IssueInvoiceRequest) returns (IssueInvoiceResponse) { option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.invoice.update" scope: DATA_SCOPE_ORGANIZATION}; option (google.api.http) = {post: "/api/v1/finance/invoices/{id}/issue" body: "*"}; }
  rpc CancelInvoice(CancelInvoiceRequest) returns (CancelInvoiceResponse) { option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.invoice.update" scope: DATA_SCOPE_ORGANIZATION}; option (google.api.http) = {post: "/api/v1/finance/invoices/{id}/cancel" body: "*"}; }
  rpc RedFlushInvoice(RedFlushInvoiceRequest) returns (RedFlushInvoiceResponse) { option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.invoice.update" scope: DATA_SCOPE_ORGANIZATION}; option (google.api.http) = {post: "/api/v1/finance/invoices/{id}/red-flush" body: "*"}; }
  rpc ListCashflows(ListCashflowsRequest) returns (ListCashflowsResponse) { option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.cashflow.read" scope: DATA_SCOPE_ORGANIZATION}; option (google.api.http) = {get: "/api/v1/finance/cashflows"}; }
  rpc CreateCashflow(CreateCashflowRequest) returns (CreateCashflowResponse) { option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.cashflow.create" scope: DATA_SCOPE_ORGANIZATION}; option (google.api.http) = {post: "/api/v1/finance/cashflows" body: "*"}; }
  rpc ConfirmCashflow(ConfirmCashflowRequest) returns (ConfirmCashflowResponse) { option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.cashflow.update" scope: DATA_SCOPE_ORGANIZATION}; option (google.api.http) = {post: "/api/v1/finance/cashflows/{id}/confirm" body: "*"}; }
  rpc CancelCashflow(CancelCashflowRequest) returns (CancelCashflowResponse) { option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.cashflow.update" scope: DATA_SCOPE_ORGANIZATION}; option (google.api.http) = {post: "/api/v1/finance/cashflows/{id}/cancel" body: "*"}; }
  rpc ListVerifications(ListVerificationsRequest) returns (ListVerificationsResponse) { option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.verification.read" scope: DATA_SCOPE_ORGANIZATION}; option (google.api.http) = {get: "/api/v1/finance/verifications"}; }
  rpc CreateVerification(CreateVerificationRequest) returns (CreateVerificationResponse) { option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.verification.create" scope: DATA_SCOPE_ORGANIZATION}; option (google.api.http) = {post: "/api/v1/finance/verifications" body: "*"}; }
  rpc ReverseVerification(ReverseVerificationRequest) returns (ReverseVerificationResponse) { option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.verification.reverse" scope: DATA_SCOPE_ORGANIZATION}; option (google.api.http) = {post: "/api/v1/finance/verifications/{id}/reverse" body: "*"}; }
  rpc ListCommissions(ListCommissionsRequest) returns (ListCommissionsResponse) { option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.commission.read" scope: DATA_SCOPE_ORGANIZATION}; option (google.api.http) = {get: "/api/v1/finance/commissions"}; }
  rpc GetCommission(GetCommissionRequest) returns (CommissionResponse) { option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.commission.read" scope: DATA_SCOPE_ORGANIZATION}; option (google.api.http) = {get: "/api/v1/finance/commissions/{id}"}; }
  rpc ListCommissionEmployees(ListCommissionEmployeesRequest) returns (ListCommissionEmployeesResponse) { option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.commission.read" scope: DATA_SCOPE_ORGANIZATION}; option (google.api.http) = {get: "/api/v1/finance/commissions/employees"}; }
  rpc ListCommissionCandidates(ListCommissionCandidatesRequest) returns (ListCommissionEmployeesResponse) { option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.commission.read" scope: DATA_SCOPE_ORGANIZATION}; option (google.api.http) = {get: "/api/v1/finance/commissions/candidates"}; }
  rpc ListCommissionRules(ListCommissionRulesRequest) returns (ListCommissionRulesResponse) { option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.commission.read" scope: DATA_SCOPE_ORGANIZATION}; option (google.api.http) = {get: "/api/v1/finance/commission-rules"}; }
  rpc CreateCommissionRule(CreateCommissionRuleRequest) returns (CommissionRuleResponse) { option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.commission.manage" scope: DATA_SCOPE_ORGANIZATION}; option (google.api.http) = {post: "/api/v1/finance/commission-rules" body: "*"}; }
  rpc UpdateCommissionRule(UpdateCommissionRuleRequest) returns (CommissionRuleResponse) { option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.commission.manage" scope: DATA_SCOPE_ORGANIZATION}; option (google.api.http) = {put: "/api/v1/finance/commission-rules/{id}" body: "*"}; }
  rpc PreviewCommission(PreviewCommissionRequest) returns (PreviewCommissionResponse) { option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.commission.manage" scope: DATA_SCOPE_ORGANIZATION}; option (google.api.http) = {post: "/api/v1/finance/commissions/preview" body: "*"}; }
  rpc CreateCommission(CreateCommissionRequest) returns (CreateCommissionResponse) { option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.commission.manage" scope: DATA_SCOPE_ORGANIZATION}; option (google.api.http) = {post: "/api/v1/finance/commissions" body: "*"}; }
  rpc ConfirmCommission(CommissionTransitionRequest) returns (CommissionResponse) { option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.commission.manage" scope: DATA_SCOPE_ORGANIZATION}; option (google.api.http) = {post: "/api/v1/finance/commissions/{id}/confirm" body: "*"}; }
  rpc MarkCommissionPaid(CommissionTransitionRequest) returns (CommissionResponse) { option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.commission.manage" scope: DATA_SCOPE_ORGANIZATION}; option (google.api.http) = {post: "/api/v1/finance/commissions/{id}/paid" body: "*"}; }
  rpc CancelCommission(CancelCommissionRequest) returns (CommissionResponse) { option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.commission.manage" scope: DATA_SCOPE_ORGANIZATION}; option (google.api.http) = {post: "/api/v1/finance/commissions/{id}/cancel" body: "*"}; }
  rpc CreateCommissionAdjustment(CreateCommissionAdjustmentRequest) returns (CommissionAdjustmentResponse) { option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.commission.manage" scope: DATA_SCOPE_ORGANIZATION}; option (google.api.http) = {post: "/api/v1/finance/commissions/{commission_id}/adjustments" body: "*"}; }
  rpc ConfirmCommissionAdjustment(CommissionAdjustmentTransitionRequest) returns (CommissionAdjustmentResponse) { option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.commission.manage" scope: DATA_SCOPE_ORGANIZATION}; option (google.api.http) = {post: "/api/v1/finance/commission-adjustments/{id}/confirm" body: "*"}; }
  rpc MarkCommissionAdjustmentPaid(CommissionAdjustmentTransitionRequest) returns (CommissionAdjustmentResponse) { option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.commission.manage" scope: DATA_SCOPE_ORGANIZATION}; option (google.api.http) = {post: "/api/v1/finance/commission-adjustments/{id}/paid" body: "*"}; }
  rpc CancelCommissionAdjustment(CancelCommissionAdjustmentRequest) returns (CommissionAdjustmentResponse) { option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.commission.manage" scope: DATA_SCOPE_ORGANIZATION}; option (google.api.http) = {post: "/api/v1/finance/commission-adjustments/{id}/cancel" body: "*"}; }
}

message ListFeeLedgerRequest {
  int32 page = 1;
  int32 page_size = 2;
  optional string keyword = 3;
  optional string business_type = 4;
  optional string direction = 5;
  optional string status = 6;
  optional string settlement_party_id = 7;
  optional string currency = 8;
  optional string expense_date_from = 9;
  optional string expense_date_to = 10;
  optional string customer_id = 11;
}

message FeeLedgerItem {
  string id = 1;
  string order_id = 2;
  string order_no = 3;
  string business_type = 4;
  string direction = 5;
  string status = 6;
  string fee_code = 7;
  string fee_name = 8;
  string settlement_party_id = 9;
  string settlement_party_name = 10;
  string billing_unit = 11;
  string quantity = 12;
  string unit_price = 13;
  string total_amount = 14;
  string net_amount = 15;
  string tax_amount = 16;
  string currency = 17;
  string exchange_rate = 18;
  string base_currency = 19;
  string base_currency_amount = 20;
  string expense_date = 21;
  optional string note = 22;
  uint64 version = 23;
  string created_at = 24;
  string updated_at = 25;
  optional string tax_rate = 26;
  string customer_id = 27;
  string customer_name = 28;
}

message FeeLedgerSummary {
  int64 active_count = 1;
  string receivable_base_amount = 2;
  string payable_base_amount = 3;
  string profit_base_amount = 4;
  string base_currency = 5;
}

message ListFeeLedgerResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated FeeLedgerItem data = 4;
  int64 total = 5;
  FeeLedgerSummary summary = 6;
  string trace_id = 7;
}

message ListBillsRequest {
  int32 page = 1;
  int32 page_size = 2;
  optional string keyword = 3;
  optional string direction = 4;
  optional string status = 5;
  optional string settlement_party_id = 6;
  optional string currency = 7;
  optional string bill_date_from = 8;
  optional string bill_date_to = 9;
}

message GetBillRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message CreateBillRequest {
  repeated string fee_ids = 1 [(google.api.field_behavior) = REQUIRED];
  string bill_date = 2 [(google.api.field_behavior) = REQUIRED];
  optional string due_date = 3;
  optional string note = 4;
  string idempotency_key = 5 [(google.api.field_behavior) = REQUIRED];
  optional string statement_title = 6;
  optional int32 payment_terms_days = 7;
}

message UpdateBillRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  string bill_date = 2 [(google.api.field_behavior) = REQUIRED];
  optional string due_date = 3;
  optional string note = 4;
  uint64 expected_version = 5 [(google.api.field_behavior) = REQUIRED];
  optional string statement_title = 6;
  optional int32 payment_terms_days = 7;
}

message ConfirmBillRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  uint64 expected_version = 2 [(google.api.field_behavior) = REQUIRED];
}

message CancelBillRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  uint64 expected_version = 2 [(google.api.field_behavior) = REQUIRED];
  string reason = 3 [(google.api.field_behavior) = REQUIRED];
}

message FinanceBillLine {
  string id = 1;
  string order_fee_id = 2;
  string order_id = 3;
  string order_no = 4;
  string business_type = 5;
  string fee_code = 6;
  string fee_name = 7;
  string total_amount = 8;
  string net_amount = 9;
  string tax_amount = 10;
  string currency = 11;
  string exchange_rate = 12;
  string base_currency = 13;
  string base_currency_amount = 14;
  bool active = 15;
  optional string tax_rate = 16;
}

message FinanceBill {
  string id = 1;
  string bill_no = 2;
  string direction = 3;
  string status = 4;
  string settlement_party_id = 5;
  string settlement_party_name = 6;
  string currency = 7;
  string base_currency = 8;
  string total_amount = 9;
  string net_amount = 10;
  string tax_amount = 11;
  string base_currency_amount = 12;
  int32 fee_count = 13;
  string bill_date = 14;
  optional string due_date = 15;
  optional string note = 16;
  uint64 version = 17;
  optional string confirmed_at = 18;
  optional string confirmed_by = 19;
  optional string cancelled_at = 20;
  optional string cancelled_by = 21;
  optional string cancellation_reason = 22;
  repeated FinanceBillLine lines = 23;
  string created_at = 24;
  string updated_at = 25;
  string verified_amount = 26;
  string unverified_amount = 27;
  optional string batch_id = 28;
  optional string batch_no = 29;
  optional string statement_title = 30;
  optional int32 payment_terms_days = 31;
}

message BillGroupingPolicy {
  bool split_by_order = 1;
  bool split_by_tax_rate = 2;
}

message PreviewBillBatchRequest {
  repeated string fee_ids = 1 [(google.api.field_behavior) = REQUIRED];
  BillGroupingPolicy grouping_policy = 2 [(google.api.field_behavior) = REQUIRED];
}

message BillBatchPreviewGroup {
  string group_key = 1;
  string direction = 2;
  string settlement_party_id = 3;
  string settlement_party_name = 4;
  string currency = 5;
  string base_currency = 6;
  optional string order_id = 7;
  optional string order_no = 8;
  optional string tax_rate = 9;
  repeated FeeLedgerItem fees = 10;
  string total_amount = 11;
  string net_amount = 12;
  string tax_amount = 13;
  string base_currency_amount = 14;
}

message PreviewBillBatchResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated BillBatchPreviewGroup data = 4;
  string preview_token = 5;
  string trace_id = 6;
}

message CreateBillBatchGroupInput {
  string group_key = 1 [(google.api.field_behavior) = REQUIRED];
  string statement_title = 2 [(google.api.field_behavior) = REQUIRED];
  string bill_date = 3 [(google.api.field_behavior) = REQUIRED];
  optional string due_date = 4;
  optional int32 payment_terms_days = 5;
  optional string note = 6;
}

message CreateBillBatchRequest {
  repeated string fee_ids = 1 [(google.api.field_behavior) = REQUIRED];
  BillGroupingPolicy grouping_policy = 2 [(google.api.field_behavior) = REQUIRED];
  repeated CreateBillBatchGroupInput groups = 3 [(google.api.field_behavior) = REQUIRED];
  string preview_token = 4 [(google.api.field_behavior) = REQUIRED];
  string idempotency_key = 5 [(google.api.field_behavior) = REQUIRED];
}

message FinanceBillBatch {
  string id = 1;
  string batch_no = 2;
  bool split_by_order = 3;
  bool split_by_tax_rate = 4;
  int32 fee_count = 5;
  int32 bill_count = 6;
  string total_base_amount = 7;
  string base_currency = 8;
  repeated FinanceBill bills = 9;
  string created_at = 10;
}

message CreateBillBatchResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  FinanceBillBatch data = 4;
  string trace_id = 5;
}

message BillExpectedVersion {
  string bill_id = 1 [(google.api.field_behavior) = REQUIRED];
  uint64 expected_version = 2 [(google.api.field_behavior) = REQUIRED];
}

message ConfirmBillBatchRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  repeated BillExpectedVersion bills = 2 [(google.api.field_behavior) = REQUIRED];
}

message ConfirmBillBatchResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  FinanceBillBatch data = 4;
  string trace_id = 5;
}

message ListBillsResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated FinanceBill data = 4;
  int64 total = 5;
  string trace_id = 6;
}

message GetBillResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  FinanceBill data = 4;
  string trace_id = 5;
}

message CreateBillResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  FinanceBill data = 4;
  string trace_id = 5;
}

message UpdateBillResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  FinanceBill data = 4;
  string trace_id = 5;
}

message ConfirmBillResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  FinanceBill data = 4;
  string trace_id = 5;
}

message CancelBillResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  FinanceBill data = 4;
  string trace_id = 5;
}

message ListInvoicesRequest { int32 page = 1; int32 page_size = 2; optional string keyword = 3; optional string direction = 4; optional string status = 5; }
message GetInvoiceRequest { string id = 1 [(google.api.field_behavior) = REQUIRED]; }
message CreateInvoiceRequest { repeated string bill_ids = 1 [(google.api.field_behavior) = REQUIRED]; string invoice_type = 2 [(google.api.field_behavior) = REQUIRED]; optional string note = 3; string idempotency_key = 4 [(google.api.field_behavior) = REQUIRED]; string invoice_profile_id = 5 [(google.api.field_behavior) = REQUIRED]; }
message IssueInvoiceRequest { string id = 1 [(google.api.field_behavior) = REQUIRED]; uint64 expected_version = 2 [(google.api.field_behavior) = REQUIRED]; string tax_invoice_no = 3 [(google.api.field_behavior) = REQUIRED]; string invoice_date = 4 [(google.api.field_behavior) = REQUIRED]; }
message CancelInvoiceRequest { string id = 1 [(google.api.field_behavior) = REQUIRED]; uint64 expected_version = 2 [(google.api.field_behavior) = REQUIRED]; string reason = 3 [(google.api.field_behavior) = REQUIRED]; }
message RedFlushInvoiceRequest { string id = 1 [(google.api.field_behavior) = REQUIRED]; uint64 expected_version = 2 [(google.api.field_behavior) = REQUIRED]; string red_invoice_no = 3 [(google.api.field_behavior) = REQUIRED]; string red_invoice_date = 4 [(google.api.field_behavior) = REQUIRED]; string reason = 5 [(google.api.field_behavior) = REQUIRED]; }
message FinanceInvoiceBill { string id = 1; string bill_id = 2; string bill_no = 3; string amount = 4; string tax_amount = 5; bool active = 6; }
message FinanceInvoiceLine { string id = 1; int32 line_no = 2; string item_code = 3; string item_name = 4; string tax_rate = 5; string net_amount = 6; string tax_amount = 7; string total_amount = 8; string currency = 9; int32 source_line_count = 10; }
message FinanceInvoice { string id = 1; string record_no = 2; string direction = 3; string status = 4; string invoice_type = 5; string settlement_party_id = 6; string settlement_party_name = 7; string currency = 8; string total_amount = 9; string tax_amount = 10; int32 bill_count = 11; optional string tax_invoice_no = 12; optional string invoice_date = 13; optional string note = 14; uint64 version = 15; optional string issued_at = 16; optional string cancelled_at = 17; optional string cancellation_reason = 18; repeated FinanceInvoiceBill bill_links = 19; string created_at = 20; string updated_at = 21; optional string red_invoice_no = 22; optional string red_invoice_date = 23; optional string red_flushed_at = 24; optional string red_flush_reason = 25; string net_amount = 26; optional string invoice_profile_id = 27; optional string invoice_title = 28; optional string taxpayer_identification_no = 29; optional string registered_address = 30; optional string registered_phone = 31; optional string bank_name = 32; optional string bank_account = 33; repeated FinanceInvoiceLine lines = 34; }
message ListInvoicesResponse { bool success = 1; int32 code = 2; string message = 3; repeated FinanceInvoice data = 4; int64 total = 5; string trace_id = 6; }
message GetInvoiceResponse { bool success = 1; int32 code = 2; string message = 3; FinanceInvoice data = 4; string trace_id = 5; }
message CreateInvoiceResponse { bool success = 1; int32 code = 2; string message = 3; FinanceInvoice data = 4; string trace_id = 5; }
message IssueInvoiceResponse { bool success = 1; int32 code = 2; string message = 3; FinanceInvoice data = 4; string trace_id = 5; }
message CancelInvoiceResponse { bool success = 1; int32 code = 2; string message = 3; FinanceInvoice data = 4; string trace_id = 5; }
