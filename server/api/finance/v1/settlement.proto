    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.bill.update" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/finance/bill-settlement-account-update-candidates"};
  }

