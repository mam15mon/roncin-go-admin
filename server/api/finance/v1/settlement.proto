    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.bill.read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/finance/bills"};
  }
  rpc ListBillCreationCandidates(ListBillCreationCandidatesRequest) returns (ListBillCreationCandidatesResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.bill.create" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/finance/bills/creation-candidates"};
  }
  rpc ListBillSettlementAccountCandidates(ListBillSettlementAccountCandidatesRequest) returns (ListBillSettlementAccountCandidatesResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.bill.create" scope: DATA_SCOPE_ORGANIZATION};
