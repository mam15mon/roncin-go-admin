syntax = "proto3";

package finance.v1;

import "access/v1/access.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";

option go_package = "github.com/roncin/roncin-go-admin/server/api/finance/v1;v1";

// SettlementService 提供跨业务费用台账及后续账单、开票、收付和核销能力。
service SettlementService {
  // ListFeeLedger 获取当前组织全部业务线的应收应付费用总台账。
  rpc ListFeeLedger(ListFeeLedgerRequest) returns (ListFeeLedgerResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.fee.read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/finance/fees"};
  }

  rpc ListBills(ListBillsRequest) returns (ListBillsResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.bill.read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/finance/bills"};
  }

  rpc GetBill(GetBillRequest) returns (GetBillResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.bill.read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/finance/bills/{id}"};
  }

  rpc CreateBill(CreateBillRequest) returns (CreateBillResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.bill.create" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {post: "/api/v1/finance/bills" body: "*"};
  }

  rpc UpdateBill(UpdateBillRequest) returns (UpdateBillResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.bill.update" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {put: "/api/v1/finance/bills/{id}" body: "*"};
  }

  rpc ConfirmBill(ConfirmBillRequest) returns (ConfirmBillResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.bill.confirm" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {post: "/api/v1/finance/bills/{id}/confirm" body: "*"};
  }

  rpc CancelBill(CancelBillRequest) returns (CancelBillResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.bill.update" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {post: "/api/v1/finance/bills/{id}/cancel" body: "*"};
  }
  rpc ListInvoices(ListInvoicesRequest) returns (ListInvoicesResponse) { option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.invoice.read" scope: DATA_SCOPE_ORGANIZATION}; option (google.api.http) = {get: "/api/v1/finance/invoices"}; }
  rpc GetInvoice(GetInvoiceRequest) returns (GetInvoiceResponse) { option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.invoice.read" scope: DATA_SCOPE_ORGANIZATION}; option (google.api.http) = {get: "/api/v1/finance/invoices/{id}"}; }
  rpc CreateInvoice(CreateInvoiceRequest) returns (CreateInvoiceResponse) { option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.invoice.create" scope: DATA_SCOPE_ORGANIZATION}; option (google.api.http) = {post: "/api/v1/finance/invoices" body: "*"}; }
  rpc IssueInvoice(IssueInvoiceRequest) returns (IssueInvoiceResponse) { option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.invoice.update" scope: DATA_SCOPE_ORGANIZATION}; option (google.api.http) = {post: "/api/v1/finance/invoices/{id}/issue" body: "*"}; }
  rpc CancelInvoice(CancelInvoiceRequest) returns (CancelInvoiceResponse) { option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.invoice.update" scope: DATA_SCOPE_ORGANIZATION}; option (google.api.http) = {post: "/api/v1/finance/invoices/{id}/cancel" body: "*"}; }
}

message ListFeeLedgerRequest {
  int32 page = 1;
  int32 page_size = 2;
  optional string keyword = 3;
  optional string business_type = 4;
  optional string direction = 5;
  optional string status = 6;
  optional string settlement_party_id = 7;
  optional string currency = 8;
  optional string expense_date_from = 9;
  optional string expense_date_to = 10;
}

message FeeLedgerItem {
  string id = 1;
  string order_id = 2;
  string order_no = 3;
  string business_type = 4;
  string direction = 5;
  string status = 6;
  string fee_code = 7;
  string fee_name = 8;
  string settlement_party_id = 9;
  string settlement_party_name = 10;
  string billing_unit = 11;
  string quantity = 12;
  string unit_price = 13;
  string total_amount = 14;
  string net_amount = 15;
  string tax_amount = 16;
  string currency = 17;
  string exchange_rate = 18;
  string base_currency = 19;
  string base_currency_amount = 20;
  string expense_date = 21;
  optional string note = 22;
  uint64 version = 23;
  string created_at = 24;
  string updated_at = 25;
}

message FeeLedgerSummary {
  int64 active_count = 1;
  string receivable_base_amount = 2;
  string payable_base_amount = 3;
  string profit_base_amount = 4;
  string base_currency = 5;
}

message ListFeeLedgerResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated FeeLedgerItem data = 4;
  int64 total = 5;
  FeeLedgerSummary summary = 6;
  string trace_id = 7;
}

message ListBillsRequest {
  int32 page = 1;
  int32 page_size = 2;
  optional string keyword = 3;
  optional string direction = 4;
  optional string status = 5;
  optional string settlement_party_id = 6;
  optional string currency = 7;
  optional string bill_date_from = 8;
  optional string bill_date_to = 9;
}

message GetBillRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message CreateBillRequest {
  repeated string fee_ids = 1 [(google.api.field_behavior) = REQUIRED];
  string bill_date = 2 [(google.api.field_behavior) = REQUIRED];
  optional string due_date = 3;
  optional string note = 4;
  string idempotency_key = 5 [(google.api.field_behavior) = REQUIRED];
}

message UpdateBillRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  string bill_date = 2 [(google.api.field_behavior) = REQUIRED];
  optional string due_date = 3;
  optional string note = 4;
  uint64 expected_version = 5 [(google.api.field_behavior) = REQUIRED];
}

message ConfirmBillRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  uint64 expected_version = 2 [(google.api.field_behavior) = REQUIRED];
}

message CancelBillRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  uint64 expected_version = 2 [(google.api.field_behavior) = REQUIRED];
  string reason = 3 [(google.api.field_behavior) = REQUIRED];
}

message FinanceBillLine {
  string id = 1;
  string order_fee_id = 2;
  string order_id = 3;
  string order_no = 4;
  string business_type = 5;
  string fee_code = 6;
  string fee_name = 7;
  string total_amount = 8;
  string net_amount = 9;
  string tax_amount = 10;
  string currency = 11;
  string exchange_rate = 12;
  string base_currency = 13;
  string base_currency_amount = 14;
  bool active = 15;
}

message FinanceBill {
  string id = 1;
  string bill_no = 2;
  string direction = 3;
  string status = 4;
  string settlement_party_id = 5;
  string settlement_party_name = 6;
  string currency = 7;
  string base_currency = 8;
  string total_amount = 9;
  string net_amount = 10;
  string tax_amount = 11;
  string base_currency_amount = 12;
  int32 fee_count = 13;
  string bill_date = 14;
  optional string due_date = 15;
  optional string note = 16;
  uint64 version = 17;
  optional string confirmed_at = 18;
  optional string confirmed_by = 19;
  optional string cancelled_at = 20;
  optional string cancelled_by = 21;
  optional string cancellation_reason = 22;
  repeated FinanceBillLine lines = 23;
  string created_at = 24;
  string updated_at = 25;
}

message ListBillsResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated FinanceBill data = 4;
  int64 total = 5;
  string trace_id = 6;
}

message GetBillResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  FinanceBill data = 4;
  string trace_id = 5;
}

message CreateBillResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  FinanceBill data = 4;
  string trace_id = 5;
}

message UpdateBillResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  FinanceBill data = 4;
  string trace_id = 5;
}

message ConfirmBillResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  FinanceBill data = 4;
  string trace_id = 5;
}

message CancelBillResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  FinanceBill data = 4;
  string trace_id = 5;
}

message ListInvoicesRequest { int32 page = 1; int32 page_size = 2; optional string keyword = 3; optional string direction = 4; optional string status = 5; }
message GetInvoiceRequest { string id = 1 [(google.api.field_behavior) = REQUIRED]; }
message CreateInvoiceRequest { repeated string bill_ids = 1 [(google.api.field_behavior) = REQUIRED]; string invoice_type = 2 [(google.api.field_behavior) = REQUIRED]; optional string note = 3; string idempotency_key = 4 [(google.api.field_behavior) = REQUIRED]; }
message IssueInvoiceRequest { string id = 1 [(google.api.field_behavior) = REQUIRED]; uint64 expected_version = 2 [(google.api.field_behavior) = REQUIRED]; string tax_invoice_no = 3 [(google.api.field_behavior) = REQUIRED]; string invoice_date = 4 [(google.api.field_behavior) = REQUIRED]; }
message CancelInvoiceRequest { string id = 1 [(google.api.field_behavior) = REQUIRED]; uint64 expected_version = 2 [(google.api.field_behavior) = REQUIRED]; string reason = 3 [(google.api.field_behavior) = REQUIRED]; }
message FinanceInvoiceBill { string id = 1; string bill_id = 2; string bill_no = 3; string amount = 4; string tax_amount = 5; bool active = 6; }
message FinanceInvoice { string id = 1; string record_no = 2; string direction = 3; string status = 4; string invoice_type = 5; string settlement_party_id = 6; string settlement_party_name = 7; string currency = 8; string total_amount = 9; string tax_amount = 10; int32 bill_count = 11; optional string tax_invoice_no = 12; optional string invoice_date = 13; optional string note = 14; uint64 version = 15; optional string issued_at = 16; optional string cancelled_at = 17; optional string cancellation_reason = 18; repeated FinanceInvoiceBill bill_links = 19; string created_at = 20; string updated_at = 21; }
message ListInvoicesResponse { bool success = 1; int32 code = 2; string message = 3; repeated FinanceInvoice data = 4; int64 total = 5; string trace_id = 6; }
message GetInvoiceResponse { bool success = 1; int32 code = 2; string message = 3; FinanceInvoice data = 4; string trace_id = 5; }
message CreateInvoiceResponse { bool success = 1; int32 code = 2; string message = 3; FinanceInvoice data = 4; string trace_id = 5; }
message IssueInvoiceResponse { bool success = 1; int32 code = 2; string message = 3; FinanceInvoice data = 4; string trace_id = 5; }
message CancelInvoiceResponse { bool success = 1; int32 code = 2; string message = 3; FinanceInvoice data = 4; string trace_id = 5; }
