  string trace_id = 2;
}

message ListFinanceBillTagOptionsRequest {
  string keyword = 1;
  int32 page = 2;
  int32 page_size = 3;
  optional string organization_id = 4;
}

message ListFinanceBillTagOptionsResponse {
  repeated BusinessTagSummary tags = 1;
  int64 total = 2;
  string trace_id = 3;
}

message ListFinanceBillTagAssignmentOptionsRequest {
  string organization_id = 1 [(google.api.field_behavior)=REQUIRED];
  string keyword = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListFinanceBillTagAssignmentOptionsResponse {
  repeated BusinessTagSummary tags = 1;
  int64 total = 2;
  string trace_id = 3;
}

message BatchAssignFinanceBillTagsRequest {
  repeated string bill_ids = 1 [(google.api.field_behavior) = REQUIRED];
  repeated string tag_ids = 2 [(google.api.field_behavior) = REQUIRED];
}

message BatchAssignFinanceBillTagsResponse {
  int32 assigned_count = 1;
  string trace_id = 2;
}

message BatchRemoveFinanceBillTagsRequest {
  repeated string bill_ids = 1 [(google.api.field_behavior) = REQUIRED];
  repeated string tag_ids = 2 [(google.api.field_behavior) = REQUIRED];
}

message BatchRemoveFinanceBillTagsResponse {
  int32 removed_count = 1;
  string trace_id = 2;
}
