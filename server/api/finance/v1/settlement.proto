syntax = "proto3";

package finance.v1;

import "access/v1/access.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/wrappers.proto";
import "order/v1/order_fee.proto";

option go_package = "github.com/roncin/roncin-go-admin/server/api/finance/v1;v1";

// SettlementService 提供跨业务费用台账及后续账单、开票、收付和核销能力。
service SettlementService {
  // ListFeeLedger 获取当前组织全部业务线的应收应付费用总台账。
  rpc ListFeeLedger(ListFeeLedgerRequest) returns (ListFeeLedgerResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.fee.read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/finance/fees"};
  }
  rpc GetFeeLedgerOrderDetail(GetFeeLedgerOrderDetailRequest) returns (GetFeeLedgerOrderDetailResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.fee.read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/finance/fees/orders/{order_id}"};
  }

  // GetFeeLedgerPreference 获取当前用户的费用明细表头、分页、排序与颜色设置。
  rpc GetFeeLedgerPreference(GetFeeLedgerPreferenceRequest) returns (GetFeeLedgerPreferenceResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.fee.read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/finance/fees/preference"};
  }

  // UpdateFeeLedgerPreference 保存当前用户的费用明细个性化设置。
  rpc UpdateFeeLedgerPreference(UpdateFeeLedgerPreferenceRequest) returns (UpdateFeeLedgerPreferenceResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.fee.read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {put: "/api/v1/finance/fees/preference" body: "*"};
  }

  // ResetFeeLedgerPreference 删除当前用户的个性化设置并恢复系统默认值。
  rpc ResetFeeLedgerPreference(ResetFeeLedgerPreferenceRequest) returns (ResetFeeLedgerPreferenceResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.fee.read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {delete: "/api/v1/finance/fees/preference"};
  }

  // GetBilledFeeEditPolicy 获取账单创建后的费用修改策略。
  rpc GetBilledFeeEditPolicy(GetBilledFeeEditPolicyRequest) returns (GetBilledFeeEditPolicyResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.bill.read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/finance/custom-settings/billed-fee-edit-policy"};
  }

  // UpdateBilledFeeEditPolicy 更新账单创建后的费用修改策略。
  rpc UpdateBilledFeeEditPolicy(UpdateBilledFeeEditPolicyRequest) returns (UpdateBilledFeeEditPolicyResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.bill.update" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {put: "/api/v1/finance/custom-settings/billed-fee-edit-policy" body: "*"};
  }

