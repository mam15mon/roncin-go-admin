syntax = "proto3";

package finance.v1;

option go_package = "github.com/roncin/roncin-go-admin/server/api/finance/v1;v1";

// ErrorReason 定义前端需要据此执行明确交互分支的财务错误原因。
enum ErrorReason {
  ERROR_REASON_FINANCE_UNSPECIFIED = 0;
  ERROR_REASON_FEE_EXCHANGE_RATE_MISSING = 1;
  ERROR_REASON_FINANCE_BILL_FEE_INVALID = 2;
  ERROR_REASON_FINANCE_BILL_PREVIEW_STALE = 3;
  ERROR_REASON_FINANCE_INVOICE_PROFILE_REQUIRED = 4;
  ERROR_REASON_FINANCE_COMMISSION_ADJUSTMENT_EXCEEDS = 5;
  ERROR_REASON_FINANCE_COMMISSION_ADJUSTMENT_TRANSITION = 6;
  ERROR_REASON_FINANCE_COMMISSION_SOURCE_CHANGED = 7;
  ERROR_REASON_FINANCE_COMMISSION_UNCONFIRMED_FEES = 8;
  ERROR_REASON_FINANCE_COMMISSION_TRANSITION = 9;
  ERROR_REASON_FINANCE_COMMISSION_RULE_CONFLICT = 10;
}
