syntax = "proto3";

package finance.v1;

import "access/v1/access.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";

option go_package = "github.com/roncin/roncin-go-admin/server/api/finance/v1;v1";

// FeeCatalogService 维护订单费用录入使用的费用设置、计费单位和应税劳务目录。
service FeeCatalogService {
  rpc ListFeeSettings(ListFeeSettingsRequest) returns (ListFeeSettingsResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.fee_setting.read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/finance/fee-settings"};
  }
  rpc CreateFeeSetting(CreateFeeSettingRequest) returns (CreateFeeSettingResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.fee_setting.create" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {post: "/api/v1/finance/fee-settings" body: "*"};
  }
  rpc UpdateFeeSetting(UpdateFeeSettingRequest) returns (UpdateFeeSettingResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.fee_setting.update" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {put: "/api/v1/finance/fee-settings/{id}" body: "*"};
  }

  rpc ListBillingUnits(ListBillingUnitsRequest) returns (ListBillingUnitsResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.fee_setting.read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/finance/billing-units"};
  }
  rpc CreateBillingUnit(CreateBillingUnitRequest) returns (CreateBillingUnitResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.fee_setting.create" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {post: "/api/v1/finance/billing-units" body: "*"};
  }
  rpc UpdateBillingUnit(UpdateBillingUnitRequest) returns (UpdateBillingUnitResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.fee_setting.update" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {put: "/api/v1/finance/billing-units/{id}" body: "*"};
  }

  rpc ListTaxableServices(ListTaxableServicesRequest) returns (ListTaxableServicesResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.fee_setting.read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/finance/taxable-services"};
  }
  rpc CreateTaxableService(CreateTaxableServiceRequest) returns (CreateTaxableServiceResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.fee_setting.create" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {post: "/api/v1/finance/taxable-services" body: "*"};
  }
  rpc UpdateTaxableService(UpdateTaxableServiceRequest) returns (UpdateTaxableServiceResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.finance.fee_setting.update" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {put: "/api/v1/finance/taxable-services/{id}" body: "*"};
  }
}

message BillingUnit {
  string id = 1;
  string organization_id = 2;
  string code = 3;
  string name = 4;
  int32 sort_order = 5;
  bool enabled = 6;
  string created_at = 7;
  string updated_at = 8;
  bool is_container_unit = 9;
}

message TaxableService {
  string id = 1;
  string organization_id = 2;
  string name = 3;
  optional string short_name = 4;
  optional string goods_code = 5;
  string default_tax_rate = 6;
  bool enabled = 7;
  string created_at = 8;
  string updated_at = 9;
}

message FeeSetting {
  string id = 1;
  string organization_id = 2;
  string fee_code = 3;
  string name_zh = 4;
  optional string name_en = 5;
  optional string alias_name = 6;
  optional string service_type_id = 7;
  optional string service_type_name = 8;
  string default_currency = 9;
  string billing_unit_id = 10;
  string billing_unit_name = 11;
  optional string abnormal_case_id = 12;
  optional string abnormal_case_name = 13;
  string tax_rate = 14;
  string taxable_service_id = 15;
  string taxable_service_name = 16;
  bool enabled = 17;
  int32 sort_order = 18;
  string created_at = 19;
  string updated_at = 20;
}

message ListFeeSettingsRequest {}
message ListBillingUnitsRequest {}
message ListTaxableServicesRequest {}

message CreateFeeSettingRequest {
  string fee_code = 1 [(google.api.field_behavior) = REQUIRED];
  string name_zh = 2 [(google.api.field_behavior) = REQUIRED];
  optional string name_en = 3;
  optional string alias_name = 4;
  optional string service_type_id = 5;
  string default_currency = 6 [(google.api.field_behavior) = REQUIRED];
  string billing_unit_id = 7 [(google.api.field_behavior) = REQUIRED];
  optional string abnormal_case_id = 8;
  string tax_rate = 9 [(google.api.field_behavior) = REQUIRED];
  string taxable_service_id = 10 [(google.api.field_behavior) = REQUIRED];
  int32 sort_order = 11;
}

message UpdateFeeSettingRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  string fee_code = 2 [(google.api.field_behavior) = REQUIRED];
  string name_zh = 3 [(google.api.field_behavior) = REQUIRED];
  optional string name_en = 4;
  optional string alias_name = 5;
  optional string service_type_id = 6;
  string default_currency = 7 [(google.api.field_behavior) = REQUIRED];
  string billing_unit_id = 8 [(google.api.field_behavior) = REQUIRED];
  optional string abnormal_case_id = 9;
  string tax_rate = 10 [(google.api.field_behavior) = REQUIRED];
  string taxable_service_id = 11 [(google.api.field_behavior) = REQUIRED];
  bool enabled = 12;
  int32 sort_order = 13;
}

message CreateBillingUnitRequest {
  string code = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  int32 sort_order = 3;
  bool is_container_unit = 4;
}

message UpdateBillingUnitRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  string code = 2 [(google.api.field_behavior) = REQUIRED];
  string name = 3 [(google.api.field_behavior) = REQUIRED];
  int32 sort_order = 4;
  bool enabled = 5;
  bool is_container_unit = 6;
}

message CreateTaxableServiceRequest {
  string name = 1 [(google.api.field_behavior) = REQUIRED];
  optional string short_name = 2;
  optional string goods_code = 3;
  string default_tax_rate = 4 [(google.api.field_behavior) = REQUIRED];
}

message UpdateTaxableServiceRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  optional string short_name = 3;
  optional string goods_code = 4;
  string default_tax_rate = 5 [(google.api.field_behavior) = REQUIRED];
  bool enabled = 6;
}

message ListFeeSettingsResponse { bool success = 1; int32 code = 2; string message = 3; repeated FeeSetting data = 4; string trace_id = 5; }
message ListBillingUnitsResponse { bool success = 1; int32 code = 2; string message = 3; repeated BillingUnit data = 4; string trace_id = 5; }
message ListTaxableServicesResponse { bool success = 1; int32 code = 2; string message = 3; repeated TaxableService data = 4; string trace_id = 5; }
message CreateFeeSettingResponse { bool success = 1; int32 code = 2; string message = 3; FeeSetting data = 4; string trace_id = 5; }
message UpdateFeeSettingResponse { bool success = 1; int32 code = 2; string message = 3; FeeSetting data = 4; string trace_id = 5; }
message CreateBillingUnitResponse { bool success = 1; int32 code = 2; string message = 3; BillingUnit data = 4; string trace_id = 5; }
message UpdateBillingUnitResponse { bool success = 1; int32 code = 2; string message = 3; BillingUnit data = 4; string trace_id = 5; }
message CreateTaxableServiceResponse { bool success = 1; int32 code = 2; string message = 3; TaxableService data = 4; string trace_id = 5; }
message UpdateTaxableServiceResponse { bool success = 1; int32 code = 2; string message = 3; TaxableService data = 4; string trace_id = 5; }
