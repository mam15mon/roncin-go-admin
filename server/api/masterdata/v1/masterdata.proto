syntax = "proto3";

package masterdata.v1;

import "access/v1/access.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";

option go_package = "github.com/roncin/roncin-go-admin/server/api/masterdata/v1;v1";

service MasterDataService {
  rpc ListItems(ListMasterDataItemsRequest) returns (MasterDataItemListReply) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.master_data.item.read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/master-data/items"};
  }

  rpc CreateItem(CreateMasterDataItemRequest) returns (MasterDataItemReply) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.master_data.item.create" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {
      post: "/api/v1/master-data/items"
      body: "*"
    };
  }

  rpc UpdateItem(UpdateMasterDataItemRequest) returns (MasterDataItemReply) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.master_data.item.update" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {
      put: "/api/v1/master-data/items/{id}"
      body: "*"
    };
  }

  rpc ImportItems(ImportMasterDataItemsRequest) returns (MasterDataImportReply) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.master_data.item.import" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {
      post: "/api/v1/master-data/import"
      body: "*"
    };
  }

  rpc ListOptions(ListMasterDataOptionsRequest) returns (MasterDataOptionsReply) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.master_data.option.read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/master-data/options"};
  }

  rpc ListPorts(ListIndustryReferencesRequest) returns (PortListReply) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.master_data.port.read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/master-data/ports"};
  }

  rpc CreatePort(CreatePortRequest) returns (PortReply) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.master_data.port.create" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {post: "/api/v1/master-data/ports" body: "*"};
  }

  rpc UpdatePort(UpdatePortRequest) returns (PortReply) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.master_data.port.update" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {put: "/api/v1/master-data/ports/{id}" body: "*"};
  }

  rpc ListAirports(ListIndustryReferencesRequest) returns (AirportListReply) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.master_data.airport.read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/master-data/airports"};
  }

  rpc CreateAirport(CreateAirportRequest) returns (AirportReply) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.master_data.airport.create" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {post: "/api/v1/master-data/airports" body: "*"};
  }

  rpc UpdateAirport(UpdateAirportRequest) returns (AirportReply) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.master_data.airport.update" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {put: "/api/v1/master-data/airports/{id}" body: "*"};
  }

  rpc ListAirlines(ListIndustryReferencesRequest) returns (AirlineListReply) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.master_data.airline.read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/master-data/airlines"};
  }

  rpc CreateAirline(CreateAirlineRequest) returns (AirlineReply) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.master_data.airline.create" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {post: "/api/v1/master-data/airlines" body: "*"};
  }

  rpc UpdateAirline(UpdateAirlineRequest) returns (AirlineReply) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.master_data.airline.update" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {put: "/api/v1/master-data/airlines/{id}" body: "*"};
  }

  rpc ListShippingLines(ListIndustryReferencesRequest) returns (ShippingLineListReply) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.master_data.shipping_line.read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/master-data/shipping-lines"};
  }

  rpc CreateShippingLine(CreateShippingLineRequest) returns (ShippingLineReply) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.master_data.shipping_line.create" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {post: "/api/v1/master-data/shipping-lines" body: "*"};
  }

  rpc UpdateShippingLine(UpdateShippingLineRequest) returns (ShippingLineReply) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.master_data.shipping_line.update" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {put: "/api/v1/master-data/shipping-lines/{id}" body: "*"};
  }

  rpc ListCurrencies(ListCurrenciesRequest) returns (CurrencyListReply) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.master_data.currency.read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/reference/currencies"};
  }

  rpc ListAdministrativeRegions(ListAdministrativeRegionsRequest) returns (AdministrativeRegionListReply) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.master_data.administrative_region.read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/reference/administrative-regions"};
  }

  rpc ListNumberRules(ListNumberRulesRequest) returns (NumberRuleListReply) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.master_data.number_rule.read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/master-data/number-rules"};
  }

  rpc CreateNumberRule(CreateNumberRuleRequest) returns (NumberRuleReply) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.master_data.number_rule.create" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {
      post: "/api/v1/master-data/number-rules"
      body: "*"
    };
  }

  rpc UpdateNumberRule(UpdateNumberRuleRequest) returns (NumberRuleReply) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.master_data.number_rule.update" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {
      put: "/api/v1/master-data/number-rules/{id}"
      body: "*"
    };
  }

  rpc ListStatusTemplates(ListStatusTemplatesRequest) returns (StatusTemplateListReply) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.master_data.status_template.read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/master-data/status-templates"};
  }

  rpc CreateStatusTemplate(CreateStatusTemplateRequest) returns (StatusTemplateReply) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.master_data.status_template.create" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {
      post: "/api/v1/master-data/status-templates"
      body: "*"
    };
  }

  rpc PublishStatusTemplate(PublishStatusTemplateRequest) returns (StatusTemplateReply) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.master_data.status_template.publish" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {
      post: "/api/v1/master-data/status-templates/{id}/publish"
      body: "*"
    };
  }

  rpc SetDefaultStatusTemplate(SetDefaultStatusTemplateRequest) returns (StatusTemplateReply) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.master_data.status_template.set_default" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {
      post: "/api/v1/master-data/status-templates/{id}/set-default"
      body: "*"
    };
  }

  rpc ListMilestoneTemplates(ListMilestoneTemplatesRequest) returns (MilestoneTemplateListReply) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.master_data.milestone_template.read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/master-data/milestone-templates"};
  }

  rpc CreateMilestoneTemplate(CreateMilestoneTemplateRequest) returns (MilestoneTemplateReply) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.master_data.milestone_template.create" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {
      post: "/api/v1/master-data/milestone-templates"
      body: "*"
    };
  }

  rpc PublishMilestoneTemplate(PublishMilestoneTemplateRequest) returns (MilestoneTemplateReply) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.master_data.milestone_template.publish" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {
      post: "/api/v1/master-data/milestone-templates/{id}/publish"
      body: "*"
    };
  }

  rpc SetDefaultMilestoneTemplate(SetDefaultMilestoneTemplateRequest) returns (MilestoneTemplateReply) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.master_data.milestone_template.set_default" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {
      post: "/api/v1/master-data/milestone-templates/{id}/set-default"
      body: "*"
    };
  }
}

enum MasterDataImportMode {
  MASTER_DATA_IMPORT_MODE_UNSPECIFIED = 0;
  MASTER_DATA_IMPORT_MODE_CREATE_ONLY = 1;
  MASTER_DATA_IMPORT_MODE_UPSERT = 2;
}

enum MasterDataKind {
  MASTER_DATA_KIND_UNSPECIFIED = 0;
  MASTER_DATA_KIND_CURRENCY = 1;
  MASTER_DATA_KIND_COUNTRY = 2;
  MASTER_DATA_KIND_REGION = 3;
  MASTER_DATA_KIND_CONTAINER_SPEC = 7;
  MASTER_DATA_KIND_SERVICE_TYPE = 8;
  MASTER_DATA_KIND_CARGO_CATEGORY = 9;
  MASTER_DATA_KIND_ABNORMAL_CASE = 10;
}

enum DocumentType {
  DOCUMENT_TYPE_UNSPECIFIED = 0;
  DOCUMENT_TYPE_ORDER = 1;
  DOCUMENT_TYPE_BOOKING = 2;
  DOCUMENT_TYPE_HBL = 3;
  DOCUMENT_TYPE_MBL = 4;
  DOCUMENT_TYPE_BILL = 5;
  DOCUMENT_TYPE_STATEMENT = 6;
  DOCUMENT_TYPE_PAYMENT = 7;
  DOCUMENT_TYPE_INVOICE = 8;
}

enum DateFormat {
  DATE_FORMAT_UNSPECIFIED = 0;
  DATE_FORMAT_YYYYMMDD = 1;
  DATE_FORMAT_YYYYMM = 2;
  DATE_FORMAT_YYYY = 3;
  DATE_FORMAT_NONE = 4;
}

enum ResetPolicy {
  RESET_POLICY_UNSPECIFIED = 0;
  RESET_POLICY_DAILY = 1;
  RESET_POLICY_MONTHLY = 2;
  RESET_POLICY_YEARLY = 3;
  RESET_POLICY_NEVER = 4;
}

enum BusinessType {
  BUSINESS_TYPE_UNSPECIFIED = 0;
  BUSINESS_TYPE_SE = 1;
  BUSINESS_TYPE_SI = 2;
  BUSINESS_TYPE_AE = 3;
  BUSINESS_TYPE_AI = 4;
  BUSINESS_TYPE_LAND = 5;
  BUSINESS_TYPE_RAIL = 6;
}

message ListMasterDataItemsRequest {
  int32 page = 1;
  int32 page_size = 2;
  MasterDataKind kind = 3;
  string keyword = 4;
  optional bool enabled = 5;
}

// MasterDataAttributes 只承载仍由通用主数据管理的少量专属属性。
message MasterDataAttributes {
  optional string continent = 11;
  optional string currency_code = 12;
  optional int32 region_level = 13;
}

message CreateMasterDataItemRequest {
  MasterDataKind kind = 1 [(google.api.field_behavior) = REQUIRED];
  string code = 2 [(google.api.field_behavior) = REQUIRED];
  string name = 3 [(google.api.field_behavior) = REQUIRED];
  optional string name_en = 4;
  optional string parent_code = 5;
  optional string teu_factor = 7;
  string source = 8;
  int32 sort_order = 9;
  MasterDataAttributes attributes = 10;
}

message UpdateMasterDataItemRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  optional string name_en = 3;
  optional string parent_code = 4;
  optional string teu_factor = 6;
  string source = 7;
  int32 sort_order = 8;
  bool enabled = 9;
  MasterDataKind kind = 10 [(google.api.field_behavior) = REQUIRED];
  MasterDataAttributes attributes = 11;
}

message MasterDataImportItemInput {
  string code = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  optional string name_en = 3;
  optional string parent_code = 4;
  optional string teu_factor = 6;
  int32 sort_order = 7;
  optional bool enabled = 8;
  MasterDataAttributes attributes = 9;
}

message ImportMasterDataItemsRequest {
  MasterDataKind kind = 1 [(google.api.field_behavior) = REQUIRED];
  string source = 2 [(google.api.field_behavior) = REQUIRED];
  MasterDataImportMode mode = 3 [(google.api.field_behavior) = REQUIRED];
  repeated MasterDataImportItemInput items = 4 [(google.api.field_behavior) = REQUIRED];
}

message MasterDataImportReply {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated MasterDataItem data = 4;
  int32 created_count = 5;
  int32 updated_count = 6;
  string trace_id = 7;
}

message ListMasterDataOptionsRequest {}

message MasterDataItem {
  string id = 1;
  string organization_id = 2;
  MasterDataKind kind = 3;
  string code = 4;
  string name = 5;
  optional string name_en = 6;
  optional string parent_code = 7;
  optional string teu_factor = 9;
  string source = 10;
  int32 sort_order = 11;
  bool enabled = 12;
  string created_at = 13;
  string updated_at = 14;
  MasterDataAttributes attributes = 15;
}

message MasterDataItemListReply {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated MasterDataItem data = 4;
  int32 total = 5;
  int32 page = 6;
  int32 page_size = 7;
  string trace_id = 8;
}

message MasterDataItemReply {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  MasterDataItem data = 4;
  string trace_id = 5;
}

message MasterDataOptionsReply {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated MasterDataItem data = 4;
  string trace_id = 5;
}

message ListIndustryReferencesRequest {
  int32 page = 1;
  int32 page_size = 2;
  string keyword = 3;
  optional bool enabled = 4;
}

message Port {
  string id = 1;
  string organization_id = 2;
  string un_locode = 3;
  optional string name_zh = 4;
  string name_en = 5;
  string country_code = 6;
  repeated string transport_modes = 7;
  string source = 8;
  int32 sort_order = 9;
  bool enabled = 10;
  string created_at = 11;
  string updated_at = 12;
  optional string source_version = 13;
  optional string source_hash = 14;
}

message CreatePortRequest {
  string un_locode = 1 [(google.api.field_behavior) = REQUIRED];
  string name_zh = 2 [(google.api.field_behavior) = REQUIRED];
  string name_en = 3 [(google.api.field_behavior) = REQUIRED];
  string country_code = 4 [(google.api.field_behavior) = REQUIRED];
  repeated string transport_modes = 5;
  reserved 6;
  reserved "source";
  int32 sort_order = 7;
}

message UpdatePortRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  string name_zh = 2 [(google.api.field_behavior) = REQUIRED];
  string name_en = 3 [(google.api.field_behavior) = REQUIRED];
  string country_code = 4 [(google.api.field_behavior) = REQUIRED];
  repeated string transport_modes = 5;
  reserved 6;
  reserved "source";
  int32 sort_order = 7;
  bool enabled = 8;
}

message PortListReply {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated Port data = 4;
  int32 total = 5;
  int32 page = 6;
  int32 page_size = 7;
  string trace_id = 8;
}

message PortReply {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  Port data = 4;
  string trace_id = 5;
}

message Airport {
  string id = 1;
  string organization_id = 2;
  string iata_code = 3;
  optional string icao_code = 4;
  optional string name_zh = 5;
  string name_en = 6;
  optional string city_name_zh = 7;
  optional string city_name_en = 8;
  string country_code = 9;
  string source = 10;
  int32 sort_order = 11;
  bool enabled = 12;
  string created_at = 13;
  string updated_at = 14;
  optional string source_version = 15;
  optional string source_hash = 16;
}

message CreateAirportRequest {
  string iata_code = 1 [(google.api.field_behavior) = REQUIRED];
  optional string icao_code = 2;
  string name_zh = 3 [(google.api.field_behavior) = REQUIRED];
  string name_en = 4 [(google.api.field_behavior) = REQUIRED];
  string city_name_zh = 5 [(google.api.field_behavior) = REQUIRED];
  optional string city_name_en = 6;
  string country_code = 7 [(google.api.field_behavior) = REQUIRED];
  reserved 8;
  reserved "source";
  int32 sort_order = 9;
}

message UpdateAirportRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  optional string icao_code = 2;
  string name_zh = 3 [(google.api.field_behavior) = REQUIRED];
  string name_en = 4 [(google.api.field_behavior) = REQUIRED];
  string city_name_zh = 5 [(google.api.field_behavior) = REQUIRED];
  optional string city_name_en = 6;
  string country_code = 7 [(google.api.field_behavior) = REQUIRED];
  reserved 8;
  reserved "source";
  int32 sort_order = 9;
  bool enabled = 10;
}

message AirportListReply {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated Airport data = 4;
  int32 total = 5;
  int32 page = 6;
  int32 page_size = 7;
  string trace_id = 8;
}

message AirportReply {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  Airport data = 4;
  string trace_id = 5;
}

message Airline {
  string id = 1;
  string organization_id = 2;
  string iata_code = 3;
  optional string icao_code = 4;
  string awb_prefix = 5;
  string name_zh = 6;
  string name_en = 7;
  string country_code = 8;
  bool cargo_only = 9;
  string source = 10;
  int32 sort_order = 11;
  bool enabled = 12;
  string created_at = 13;
  string updated_at = 14;
}

message CreateAirlineRequest {
  string iata_code = 1 [(google.api.field_behavior) = REQUIRED];
  optional string icao_code = 2;
  string awb_prefix = 3 [(google.api.field_behavior) = REQUIRED];
  string name_zh = 4 [(google.api.field_behavior) = REQUIRED];
  string name_en = 5 [(google.api.field_behavior) = REQUIRED];
  string country_code = 6 [(google.api.field_behavior) = REQUIRED];
  bool cargo_only = 7;
  string source = 8;
  int32 sort_order = 9;
}

message UpdateAirlineRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  optional string icao_code = 2;
  string awb_prefix = 3 [(google.api.field_behavior) = REQUIRED];
  string name_zh = 4 [(google.api.field_behavior) = REQUIRED];
  string name_en = 5 [(google.api.field_behavior) = REQUIRED];
  string country_code = 6 [(google.api.field_behavior) = REQUIRED];
  bool cargo_only = 7;
  string source = 8;
  int32 sort_order = 9;
  bool enabled = 10;
}

message AirlineListReply {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated Airline data = 4;
  int32 total = 5;
  int32 page = 6;
  int32 page_size = 7;
  string trace_id = 8;
}

message AirlineReply {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  Airline data = 4;
  string trace_id = 5;
}

message ShippingLine {
  string id = 1;
  string organization_id = 2;
  string scac_code = 3;
  string name_zh = 4;
  string name_en = 5;
  string country_code = 6;
  optional string tracking_url = 7;
  optional string alliance = 8;
  repeated string container_prefixes = 9;
  string source = 10;
  int32 sort_order = 11;
  bool enabled = 12;
  string created_at = 13;
  string updated_at = 14;
}

message CreateShippingLineRequest {
  string scac_code = 1 [(google.api.field_behavior) = REQUIRED];
  string name_zh = 2 [(google.api.field_behavior) = REQUIRED];
  string name_en = 3 [(google.api.field_behavior) = REQUIRED];
  string country_code = 4 [(google.api.field_behavior) = REQUIRED];
  optional string tracking_url = 5;
  optional string alliance = 6;
  repeated string container_prefixes = 7;
  string source = 8;
  int32 sort_order = 9;
}

message UpdateShippingLineRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  string name_zh = 2 [(google.api.field_behavior) = REQUIRED];
  string name_en = 3 [(google.api.field_behavior) = REQUIRED];
  string country_code = 4 [(google.api.field_behavior) = REQUIRED];
  optional string tracking_url = 5;
  optional string alliance = 6;
  repeated string container_prefixes = 7;
  string source = 8;
  int32 sort_order = 9;
  bool enabled = 10;
}

message ShippingLineListReply {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated ShippingLine data = 4;
  int32 total = 5;
  int32 page = 6;
  int32 page_size = 7;
  string trace_id = 8;
}

message ShippingLineReply {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  ShippingLine data = 4;
  string trace_id = 5;
}

message ListCurrenciesRequest {}

message Currency {
  string id = 1;
  string code = 2;
  string name = 3;
  string symbol = 4;
  int32 minor_unit = 5;
  bool enabled = 6;
  string created_at = 7;
  string updated_at = 8;
}

message CurrencyListReply {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated Currency data = 4;
  string trace_id = 5;
}

message ListAdministrativeRegionsRequest {
  int32 level = 1 [(google.api.field_behavior) = REQUIRED];
  optional string parent_code = 2;
  string keyword = 3;
}

message AdministrativeRegion {
  string id = 1;
  string code = 2;
  string name = 3;
  int32 level = 4;
  optional string parent_code = 5;
  optional string region_type = 6;
  string source = 7;
  optional string source_version = 8;
  bool enabled = 9;
  string created_at = 10;
  string updated_at = 11;
}

message AdministrativeRegionListReply {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated AdministrativeRegion data = 4;
  string trace_id = 5;
}

message ListNumberRulesRequest {}

message CreateNumberRuleRequest {
  DocumentType document_type = 1 [(google.api.field_behavior) = REQUIRED];
  string prefix = 2;
  DateFormat date_format = 3 [(google.api.field_behavior) = REQUIRED];
  int32 sequence_length = 4 [(google.api.field_behavior) = REQUIRED];
  ResetPolicy reset_policy = 5 [(google.api.field_behavior) = REQUIRED];
