syntax = "proto3";

package admin.v1;

import "access/v1/access.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";

option go_package = "github.com/roncin/roncin-go-admin/server/api/admin/v1;v1";

service AdminService {
  rpc ListOrganizations(ListOrganizationsRequest) returns (ListOrganizationsResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.organization.read" scope: DATA_SCOPE_ALL};
    option (google.api.http) = {get: "/api/v1/admin/organizations"};
  }

  rpc CreateOrganization(CreateOrganizationRequest) returns (CreateOrganizationResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.organization.create" scope: DATA_SCOPE_ALL};
    option (google.api.http) = {
      post: "/api/v1/admin/organizations"
      body: "*"
    };
  }

  rpc UpdateOrganization(UpdateOrganizationRequest) returns (UpdateOrganizationResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.organization.update" scope: DATA_SCOPE_ALL};
    option (google.api.http) = {
      put: "/api/v1/admin/organizations/{id}"
      body: "*"
    };
  }

  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.user.read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/admin/users"};
  }

  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.user.create" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {
      post: "/api/v1/admin/users"
      body: "*"
    };
  }

  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.user.update" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {
      put: "/api/v1/admin/users/{id}"
      body: "*"
    };
  }

  rpc AuthorizeWeComUser(AuthorizeWeComUserRequest) returns (AuthorizeWeComUserResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.user.authorize_wecom" scope: DATA_SCOPE_ALL};
    option (google.api.http) = {
      post: "/api/v1/admin/users/{id}/wecom-authorization"
      body: "*"
    };
  }

  rpc ResetUserPassword(ResetUserPasswordRequest) returns (ResetUserPasswordResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.user.reset_password" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {
      put: "/api/v1/admin/users/{id}/password"
      body: "*"
    };
  }

  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.role.read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/admin/roles"};
  }

  rpc ListOrganizationRoles(ListOrganizationRolesRequest) returns (ListOrganizationRolesResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.role.read" scope: DATA_SCOPE_ALL};
    option (google.api.http) = {get: "/api/v1/admin/organizations/{organization_id}/roles"};
  }

  rpc CreateRole(CreateRoleRequest) returns (CreateRoleResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.role.create" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {
      post: "/api/v1/admin/roles"
      body: "*"
    };
  }

  rpc UpdateRole(UpdateRoleRequest) returns (UpdateRoleResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.role.update" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {
      put: "/api/v1/admin/roles/{id}"
      body: "*"
    };
  }

  rpc ListPermissions(ListPermissionsRequest) returns (ListPermissionsResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.permission.read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/admin/permissions"};
  }

  rpc ListAuditLogs(ListAuditLogsRequest) returns (ListAuditLogsResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.audit.read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/admin/audit-logs"};
  }
}

enum DataScope {
  DATA_SCOPE_UNSPECIFIED = 0;
  DATA_SCOPE_ALL = 1;
  DATA_SCOPE_ORGANIZATION = 2;
  DATA_SCOPE_ORGANIZATION_TREE = 3;
  DATA_SCOPE_SELF = 4;
}

enum OrganizationKind {
  ORGANIZATION_KIND_UNSPECIFIED = 0;
  ORGANIZATION_KIND_HEADQUARTERS = 1;
  ORGANIZATION_KIND_COMPANY = 2;
  ORGANIZATION_KIND_DEPARTMENT = 3;
  ORGANIZATION_KIND_TEAM = 4;
}

message ListOrganizationsRequest {}

message CreateOrganizationRequest {
  string code = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  string parent_id = 3 [(google.api.field_behavior) = REQUIRED];
  OrganizationKind kind = 4 [(google.api.field_behavior) = REQUIRED];
  optional string base_currency = 5;
}

message UpdateOrganizationRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  bool enabled = 3;
  optional string base_currency = 4;
}

message AdminOrganization {
  string id = 1;
  string code = 2;
  string name = 3;
  optional string parent_id = 4;
  bool enabled = 5;
  OrganizationKind kind = 6;
  string base_currency = 7;
}

message ListOrganizationsResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated AdminOrganization data = 4;
  string trace_id = 5;
}

message ResetUserPasswordResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  string trace_id = 4;
}

message CreateOrganizationResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  AdminOrganization data = 4;
  string trace_id = 5;
}

message UpdateOrganizationResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  AdminOrganization data = 4;
  string trace_id = 5;
}

message ListUsersRequest {
  int32 page = 1;
  int32 page_size = 2;
  string keyword = 3;
}

message CreateUserRequest {
  string username = 1 [(google.api.field_behavior) = REQUIRED];
  string display_name = 2 [(google.api.field_behavior) = REQUIRED];
  string password = 3 [(google.api.field_behavior) = REQUIRED];
  optional string email = 4;
  repeated string role_ids = 5;
}

message UpdateUserRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  string display_name = 2 [(google.api.field_behavior) = REQUIRED];
  optional string email = 3;
  bool enabled = 4;
  repeated string role_ids = 5;
}

message AuthorizeWeComUserRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  string organization_id = 2 [(google.api.field_behavior) = REQUIRED];
  string display_name = 3 [(google.api.field_behavior) = REQUIRED];
  optional string email = 4;
  repeated string role_ids = 5 [(google.api.field_behavior) = REQUIRED];
}

message ResetUserPasswordRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  string password = 2 [(google.api.field_behavior) = REQUIRED];
}

message ListOrganizationRolesRequest {
  string organization_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message AdminUser {
  string id = 1;
  string username = 2;
  string display_name = 3;
  optional string email = 4;
  bool enabled = 5;
  repeated string role_ids = 6;
  repeated string role_codes = 7;
  string created_at = 8;
  string updated_at = 9;
  optional string wecom_userid = 10;
  optional string wecom_name = 11;
}

message ListUsersResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated AdminUser data = 4;
  int32 total = 5;
  int32 page = 6;
  int32 page_size = 7;
  string trace_id = 8;
}

message CreateUserResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  AdminUser data = 4;
  string trace_id = 5;
}

message UpdateUserResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  AdminUser data = 4;
  string trace_id = 5;
}

message AuthorizeWeComUserResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  AdminUser data = 4;
  string trace_id = 5;
}

message ListRolesRequest {}

message CreateRoleRequest {
  string code = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  DataScope data_scope = 3 [(google.api.field_behavior) = REQUIRED];
  repeated string permission_keys = 4;
  repeated OrderOrganizationAccess order_organization_accesses = 5;
}

message UpdateRoleRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  DataScope data_scope = 3 [(google.api.field_behavior) = REQUIRED];
  bool enabled = 4;
  repeated string permission_keys = 5;
  repeated OrderOrganizationAccess order_organization_accesses = 6;
}

message OrderOrganizationAccess {
  string organization_id = 1 [(google.api.field_behavior) = REQUIRED];
  bool writable = 2;
}

message AdminRole {
  string id = 1;
  string organization_id = 2;
  string code = 3;
  string name = 4;
  DataScope data_scope = 5;
  bool enabled = 6;
  repeated string permission_keys = 7;
  string created_at = 8;
  string updated_at = 9;
  repeated OrderOrganizationAccess order_organization_accesses = 10;
}

message ListRolesResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated AdminRole data = 4;
  string trace_id = 5;
}

message ListOrganizationRolesResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated AdminRole data = 4;
  string trace_id = 5;
}

message CreateRoleResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  AdminRole data = 4;
  string trace_id = 5;
}

message UpdateRoleResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  AdminRole data = 4;
  string trace_id = 5;
}

message ListPermissionsRequest {}

message AdminPermission {
  string key = 1;
  string name = 2;
  string group = 3;
  string description = 4;
}

message ListPermissionsResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated AdminPermission data = 4;
  string trace_id = 5;
}

message ListAuditLogsRequest {
  int32 page = 1;
  int32 page_size = 2;
  string action = 3;
  string user_id = 4;
  string start_time = 5;
  string end_time = 6;
  string resource_type = 7;
  string resource_id = 8;
}

message AdminAuditLog {
  string id = 1;
  optional string organization_id = 2;
  optional string user_id = 3;
  string action = 4;
  optional string resource_type = 5;
  optional string resource_id = 6;
  string result = 7;
  string request_id = 8;
  string trace_id = 9;
  string ip_address = 10;
  map<string, string> details = 11;
  string created_at = 12;
}

message ListAuditLogsResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated AdminAuditLog data = 4;
  int32 total = 5;
  int32 page = 6;
  int32 page_size = 7;
  string trace_id = 8;
}
