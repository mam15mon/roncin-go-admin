syntax = "proto3";

package admin.v1;

import "access/v1/access.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";

option go_package = "github.com/roncin/roncin-go-admin/server/api/admin/v1;v1";

service AdminService {
  rpc ListOrganizations(ListOrganizationsRequest) returns (ListOrganizationsResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.organization.read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/admin/organizations"};
  }

  rpc CreateOrganization(CreateOrganizationRequest) returns (CreateOrganizationResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.organization.create" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {
      post: "/api/v1/admin/organizations"
      body: "*"
    };
  }

  rpc UpdateOrganization(UpdateOrganizationRequest) returns (UpdateOrganizationResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.organization.update" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {
      put: "/api/v1/admin/organizations/{id}"
      body: "*"
    };
  }

  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.user.read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/admin/users"};
  }

  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.user.create" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {
      post: "/api/v1/admin/users"
      body: "*"
    };
  }

  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.user.update" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {
      put: "/api/v1/admin/users/{id}"
      body: "*"
    };
  }

  rpc ListUserMemberships(ListUserMembershipsRequest) returns (ListUserMembershipsResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.user.read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/admin/users/{user_id}/memberships"};
  }

  rpc CreateUserMembership(CreateUserMembershipRequest) returns (CreateUserMembershipResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.user.update" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {
      post: "/api/v1/admin/users/{user_id}/memberships"
      body: "*"
    };
  }

  rpc UpdateUserMembership(UpdateUserMembershipRequest) returns (UpdateUserMembershipResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.user.update" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {
      put: "/api/v1/admin/users/{user_id}/memberships/{id}"
      body: "*"
    };
  }

  rpc DeleteUserMembership(DeleteUserMembershipRequest) returns (DeleteUserMembershipResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.user.update" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {delete: "/api/v1/admin/users/{user_id}/memberships/{id}"};
  }

  // TerminateUser 办理员工离职，保留全局账号、外部身份和历史业务记录。
  rpc TerminateUser(TerminateUserRequest) returns (TerminateUserResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.user.delete" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {
      post: "/api/v1/admin/users/{id}/termination"
      body: "*"
    };
  }

  rpc AuthorizeWeComUser(AuthorizeWeComUserRequest) returns (AuthorizeWeComUserResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.user.authorize_wecom" scope: DATA_SCOPE_ALL};
    option (google.api.http) = {
      post: "/api/v1/admin/users/{id}/wecom-authorization"
      body: "*"
    };
  }

  rpc AuthorizeDingTalkUser(AuthorizeDingTalkUserRequest) returns (AuthorizeDingTalkUserResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.user.authorize_dingtalk" scope: DATA_SCOPE_ALL};
    option (google.api.http) = {
      post: "/api/v1/admin/users/{id}/dingtalk-authorization"
      body: "*"
    };
  }

  rpc ResetUserPassword(ResetUserPasswordRequest) returns (ResetUserPasswordResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.user.reset_password" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {
      put: "/api/v1/admin/users/{id}/password"
      body: "*"
    };
  }

  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.role.read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/admin/roles"};
  }

  rpc ListOrganizationRoles(ListOrganizationRolesRequest) returns (ListOrganizationRolesResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.role.read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/admin/organizations/{organization_id}/roles"};
  }

  rpc CreateRole(CreateRoleRequest) returns (CreateRoleResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.role.create" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {
      post: "/api/v1/admin/roles"
      body: "*"
    };
  }

  rpc UpdateRole(UpdateRoleRequest) returns (UpdateRoleResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.role.update" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {
      put: "/api/v1/admin/roles/{id}"
      body: "*"
    };
  }

  rpc DeleteRole(DeleteRoleRequest) returns (DeleteRoleResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.role.delete" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {delete: "/api/v1/admin/roles/{id}"};
  }

  rpc ListPermissions(ListPermissionsRequest) returns (ListPermissionsResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.permission.read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/admin/permissions"};
  }

  rpc ListAuditLogs(ListAuditLogsRequest) returns (ListAuditLogsResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.audit.read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/admin/audit-logs"};
  }

  rpc BatchAuthorizeDingTalkUsers(BatchAuthorizeDingTalkUsersRequest) returns (BatchAuthorizeDingTalkUsersResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.user.authorize_dingtalk" scope: DATA_SCOPE_ALL};
    option (google.api.http) = {post: "/api/v1/admin/dingtalk/authorizations" body: "*"};
  }

  rpc StartDingTalkDirectorySync(StartDingTalkDirectorySyncRequest) returns (StartDingTalkDirectorySyncResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.user.dingtalk_directory.sync" scope: DATA_SCOPE_ALL};
    option (google.api.http) = {post: "/api/v1/admin/dingtalk/directory-syncs" body: "*"};
  }

  rpc GetLatestDingTalkDirectorySync(GetLatestDingTalkDirectorySyncRequest) returns (GetLatestDingTalkDirectorySyncResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.user.dingtalk_directory.sync" scope: DATA_SCOPE_ALL};
    option (google.api.http) = {get: "/api/v1/admin/dingtalk/directory-syncs/latest"};
  }

  rpc GetDingTalkDirectorySync(GetDingTalkDirectorySyncRequest) returns (GetDingTalkDirectorySyncResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.user.dingtalk_directory.sync" scope: DATA_SCOPE_ALL};
    option (google.api.http) = {get: "/api/v1/admin/dingtalk/directory-syncs/{task_id}"};
  }

}

enum DataScope {
  DATA_SCOPE_UNSPECIFIED = 0;
  DATA_SCOPE_ALL = 1;
  DATA_SCOPE_ORGANIZATION = 2;
  DATA_SCOPE_ORGANIZATION_TREE = 3;
  DATA_SCOPE_SELF = 4;
}

enum OrganizationKind {
  ORGANIZATION_KIND_UNSPECIFIED = 0;
  ORGANIZATION_KIND_SYSTEM = 1;
  ORGANIZATION_KIND_COMPANY = 2;
  ORGANIZATION_KIND_DEPARTMENT = 3;
  ORGANIZATION_KIND_TEAM = 4;
}

enum AdminUserStatus {
  ADMIN_USER_STATUS_UNSPECIFIED = 0;
  ADMIN_USER_STATUS_ACTIVE = 1;
  ADMIN_USER_STATUS_PENDING_AUTHORIZATION = 2;
  ADMIN_USER_STATUS_TERMINATED = 3;
  ADMIN_USER_STATUS_REMOVED_FROM_ORGANIZATION = 4;
  ADMIN_USER_STATUS_DISABLED = 5;
  ADMIN_USER_STATUS_PENDING_ASSIGNMENT = 6;
}

message ListOrganizationsRequest {}

message CreateOrganizationRequest {
  string code = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  optional string parent_id = 3;
  OrganizationKind kind = 4 [(google.api.field_behavior) = REQUIRED];
  optional string base_currency = 5;
}

message UpdateOrganizationRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  bool enabled = 3;
  optional string base_currency = 4;
}

message AdminOrganization {
  string id = 1;
  string code = 2;
  string name = 3;
  optional string parent_id = 4;
  bool enabled = 5;
  OrganizationKind kind = 6;
  string base_currency = 7;
}

message ListOrganizationsResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated AdminOrganization data = 4;
  string trace_id = 5;
}

message ResetUserPasswordResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  string trace_id = 4;
}

message CreateOrganizationResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  AdminOrganization data = 4;
  string trace_id = 5;
}

message UpdateOrganizationResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  AdminOrganization data = 4;
  string trace_id = 5;
}

message ListUsersRequest {
  int32 page = 1;
  int32 page_size = 2;
  string keyword = 3;
  // 是否启用：不传=不过滤；true=已启用成员；false=离职/停用成员（排除待分配）。
  optional bool enabled = 4;
  AdminUserStatus status = 5;
}

message CreateUserRequest {
  string username = 1 [(google.api.field_behavior) = REQUIRED];
  string display_name = 2 [(google.api.field_behavior) = REQUIRED];
  string password = 3 [(google.api.field_behavior) = REQUIRED];
  optional string email = 4;
  repeated string role_ids = 5;
}

message UpdateUserRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  optional string display_name = 2;
  optional string email = 3;
  bool enabled = 4;
  repeated string role_ids = 5;
}

message ListUserMembershipsRequest {
  string user_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message CreateUserMembershipRequest {
  string user_id = 1 [(google.api.field_behavior) = REQUIRED];
  string organization_id = 2 [(google.api.field_behavior) = REQUIRED];
  repeated string role_ids = 3;
  bool primary = 4;
}

message UpdateUserMembershipRequest {
  string user_id = 1 [(google.api.field_behavior) = REQUIRED];
  string id = 2 [(google.api.field_behavior) = REQUIRED];
  repeated string role_ids = 3;
  bool enabled = 4;
  bool primary = 5;
}

message DeleteUserMembershipRequest {
  string user_id = 1 [(google.api.field_behavior) = REQUIRED];
  string id = 2 [(google.api.field_behavior) = REQUIRED];
}

message TerminateUserRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message AuthorizeWeComUserRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  string organization_id = 2 [(google.api.field_behavior) = REQUIRED];
  string display_name = 3 [(google.api.field_behavior) = REQUIRED];
  optional string email = 4;
  repeated string role_ids = 5 [(google.api.field_behavior) = REQUIRED];
}

message AuthorizeDingTalkUserRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  string organization_id = 2 [(google.api.field_behavior) = REQUIRED];
  reserved 3, 4;
  repeated string role_ids = 5 [(google.api.field_behavior) = REQUIRED];
}

message ResetUserPasswordRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  string password = 2 [(google.api.field_behavior) = REQUIRED];
  optional string username = 3;
}

message ListOrganizationRolesRequest {
  string organization_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message AdminUser {
  string id = 1;
  string username = 2;
  string display_name = 3;
  optional string email = 4;
  bool enabled = 5;
  repeated string role_ids = 6;
  repeated string role_codes = 7;
  string created_at = 8;
  string updated_at = 9;
  optional string wecom_userid = 10;
  optional string wecom_name = 11;
  optional string dingtalk_unionid = 12;
  optional string dingtalk_name = 13;
  optional string avatar_url = 14;
  bool has_password = 15;
  optional string dingtalk_userid = 16;
  AdminUserStatus status = 17;
  bool current_membership_enabled = 18;
  repeated AdminUserOrganizationSummary organizations = 19;
  // 角色显示名，与 role_codes 按下标一一对应，供列表直接展示。
  repeated string role_names = 20;
  bool pending_assignment = 21;
  optional string dingtalk_job_number = 22;
  optional string dingtalk_mobile_masked = 23;
  repeated DingTalkDepartment dingtalk_departments = 24;
  optional string dingtalk_last_synced_at = 25;
}

// 用户归属组织摘要；仅在操作者持有 ALL 数据范围时填充，避免组织范围越权可见。
message AdminUserOrganizationSummary {
  string organization_id = 1;
  string organization_name = 2;
  bool primary = 3;
}

message AdminUserMembership {
  string id = 1;
  string user_id = 2;
  string organization_id = 3;
  string organization_code = 4;
  string organization_name = 5;
  OrganizationKind organization_kind = 6;
  bool primary = 7;
  bool enabled = 8;
  repeated string role_ids = 9;
  repeated string role_codes = 10;
  repeated string role_names = 11;
  string created_at = 12;
  string updated_at = 13;
}

message ListUsersResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated AdminUser data = 4;
  int32 total = 5;
  int32 page = 6;
  int32 page_size = 7;
  string trace_id = 8;
}

message CreateUserResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  AdminUser data = 4;
  string trace_id = 5;
}

message UpdateUserResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  AdminUser data = 4;
  string trace_id = 5;
}

message ListUserMembershipsResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated AdminUserMembership data = 4;
  string trace_id = 5;
}

message CreateUserMembershipResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  AdminUserMembership data = 4;
  string trace_id = 5;
}

message UpdateUserMembershipResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  AdminUserMembership data = 4;
  string trace_id = 5;
}

message DeleteUserMembershipResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  string trace_id = 4;
}

message TerminateUserResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  string trace_id = 4;
}

message AuthorizeWeComUserResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  AdminUser data = 4;
  string trace_id = 5;
}

message AuthorizeDingTalkUserResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  AdminUser data = 4;
  string trace_id = 5;
}

message ListRolesRequest {}

message CreateRoleRequest {
  // 角色编码可选；留空时由服务端自动生成机器标识，组织内唯一性由数据库唯一索引兜底。
  string code = 1;
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  DataScope data_scope = 3 [(google.api.field_behavior) = REQUIRED];
  repeated string permission_keys = 4;
}

message UpdateRoleRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  DataScope data_scope = 3 [(google.api.field_behavior) = REQUIRED];
  bool enabled = 4;
  repeated string permission_keys = 5;
}

message AdminRole {
  string id = 1;
  string organization_id = 2;
  string code = 3;
  string name = 4;
  DataScope data_scope = 5;
  bool enabled = 6;
  repeated string permission_keys = 7;
  string created_at = 8;
  string updated_at = 9;
  // 该角色被分配到的成员关系数量；前端据此禁用删除入口。
  int32 assignments_count = 10;
}

message ListRolesResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated AdminRole data = 4;
  string trace_id = 5;
}

message ListOrganizationRolesResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated AdminRole data = 4;
  string trace_id = 5;
}

message CreateRoleResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  AdminRole data = 4;
  string trace_id = 5;
}

message UpdateRoleResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  AdminRole data = 4;
  string trace_id = 5;
}

message DeleteRoleRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message DeleteRoleResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  string trace_id = 4;
}

message ListPermissionsRequest {}

message AdminPermission {
  string key = 1;
  string name = 2;
  string group = 3;
  string description = 4;
  // 勾选该权限时必须同时具备的基础权限码（如编辑类权限依赖对应查看权限）。
  repeated string requires = 5;
}

message ListPermissionsResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated AdminPermission data = 4;
  string trace_id = 5;
}

message ListAuditLogsRequest {
  int32 page = 1;
  int32 page_size = 2;
  string action = 3;
  string user_id = 4;
  string start_time = 5;
  string end_time = 6;
  string resource_type = 7;
  string resource_id = 8;
}

message AdminAuditLog {
  string id = 1;
  optional string organization_id = 2;
  optional string user_id = 3;
  string action = 4;
  optional string resource_type = 5;
  optional string resource_id = 6;
  string result = 7;
  string request_id = 8;
  string trace_id = 9;
  string ip_address = 10;
  map<string, string> details = 11;
  string created_at = 12;
  optional string actor_display_name = 13;
  optional string target_display_name = 14;
}

message ListAuditLogsResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated AdminAuditLog data = 4;
  int32 total = 5;
  int32 page = 6;
  int32 page_size = 7;
  string trace_id = 8;
}

// 钉钉来源部门仅用于展示，不代表本系统的业务组织。
message DingTalkDepartment {
  string id = 1;
  string name = 2;
}

message BatchAuthorizeDingTalkUsersRequest {
  repeated string user_ids = 1 [(google.api.field_behavior) = REQUIRED];
  string organization_id = 2 [(google.api.field_behavior) = REQUIRED];
  repeated string role_ids = 3 [(google.api.field_behavior) = REQUIRED];
}

message DingTalkAssignmentResult {
  string user_id = 1;
  bool success = 2;
  string reason = 3;
  string message = 4;
}

message BatchAuthorizeDingTalkUsersResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated DingTalkAssignmentResult data = 4;
  string trace_id = 5;
}

message StartDingTalkDirectorySyncRequest {}

message GetLatestDingTalkDirectorySyncRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message GetDingTalkDirectorySyncRequest {
  string task_id = 1 [(google.api.field_behavior) = REQUIRED];
  int32 page = 2;
  int32 page_size = 3;
}

message DingTalkDirectorySyncFailure {
  string user_id = 1;
  string department_id = 2;
  string reason = 3;
  string message = 4;
}

// 可用字段与授权范围反映本次执行，失败详情不含原始通讯录报文。
message DingTalkDirectorySync {
  string task_id = 1;
  string status = 2;
  string started_at = 3;
  optional string completed_at = 4;
  int32 total = 5;
  int32 created = 6;
  int32 updated = 7;
  int32 unchanged = 8;
  int32 failed = 9;
  string scope_summary = 10;
  repeated string available_fields = 11;
  repeated DingTalkDirectorySyncFailure failures = 12;
  int32 failure_total = 13;
  int32 page = 14;
  int32 page_size = 15;
  bool full_scope = 16;
  optional string last_error = 17;
}

message StartDingTalkDirectorySyncResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  optional DingTalkDirectorySync data = 4;
  string trace_id = 5;
}

message GetLatestDingTalkDirectorySyncResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  optional DingTalkDirectorySync data = 4;
  string trace_id = 5;
}

message GetDingTalkDirectorySyncResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  optional DingTalkDirectorySync data = 4;
  string trace_id = 5;
}
