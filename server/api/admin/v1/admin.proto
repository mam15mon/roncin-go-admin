syntax = "proto3";

package admin.v1;

import "access/v1/access.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";

option go_package = "github.com/roncin/roncin-go-admin/server/api/admin/v1;v1";

service AdminService {
  rpc ListOrganizations(ListOrganizationsRequest) returns (ListOrganizationsResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.organization.read" scope: DATA_SCOPE_ALL};
    option (google.api.http) = {get: "/api/v1/admin/organizations"};
  }

  rpc CreateOrganization(CreateOrganizationRequest) returns (CreateOrganizationResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.organization.create" scope: DATA_SCOPE_ALL};
    option (google.api.http) = {
      post: "/api/v1/admin/organizations"
      body: "*"
    };
  }

  rpc UpdateOrganization(UpdateOrganizationRequest) returns (UpdateOrganizationResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.organization.update" scope: DATA_SCOPE_ALL};
    option (google.api.http) = {
      put: "/api/v1/admin/organizations/{id}"
      body: "*"
    };
  }

  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.user.read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/admin/users"};
  }

  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.user.create" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {
      post: "/api/v1/admin/users"
      body: "*"
    };
  }

  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.user.update" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {
      put: "/api/v1/admin/users/{id}"
      body: "*"
    };
  }

  rpc ListUserMemberships(ListUserMembershipsRequest) returns (ListUserMembershipsResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.user.read" scope: DATA_SCOPE_ALL};
    option (google.api.http) = {get: "/api/v1/admin/users/{user_id}/memberships"};
  }

  rpc CreateUserMembership(CreateUserMembershipRequest) returns (CreateUserMembershipResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.user.update" scope: DATA_SCOPE_ALL};
    option (google.api.http) = {
      post: "/api/v1/admin/users/{user_id}/memberships"
      body: "*"
    };
  }

  rpc UpdateUserMembership(UpdateUserMembershipRequest) returns (UpdateUserMembershipResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.user.update" scope: DATA_SCOPE_ALL};
    option (google.api.http) = {
      put: "/api/v1/admin/users/{user_id}/memberships/{id}"
      body: "*"
    };
  }

  rpc DeleteUserMembership(DeleteUserMembershipRequest) returns (DeleteUserMembershipResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.user.update" scope: DATA_SCOPE_ALL};
    option (google.api.http) = {delete: "/api/v1/admin/users/{user_id}/memberships/{id}"};
  }

  // TerminateUser 办理员工离职，保留全局账号、外部身份和历史业务记录。
  rpc TerminateUser(TerminateUserRequest) returns (TerminateUserResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.user.delete" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {
      post: "/api/v1/admin/users/{id}/termination"
      body: "*"
    };
  }

  rpc AuthorizeWeComUser(AuthorizeWeComUserRequest) returns (AuthorizeWeComUserResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.user.authorize_wecom" scope: DATA_SCOPE_ALL};
    option (google.api.http) = {
      post: "/api/v1/admin/users/{id}/wecom-authorization"
      body: "*"
    };
  }

  rpc AuthorizeDingTalkUser(AuthorizeDingTalkUserRequest) returns (AuthorizeDingTalkUserResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.user.authorize_dingtalk" scope: DATA_SCOPE_ALL};
    option (google.api.http) = {
      post: "/api/v1/admin/users/{id}/dingtalk-authorization"
      body: "*"
    };
  }

  rpc ResetUserPassword(ResetUserPasswordRequest) returns (ResetUserPasswordResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.user.reset_password" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {
      put: "/api/v1/admin/users/{id}/password"
      body: "*"
    };
  }

  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.role.read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/admin/roles"};
  }

  rpc ListOrganizationRoles(ListOrganizationRolesRequest) returns (ListOrganizationRolesResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.role.read" scope: DATA_SCOPE_ALL};
    option (google.api.http) = {get: "/api/v1/admin/organizations/{organization_id}/roles"};
  }

  rpc CreateRole(CreateRoleRequest) returns (CreateRoleResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.role.create" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {
      post: "/api/v1/admin/roles"
      body: "*"
    };
  }

  rpc UpdateRole(UpdateRoleRequest) returns (UpdateRoleResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.role.update" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {
      put: "/api/v1/admin/roles/{id}"
      body: "*"
    };
  }

  rpc ListPermissions(ListPermissionsRequest) returns (ListPermissionsResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.permission.read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/admin/permissions"};
  }

  rpc ListAuditLogs(ListAuditLogsRequest) returns (ListAuditLogsResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.audit.read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/admin/audit-logs"};
  }

  // CreateDingTalkInvitation 为目标手机号预建扫码邀请（通道 A：员工扫码自动激活）。
  rpc CreateDingTalkInvitation(CreateDingTalkInvitationRequest) returns (CreateDingTalkInvitationResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.user.dingtalk_invitation.manage" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {
      post: "/api/v1/admin/dingtalk/invitations"
      body: "*"
    };
  }

  rpc ListDingTalkInvitations(ListDingTalkInvitationsRequest) returns (ListDingTalkInvitationsResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.user.dingtalk_invitation.manage" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/admin/dingtalk/invitations"};
  }

  rpc RevokeDingTalkInvitation(RevokeDingTalkInvitationRequest) returns (RevokeDingTalkInvitationResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.user.dingtalk_invitation.manage" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {delete: "/api/v1/admin/dingtalk/invitations/{id}"};
  }

  // GetDingTalkInvitation 获取单个邀请详情与二维码链接（用于弹窗展示，避免在列表全量暴露 Token）。
  rpc GetDingTalkInvitation(GetDingTalkInvitationRequest) returns (GetDingTalkInvitationResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.user.dingtalk_invitation.manage" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/admin/dingtalk/invitations/{id}"};
  }

  // ListDingTalkRegistrations 返回当前组织范围内待审批的钉钉扫码注册队列。
  rpc ListDingTalkRegistrations(ListDingTalkRegistrationsRequest) returns (ListDingTalkRegistrationsResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.user.dingtalk_invitation.manage" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/admin/dingtalk/registrations"};
  }

  // ListTransferOrganizations 返回待审批注册转派可选的目标分公司列表（启用中的公司）。
  rpc ListTransferOrganizations(ListTransferOrganizationsRequest) returns (ListTransferOrganizationsResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.user.dingtalk_invitation.manage" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/admin/dingtalk/registrations/organizations"};
  }

  // ApproveDingTalkRegistration 一站式同意：启用账号 + 建目标组织成员资格 + 授予初始角色 + 通知本人。
  rpc ApproveDingTalkRegistration(ApproveDingTalkRegistrationRequest) returns (ApproveDingTalkRegistrationResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.user.dingtalk_invitation.manage" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {
      post: "/api/v1/admin/dingtalk/registrations/{id}/approval"
      body: "*"
    };
  }

  rpc RejectDingTalkRegistration(RejectDingTalkRegistrationRequest) returns (RejectDingTalkRegistrationResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.user.dingtalk_invitation.manage" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {
      post: "/api/v1/admin/dingtalk/registrations/{id}/rejection"
      body: "*"
    };
  }

  // TransferDingTalkRegistration 将待审批注册转派至兄弟分公司。
  rpc TransferDingTalkRegistration(TransferDingTalkRegistrationRequest) returns (TransferDingTalkRegistrationResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "system.user.dingtalk_invitation.manage" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {
      post: "/api/v1/admin/dingtalk/registrations/{user_id}/transfer"
      body: "*"
    };
  }
}

enum DataScope {
  DATA_SCOPE_UNSPECIFIED = 0;
  DATA_SCOPE_ALL = 1;
  DATA_SCOPE_ORGANIZATION = 2;
  DATA_SCOPE_ORGANIZATION_TREE = 3;
  DATA_SCOPE_SELF = 4;
}

enum OrganizationKind {
  ORGANIZATION_KIND_UNSPECIFIED = 0;
  ORGANIZATION_KIND_HEADQUARTERS = 1;
  ORGANIZATION_KIND_COMPANY = 2;
  ORGANIZATION_KIND_DEPARTMENT = 3;
  ORGANIZATION_KIND_TEAM = 4;
}

enum AdminUserStatus {
  ADMIN_USER_STATUS_UNSPECIFIED = 0;
  ADMIN_USER_STATUS_ACTIVE = 1;
  ADMIN_USER_STATUS_PENDING_AUTHORIZATION = 2;
  ADMIN_USER_STATUS_TERMINATED = 3;
  ADMIN_USER_STATUS_REMOVED_FROM_ORGANIZATION = 4;
  ADMIN_USER_STATUS_DISABLED = 5;
}

message ListOrganizationsRequest {}

message CreateOrganizationRequest {
  string code = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  string parent_id = 3 [(google.api.field_behavior) = REQUIRED];
  OrganizationKind kind = 4 [(google.api.field_behavior) = REQUIRED];
  optional string base_currency = 5;
}

message UpdateOrganizationRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  bool enabled = 3;
  optional string base_currency = 4;
}

message AdminOrganization {
  string id = 1;
  string code = 2;
  string name = 3;
  optional string parent_id = 4;
  bool enabled = 5;
  OrganizationKind kind = 6;
  string base_currency = 7;
}

message ListOrganizationsResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated AdminOrganization data = 4;
  string trace_id = 5;
}

message ResetUserPasswordResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  string trace_id = 4;
}

message CreateOrganizationResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  AdminOrganization data = 4;
  string trace_id = 5;
}

message UpdateOrganizationResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  AdminOrganization data = 4;
  string trace_id = 5;
}

message ListUsersRequest {
  int32 page = 1;
  int32 page_size = 2;
  string keyword = 3;
}

message CreateUserRequest {
  string username = 1 [(google.api.field_behavior) = REQUIRED];
  string display_name = 2 [(google.api.field_behavior) = REQUIRED];
  string password = 3 [(google.api.field_behavior) = REQUIRED];
  optional string email = 4;
  repeated string role_ids = 5;
}

message UpdateUserRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  string display_name = 2 [(google.api.field_behavior) = REQUIRED];
  optional string email = 3;
  bool enabled = 4;
  repeated string role_ids = 5;
}

message ListUserMembershipsRequest {
  string user_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message CreateUserMembershipRequest {
  string user_id = 1 [(google.api.field_behavior) = REQUIRED];
  string organization_id = 2 [(google.api.field_behavior) = REQUIRED];
  repeated string role_ids = 3;
  bool primary = 4;
}

message UpdateUserMembershipRequest {
  string user_id = 1 [(google.api.field_behavior) = REQUIRED];
  string id = 2 [(google.api.field_behavior) = REQUIRED];
  repeated string role_ids = 3;
  bool enabled = 4;
  bool primary = 5;
}

message DeleteUserMembershipRequest {
  string user_id = 1 [(google.api.field_behavior) = REQUIRED];
  string id = 2 [(google.api.field_behavior) = REQUIRED];
}

message TerminateUserRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message AuthorizeWeComUserRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  string organization_id = 2 [(google.api.field_behavior) = REQUIRED];
  string display_name = 3 [(google.api.field_behavior) = REQUIRED];
  optional string email = 4;
  repeated string role_ids = 5 [(google.api.field_behavior) = REQUIRED];
}

message AuthorizeDingTalkUserRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  string organization_id = 2 [(google.api.field_behavior) = REQUIRED];
  string display_name = 3 [(google.api.field_behavior) = REQUIRED];
  optional string email = 4;
  repeated string role_ids = 5 [(google.api.field_behavior) = REQUIRED];
}

message ResetUserPasswordRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  string password = 2 [(google.api.field_behavior) = REQUIRED];
  optional string username = 3;
}

message ListOrganizationRolesRequest {
  string organization_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message AdminUser {
  string id = 1;
  string username = 2;
  string display_name = 3;
  optional string email = 4;
  bool enabled = 5;
  repeated string role_ids = 6;
  repeated string role_codes = 7;
  string created_at = 8;
  string updated_at = 9;
  optional string wecom_userid = 10;
  optional string wecom_name = 11;
  optional string dingtalk_unionid = 12;
  optional string dingtalk_name = 13;
  optional string avatar_url = 14;
  bool has_password = 15;
  optional string dingtalk_userid = 16;
  AdminUserStatus status = 17;
  bool current_membership_enabled = 18;
  repeated AdminUserOrganizationSummary organizations = 19;
}

// 用户归属组织摘要；仅在操作者持有 ALL 数据范围时填充，避免组织范围越权可见。
message AdminUserOrganizationSummary {
  string organization_id = 1;
  string organization_name = 2;
  bool primary = 3;
}

message AdminUserMembership {
  string id = 1;
  string user_id = 2;
  string organization_id = 3;
  string organization_code = 4;
  string organization_name = 5;
  OrganizationKind organization_kind = 6;
  bool primary = 7;
  bool enabled = 8;
  repeated string role_ids = 9;
  repeated string role_codes = 10;
  repeated string role_names = 11;
  string created_at = 12;
  string updated_at = 13;
}

message ListUsersResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated AdminUser data = 4;
  int32 total = 5;
  int32 page = 6;
  int32 page_size = 7;
  string trace_id = 8;
}

message CreateUserResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  AdminUser data = 4;
  string trace_id = 5;
}

message UpdateUserResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  AdminUser data = 4;
  string trace_id = 5;
}

message ListUserMembershipsResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated AdminUserMembership data = 4;
  string trace_id = 5;
}

message CreateUserMembershipResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  AdminUserMembership data = 4;
  string trace_id = 5;
}

message UpdateUserMembershipResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  AdminUserMembership data = 4;
  string trace_id = 5;
}

message DeleteUserMembershipResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  string trace_id = 4;
}

message TerminateUserResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  string trace_id = 4;
}

message AuthorizeWeComUserResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  AdminUser data = 4;
  string trace_id = 5;
}

message AuthorizeDingTalkUserResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  AdminUser data = 4;
  string trace_id = 5;
}

message ListRolesRequest {}

message CreateRoleRequest {
  // 角色编码可选；留空时由服务端自动生成机器标识，组织内唯一性由数据库唯一索引兜底。
  string code = 1;
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  DataScope data_scope = 3 [(google.api.field_behavior) = REQUIRED];
  repeated string permission_keys = 4;
}

message UpdateRoleRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  DataScope data_scope = 3 [(google.api.field_behavior) = REQUIRED];
  bool enabled = 4;
  repeated string permission_keys = 5;
}

message AdminRole {
  string id = 1;
  string organization_id = 2;
  string code = 3;
  string name = 4;
  DataScope data_scope = 5;
  bool enabled = 6;
  repeated string permission_keys = 7;
  string created_at = 8;
  string updated_at = 9;
}

message ListRolesResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated AdminRole data = 4;
  string trace_id = 5;
}

message ListOrganizationRolesResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated AdminRole data = 4;
  string trace_id = 5;
}

message CreateRoleResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  AdminRole data = 4;
  string trace_id = 5;
}

message UpdateRoleResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  AdminRole data = 4;
  string trace_id = 5;
}

message ListPermissionsRequest {}

message AdminPermission {
  string key = 1;
  string name = 2;
  string group = 3;
  string description = 4;
  // 勾选该权限时必须同时具备的基础权限码（如编辑类权限依赖对应查看权限）。
  repeated string requires = 5;
}

message ListPermissionsResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated AdminPermission data = 4;
  string trace_id = 5;
}

message ListAuditLogsRequest {
  int32 page = 1;
  int32 page_size = 2;
  string action = 3;
  string user_id = 4;
  string start_time = 5;
  string end_time = 6;
  string resource_type = 7;
  string resource_id = 8;
}

message AdminAuditLog {
  string id = 1;
  optional string organization_id = 2;
  optional string user_id = 3;
  string action = 4;
  optional string resource_type = 5;
  optional string resource_id = 6;
  string result = 7;
  string request_id = 8;
  string trace_id = 9;
  string ip_address = 10;
  map<string, string> details = 11;
  string created_at = 12;
  optional string actor_display_name = 13;
  optional string target_display_name = 14;
}

message ListAuditLogsResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated AdminAuditLog data = 4;
  int32 total = 5;
  int32 page = 6;
  int32 page_size = 7;
  string trace_id = 8;
}

enum DingTalkInvitationStatus {
  DING_TALK_INVITATION_STATUS_UNSPECIFIED = 0;
  DING_TALK_INVITATION_STATUS_PENDING = 1;
  DING_TALK_INVITATION_STATUS_CONSUMED = 2;
  DING_TALK_INVITATION_STATUS_EXPIRED = 3;
  DING_TALK_INVITATION_STATUS_REVOKED = 4;
}

enum DingTalkInvitationKind {
  DING_TALK_INVITATION_KIND_UNSPECIFIED = 0;
  DING_TALK_INVITATION_KIND_TARGETED = 1;
  DING_TALK_INVITATION_KIND_GENERIC = 2;
}

message CreateDingTalkInvitationRequest {
  // 目标组织；必须是调用者可写范围内的组织。
  string organization_id = 1 [(google.api.field_behavior) = REQUIRED];
  // 邀请类型：TARGETED（定向单人免审码）或 GENERIC（通用入职审批码）。缺省为 TARGETED。
  DingTalkInvitationKind kind = 2;
  // 国内手机号；TARGETED 必填，GENERIC 留空。
  optional string mobile = 3;
  // 激活后授予的初始角色（属于目标组织；通用码可选，留空则审批时指定）。
  optional string role_id = 4;
  // 备注姓名，仅供管理员识别，账号身份以钉钉返回为准。
  optional string display_name = 5;
  // 有效期（小时）；缺省 168（7 天），允许 1-720。
  optional int32 expires_in_hours = 6;
}

message CreateDingTalkInvitationResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  DingTalkInvitation data = 4;
  string invitation_url = 5;
  string trace_id = 6;
}

message ListDingTalkInvitationsRequest {
  int32 page = 1;
  int32 page_size = 2;
  // 按组织过滤；必须是调用者可写范围内的组织。
  optional string organization_id = 3;
  optional DingTalkInvitationStatus status = 4;
}

message ListDingTalkInvitationsResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated DingTalkInvitation data = 4;
  int32 total = 5;
  int32 page = 6;
  int32 page_size = 7;
  string trace_id = 8;
}

message GetDingTalkInvitationRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message GetDingTalkInvitationResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  DingTalkInvitation data = 4;
  string invitation_url = 5;
  string trace_id = 6;
}

message ListTransferOrganizationsRequest {}

message ListTransferOrganizationsResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated AdminOrganization data = 4;
  string trace_id = 5;
}

message RevokeDingTalkInvitationRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message RevokeDingTalkInvitationResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  string trace_id = 4;
}

// 手机号展示统一脱敏（138****1234），完整号码不离开服务端。
message DingTalkInvitation {
  string id = 1;
  string organization_id = 2;
  string organization_name = 3;
  optional string role_id = 4;
  optional string role_name = 5;
  optional string mobile_masked = 6;
  optional string display_name = 7;
  DingTalkInvitationStatus status = 8;
  optional string consumed_name = 9;
  string created_at = 10;
  string expires_at = 11;
  string inviter_name = 12;
  DingTalkInvitationKind kind = 13;
  string token = 14;
}

message TransferDingTalkRegistrationRequest {
  string user_id = 1 [(google.api.field_behavior) = REQUIRED];
  string target_organization_id = 2 [(google.api.field_behavior) = REQUIRED];
  string reason = 3 [(google.api.field_behavior) = REQUIRED];
}

message TransferDingTalkRegistrationResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  string trace_id = 4;
}

message ListDingTalkRegistrationsRequest {
  int32 page = 1;
  int32 page_size = 2;
}

// 待审批注册：钉钉姓名/头像来自扫码返回，供管理员人工认领。
message DingTalkRegistration {
  string user_id = 1;
  string display_name = 2;
  optional string avatar_url = 3;
  optional string requested_organization_id = 4;
  string requested_organization_name = 5;
  string registered_at = 6;
}

message ListDingTalkRegistrationsResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated DingTalkRegistration data = 4;
  int32 total = 5;
  int32 page = 6;
  int32 page_size = 7;
  string trace_id = 8;
}

message ApproveDingTalkRegistrationRequest {
  // 注册用户的 ID（待审批队列中的 user_id）。
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  // 同意时授予的初始角色，必须属于注册的目标组织。
  repeated string role_ids = 2 [(google.api.field_behavior) = REQUIRED];
}

message ApproveDingTalkRegistrationResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  DingTalkRegistration data = 4;
  string trace_id = 5;
}

message RejectDingTalkRegistrationRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  string reason = 2 [(google.api.field_behavior) = REQUIRED];
}

message RejectDingTalkRegistrationResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  string trace_id = 4;
}
