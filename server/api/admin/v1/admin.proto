syntax = "proto3";

package admin.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";

option go_package = "github.com/roncin/roncin-go-admin/server/api/admin/v1;v1";

service AdminService {
  rpc ListOrganizations(ListOrganizationsRequest) returns (OrganizationListReply) {
    option (google.api.http) = {get: "/api/v1/admin/organizations"};
  }

  rpc CreateOrganization(CreateOrganizationRequest) returns (OrganizationReply) {
    option (google.api.http) = {
      post: "/api/v1/admin/organizations"
      body: "*"
    };
  }

  rpc UpdateOrganization(UpdateOrganizationRequest) returns (OrganizationReply) {
    option (google.api.http) = {
      put: "/api/v1/admin/organizations/{id}"
      body: "*"
    };
  }

  rpc ListUsers(ListUsersRequest) returns (UserListReply) {
    option (google.api.http) = {get: "/api/v1/admin/users"};
  }

  rpc CreateUser(CreateUserRequest) returns (UserReply) {
    option (google.api.http) = {
      post: "/api/v1/admin/users"
      body: "*"
    };
  }

  rpc UpdateUser(UpdateUserRequest) returns (UserReply) {
    option (google.api.http) = {
      put: "/api/v1/admin/users/{id}"
      body: "*"
    };
  }

  rpc ListRoles(ListRolesRequest) returns (RoleListReply) {
    option (google.api.http) = {get: "/api/v1/admin/roles"};
  }

  rpc CreateRole(CreateRoleRequest) returns (RoleReply) {
    option (google.api.http) = {
      post: "/api/v1/admin/roles"
      body: "*"
    };
  }

  rpc UpdateRole(UpdateRoleRequest) returns (RoleReply) {
    option (google.api.http) = {
      put: "/api/v1/admin/roles/{id}"
      body: "*"
    };
  }

  rpc ListPermissions(ListPermissionsRequest) returns (PermissionListReply) {
    option (google.api.http) = {get: "/api/v1/admin/permissions"};
  }
}

enum DataScope {
  DATA_SCOPE_UNSPECIFIED = 0;
  DATA_SCOPE_ALL = 1;
  DATA_SCOPE_ORGANIZATION = 2;
  DATA_SCOPE_ORGANIZATION_TREE = 3;
  DATA_SCOPE_SELF = 4;
}

message ListOrganizationsRequest {}

message CreateOrganizationRequest {
  string code = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2 [(google.api.field_behavior) = REQUIRED];
}

message UpdateOrganizationRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  bool enabled = 3;
}

message Organization {
  string id = 1;
  string code = 2;
  string name = 3;
  optional string parent_id = 4;
  bool enabled = 5;
}

message OrganizationListReply {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated Organization data = 4;
  string trace_id = 5;
}

message OrganizationReply {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  Organization data = 4;
  string trace_id = 5;
}

message ListUsersRequest {
  int32 page = 1;
  int32 page_size = 2;
  string keyword = 3;
}

message CreateUserRequest {
  string username = 1 [(google.api.field_behavior) = REQUIRED];
  string display_name = 2 [(google.api.field_behavior) = REQUIRED];
  string password = 3 [(google.api.field_behavior) = REQUIRED];
  optional string email = 4;
  repeated string role_ids = 5;
}

message UpdateUserRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  string display_name = 2 [(google.api.field_behavior) = REQUIRED];
  optional string email = 3;
  bool enabled = 4;
  repeated string role_ids = 5;
}

message User {
  string id = 1;
  string username = 2;
  string display_name = 3;
  optional string email = 4;
  bool enabled = 5;
  repeated string role_ids = 6;
  repeated string role_codes = 7;
  string created_at = 8;
  string updated_at = 9;
}

message UserListReply {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated User data = 4;
  int32 total = 5;
  int32 page = 6;
  int32 page_size = 7;
  string trace_id = 8;
}

message UserReply {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  User data = 4;
  string trace_id = 5;
}

message ListRolesRequest {}

message CreateRoleRequest {
  string code = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  DataScope data_scope = 3 [(google.api.field_behavior) = REQUIRED];
  repeated string permission_keys = 4;
}

message UpdateRoleRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  DataScope data_scope = 3 [(google.api.field_behavior) = REQUIRED];
  bool enabled = 4;
  repeated string permission_keys = 5;
}

message Role {
  string id = 1;
  string organization_id = 2;
  string code = 3;
  string name = 4;
  DataScope data_scope = 5;
  bool enabled = 6;
  repeated string permission_keys = 7;
  string created_at = 8;
  string updated_at = 9;
}

message RoleListReply {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated Role data = 4;
  string trace_id = 5;
}

message RoleReply {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  Role data = 4;
  string trace_id = 5;
}

message ListPermissionsRequest {}

message Permission {
  string key = 1;
  string name = 2;
  string group = 3;
  string description = 4;
}

message PermissionListReply {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  repeated Permission data = 4;
  string trace_id = 5;
}
