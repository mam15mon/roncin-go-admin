syntax = "proto3";

package auth.v1;

import "access/v1/access.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";

option go_package = "github.com/roncin/roncin-go-admin/server/api/auth/v1;v1";

// AuthService owns the browser session boundary for the management console.
service AuthService {
  rpc Login(LoginRequest) returns (LoginResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PUBLIC};
    option (google.api.http) = {
      post: "/api/v1/auth/login"
      body: "*"
    };
  }

  rpc GetWeComLoginConfig(GetWeComLoginConfigRequest) returns (GetWeComLoginConfigResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PUBLIC};
    option (google.api.http) = {get: "/api/v1/auth/wecom/login-config"};
  }

  rpc WeComLogin(WeComLoginRequest) returns (WeComLoginResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PUBLIC};
    option (google.api.http) = {
      post: "/api/v1/auth/wecom/login"
      body: "*"
    };
  }

  rpc GetDingTalkLoginConfig(GetDingTalkLoginConfigRequest) returns (GetDingTalkLoginConfigResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PUBLIC};
    option (google.api.http) = {get: "/api/v1/auth/dingtalk/login-config"};
  }

  rpc DingTalkLogin(DingTalkLoginRequest) returns (DingTalkLoginResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PUBLIC};
    option (google.api.http) = {
      post: "/api/v1/auth/dingtalk/login"
      body: "*"
    };
  }

  rpc RegisterDingTalkUser(RegisterDingTalkUserRequest) returns (RegisterDingTalkUserResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PUBLIC};
    option (google.api.http) = {
      post: "/api/v1/auth/dingtalk/registrations"
      body: "*"
    };
  }

  rpc Logout(LogoutRequest) returns (LogoutResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_AUTHENTICATED};
    option (google.api.http) = {
      post: "/api/v1/auth/logout"
      body: "*"
    };
  }

  rpc Me(MeRequest) returns (MeResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_AUTHENTICATED};
    option (google.api.http) = {get: "/api/v1/auth/me"};
  }

  rpc SwitchOrganization(SwitchOrganizationRequest) returns (SwitchOrganizationResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_AUTHENTICATED};
    option (google.api.http) = {
      post: "/api/v1/auth/switch-organization"
      body: "*"
    };
  }
}

message LoginRequest {
  string username = 1 [(google.api.field_behavior) = REQUIRED];
  string password = 2 [(google.api.field_behavior) = REQUIRED];
}

message WeComLoginRequest {
  string code = 1 [(google.api.field_behavior) = REQUIRED];
  string state = 2 [(google.api.field_behavior) = REQUIRED];
}

message DingTalkLoginRequest {
  string auth_code = 1 [(google.api.field_behavior) = REQUIRED];
  string state = 2 [(google.api.field_behavior) = REQUIRED];
}

message RegisterDingTalkUserRequest {}

message GetWeComLoginConfigResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  WeComLoginConfig data = 4;
  string trace_id = 5;
}

message WeComLoginConfig {
  bool enabled = 1;
  optional string authorize_url = 2;
}

message GetDingTalkLoginConfigResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  DingTalkLoginConfig data = 4;
  string trace_id = 5;
}

message DingTalkLoginConfig {
  bool enabled = 1;
  optional string authorize_url = 2;
}

message SwitchOrganizationRequest {
  string organization_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message LoginResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  CurrentUser data = 4;
  string trace_id = 5;
}

message WeComLoginResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  CurrentUser data = 4;
  string trace_id = 5;
}

message DingTalkLoginResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  DingTalkLoginResult data = 4;
  string trace_id = 5;
}

enum DingTalkLoginStatus {
  DING_TALK_LOGIN_STATUS_UNSPECIFIED = 0;
  DING_TALK_LOGIN_STATUS_AUTHENTICATED = 1;
  DING_TALK_LOGIN_STATUS_REGISTRATION_REQUIRED = 2;
}

message DingTalkLoginResult {
  DingTalkLoginStatus status = 1;
  optional CurrentUser current_user = 2;
  optional string display_name = 3;
}

message RegisterDingTalkUserResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  DingTalkRegistration data = 4;
  string trace_id = 5;
}

message DingTalkRegistration {
  string display_name = 1;
  string status = 2;
}

message MeResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  CurrentUser data = 4;
  string trace_id = 5;
}

message SwitchOrganizationResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  CurrentUser data = 4;
  string trace_id = 5;
}

message LogoutResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  string trace_id = 4;
}

message CurrentUser {
  string id = 1;
  string username = 2;
  string display_name = 3;
  optional string email = 4;
  Organization current_organization = 5;
  repeated Organization organizations = 6;
  repeated string permissions = 7;
  repeated RoleScope role_scopes = 8;
  optional string avatar_url = 9;
}

message Organization {
  string id = 1;
  string code = 2;
  string name = 3;
  string base_currency = 4;
}

message RoleScope {
  string role_code = 1;
  string data_scope = 2;
}

message GetWeComLoginConfigRequest {}

message GetDingTalkLoginConfigRequest {}

message LogoutRequest {}

message MeRequest {}
