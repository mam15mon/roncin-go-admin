syntax = "proto3";

package auth.v1;

import "access/v1/access.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";

option go_package = "github.com/roncin/roncin-go-admin/server/api/auth/v1;v1";

// AuthService owns the browser session boundary for the management console.
service AuthService {
  rpc Login(LoginRequest) returns (LoginReply) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PUBLIC};
    option (google.api.http) = {
      post: "/api/v1/auth/login"
      body: "*"
    };
  }

  rpc GetWeComLoginConfig(google.protobuf.Empty) returns (WeComLoginConfigReply) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PUBLIC};
    option (google.api.http) = {get: "/api/v1/auth/wecom/login-config"};
  }

  rpc WeComLogin(WeComLoginRequest) returns (LoginReply) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PUBLIC};
    option (google.api.http) = {
      post: "/api/v1/auth/wecom/login"
      body: "*"
    };
  }

  rpc Logout(google.protobuf.Empty) returns (OperationReply) {
    option (access.v1.rule) = {mode: ACCESS_MODE_AUTHENTICATED};
    option (google.api.http) = {
      post: "/api/v1/auth/logout"
      body: "*"
    };
  }

  rpc Me(google.protobuf.Empty) returns (MeReply) {
    option (access.v1.rule) = {mode: ACCESS_MODE_AUTHENTICATED};
    option (google.api.http) = {get: "/api/v1/auth/me"};
  }

  rpc SwitchOrganization(SwitchOrganizationRequest) returns (MeReply) {
    option (access.v1.rule) = {mode: ACCESS_MODE_AUTHENTICATED};
    option (google.api.http) = {
      post: "/api/v1/auth/switch-organization"
      body: "*"
    };
  }
}

message LoginRequest {
  string username = 1 [(google.api.field_behavior) = REQUIRED];
  string password = 2 [(google.api.field_behavior) = REQUIRED];
}

message WeComLoginRequest {
  string code = 1 [(google.api.field_behavior) = REQUIRED];
  string state = 2 [(google.api.field_behavior) = REQUIRED];
}

message WeComLoginConfigReply {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  WeComLoginConfig data = 4;
  string trace_id = 5;
}

message WeComLoginConfig {
  bool enabled = 1;
  optional string authorize_url = 2;
}

message SwitchOrganizationRequest {
  string organization_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message LoginReply {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  CurrentUser data = 4;
  string trace_id = 5;
}

message MeReply {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  CurrentUser data = 4;
  string trace_id = 5;
}

message OperationReply {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  string trace_id = 4;
}

message CurrentUser {
  string id = 1;
  string username = 2;
  string display_name = 3;
  optional string email = 4;
  Organization current_organization = 5;
  repeated Organization organizations = 6;
  repeated string permissions = 7;
  repeated RoleScope role_scopes = 8;
}

message Organization {
  string id = 1;
  string code = 2;
  string name = 3;
}

message RoleScope {
  string role_code = 1;
  string data_scope = 2;
}
