syntax = "proto3";

package auth.v1;

import "access/v1/access.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";

option go_package = "github.com/roncin/roncin-go-admin/server/api/auth/v1;v1";

// AuthService owns the browser session boundary for the management console.
service AuthService {
  rpc Login(LoginRequest) returns (LoginResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PUBLIC};
    option (google.api.http) = {
      post: "/api/v1/auth/login"
      body: "*"
    };
  }

  rpc GetWeComLoginConfig(GetWeComLoginConfigRequest) returns (GetWeComLoginConfigResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PUBLIC};
    option (google.api.http) = {get: "/api/v1/auth/wecom/login-config"};
  }

  rpc WeComLogin(WeComLoginRequest) returns (WeComLoginResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PUBLIC};
    option (google.api.http) = {
      post: "/api/v1/auth/wecom/login"
      body: "*"
    };
  }

  rpc GetDingTalkLoginConfig(GetDingTalkLoginConfigRequest) returns (GetDingTalkLoginConfigResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PUBLIC};
    option (google.api.http) = {get: "/api/v1/auth/dingtalk/login-config"};
  }

  rpc DingTalkLogin(DingTalkLoginRequest) returns (DingTalkLoginResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PUBLIC};
    option (google.api.http) = {
      post: "/api/v1/auth/dingtalk/login"
      body: "*"
    };
  }

  rpc RegisterDingTalkUser(RegisterDingTalkUserRequest) returns (RegisterDingTalkUserResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PUBLIC};
    option (google.api.http) = {
      post: "/api/v1/auth/dingtalk/registrations"
      body: "*"
    };
  }

  // GetDingTalkInvitationInfo 扫码落地页查询专属邀请信息（未登录公开接口，响应最小化，受限流保护）。
  rpc GetDingTalkInvitationInfo(GetDingTalkInvitationInfoRequest) returns (GetDingTalkInvitationInfoResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PUBLIC};
    option (google.api.http) = {
      get: "/api/v1/auth/dingtalk/invitations/info"
    };
  }

  rpc Logout(LogoutRequest) returns (LogoutResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_AUTHENTICATED};
    option (google.api.http) = {
      post: "/api/v1/auth/logout"
      body: "*"
    };
  }

  rpc Me(MeRequest) returns (MeResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_AUTHENTICATED};
    option (google.api.http) = {get: "/api/v1/auth/me"};
  }

  rpc SwitchOrganization(SwitchOrganizationRequest) returns (SwitchOrganizationResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_AUTHENTICATED};
    option (google.api.http) = {
      post: "/api/v1/auth/switch-organization"
      body: "*"
    };
  }
}

message LoginRequest {
  string username = 1 [(google.api.field_behavior) = REQUIRED];
  string password = 2 [(google.api.field_behavior) = REQUIRED];
  // 可选：显式指定本次登录进入的成员资格组织；缺省使用默认组织。
  optional string organization_id = 3;
}

message WeComLoginRequest {
  string code = 1 [(google.api.field_behavior) = REQUIRED];
  string state = 2 [(google.api.field_behavior) = REQUIRED];
}

message DingTalkLoginRequest {
  string auth_code = 1 [(google.api.field_behavior) = REQUIRED];
  string state = 2 [(google.api.field_behavior) = REQUIRED];
}

message RegisterDingTalkUserRequest {
  // 可选：专属邀请 Token；若提供则由服务端解析目标组织，杜绝客户端伪造
  optional string invitation_token = 1;
  // 可选：自选要加入的目标公司（公开注册通道用；若有 invitation_token 则由服务端优先从 Token 兑现）
  optional string organization_id = 2;
}

message GetDingTalkInvitationInfoRequest {
  // 专属邀请 128-bit Token
  string token = 1 [(google.api.field_behavior) = REQUIRED];
}

message GetDingTalkInvitationInfoResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  DingTalkInvitationPublicInfo data = 4;
  string trace_id = 5;
}

// 落地页公共展示信息（极简安全模型：不返回 token 本身、不返回角色或权限配置、不返回手机号）。
message DingTalkInvitationPublicInfo {
  string organization_name = 1;
  string inviter_name = 2;
  string expires_at = 3;
}

message GetWeComLoginConfigResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  WeComLoginConfig data = 4;
  string trace_id = 5;
}

message WeComLoginConfig {
  bool enabled = 1;
  optional string authorize_url = 2;
}

message GetDingTalkLoginConfigResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  DingTalkLoginConfig data = 4;
  string trace_id = 5;
}

message DingTalkLoginConfig {
  bool enabled = 1;
  optional string authorize_url = 2;
}

message SwitchOrganizationRequest {
  string organization_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message LoginResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  CurrentUser data = 4;
  string trace_id = 5;
  // 本人启用中成员资格组织候选列表（默认组织置首并标记）。
  repeated OrganizationChoice organization_choices = 6;
}

message WeComLoginResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  CurrentUser data = 4;
  string trace_id = 5;
}

message DingTalkLoginResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  DingTalkLoginResult data = 4;
  string trace_id = 5;
}

enum DingTalkLoginStatus {
  DING_TALK_LOGIN_STATUS_UNSPECIFIED = 0;
  DING_TALK_LOGIN_STATUS_AUTHENTICATED = 1;
  DING_TALK_LOGIN_STATUS_REGISTRATION_REQUIRED = 2;
}

message DingTalkLoginResult {
  DingTalkLoginStatus status = 1;
  optional CurrentUser current_user = 2;
  optional string display_name = 3;
  // REGISTRATION_REQUIRED 时可选的目标公司列表（启用中的公司组织），供注册确认页选择。
  repeated OrganizationChoice registration_organizations = 4;
}

message RegisterDingTalkUserResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  DingTalkRegistrationConfirmation data = 4;
  string trace_id = 5;
}

message DingTalkRegistrationConfirmation {
  string display_name = 1;
  string status = 2;
}

message MeResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  CurrentUser data = 4;
  string trace_id = 5;
}

message SwitchOrganizationResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  CurrentUser data = 4;
  string trace_id = 5;
  // 与登录响应同构：切换后的成员资格组织候选列表。
  repeated OrganizationChoice organization_choices = 6;
}

// OrganizationChoice 是登录组织选择与切换器共用的候选组织视图。
message OrganizationChoice {
  string organization_id = 1 [(google.api.field_behavior) = REQUIRED];
  string organization_name = 2 [(google.api.field_behavior) = REQUIRED];
  string organization_code = 3 [(google.api.field_behavior) = REQUIRED];
  bool is_default = 4;
  // 组织节点类型，供前端推导主数据维护视角（系统管理/公司）。
  OrganizationKind kind = 5;
}

// OrganizationKind 组织节点类型，映射存储层 organizations.kind 四值；
// 不引入存储中不存在的其他取值。
enum OrganizationKind {
  ORGANIZATION_KIND_UNSPECIFIED = 0;
  ORGANIZATION_KIND_SYSTEM = 1;
  ORGANIZATION_KIND_COMPANY = 2;
  ORGANIZATION_KIND_DEPARTMENT = 3;
  ORGANIZATION_KIND_TEAM = 4;
}

message LogoutResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  string trace_id = 4;
}

message CurrentUser {
  string id = 1;
  string username = 2;
  string display_name = 3;
  optional string email = 4;
  Organization current_organization = 5;
  repeated Organization organizations = 6;
  repeated string permissions = 7;
  repeated RoleScope role_scopes = 8;
  optional string avatar_url = 9;
  // 按权限聚合的有效范围，前端授权使用此字段。
  repeated PermissionCapability permission_capabilities = 10;
}

message Organization {
  string id = 1;
  string code = 2;
  string name = 3;
  string base_currency = 4;
  // 组织节点类型，供前端推导主数据维护视角（系统管理/公司）。
  OrganizationKind kind = 5;
}

message PermissionCapability {
  string key = 1;
  string data_scope = 2;
}

message RoleScope {
  string role_code = 1;
  string data_scope = 2;
  // 角色显示名，按授权角色解析；合成授权无对应角色时为空。
  string role_name = 3;
}

message GetWeComLoginConfigRequest {}

message GetDingTalkLoginConfigRequest {}

message LogoutRequest {}

message MeRequest {}
