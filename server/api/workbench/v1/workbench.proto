syntax = "proto3";

package workbench.v1;

import "access/v1/access.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";

option go_package = "github.com/roncin/roncin-go-admin/server/api/workbench/v1;v1";

// WorkbenchService 提供登录员工「我的工作台」聚合读模型：全部接口只从会话取当前
// 用户与当前工作区组织，不接收 employee_id / organization_id 等可改写参数。
// 模块门禁由服务端按本人事实（方案员工分配、历史提成/调整、订单协作）与当前
// 组织权限判定；完整台账、审批、冲减与发放动作仍走原有业务接口。
service WorkbenchService {
  // GetWorkbenchOverview 返回模块门禁、本人提成状态汇总、近期订单、可靠作业
  // 待办计数与当前用户有权查看的财务/审批摘要。
  rpc GetWorkbenchOverview(GetWorkbenchOverviewRequest) returns (GetWorkbenchOverviewResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_AUTHENTICATED};
    option (google.api.http) = {get: "/api/v1/workbench/overview"};
  }
  // ListMyCommissions 返回本人提成单与调整明细，服务端分页并支持状态/归属日期过滤。
  rpc ListMyCommissions(ListMyCommissionsRequest) returns (ListMyCommissionsResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_AUTHENTICATED};
    option (google.api.http) = {get: "/api/v1/workbench/my-commissions"};
  }
  // ListMyReceivables 返回与本人提成归属相关的已确认应收未结项，服务端分页。
  rpc ListMyReceivables(ListMyReceivablesRequest) returns (ListMyReceivablesResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_AUTHENTICATED};
    option (google.api.http) = {get: "/api/v1/workbench/my-receivables"};
  }
  // ListMyRecentOrders 返回本人真实协作的近期海运出口订单，服务端分页。
  rpc ListMyRecentOrders(ListMyRecentOrdersRequest) returns (ListMyRecentOrdersResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_AUTHENTICATED};
    option (google.api.http) = {get: "/api/v1/workbench/my-recent-orders"};
  }
}

message GetWorkbenchOverviewRequest {}

// WorkbenchCommissionStatus 与财务提成/调整单状态语义对齐；工作台只做分桶展示。
enum WorkbenchCommissionStatus {
  WORKBENCH_COMMISSION_STATUS_UNSPECIFIED = 0;
  WORKBENCH_COMMISSION_STATUS_DRAFT = 1;
  WORKBENCH_COMMISSION_STATUS_CONFIRMED = 2;
  WORKBENCH_COMMISSION_STATUS_PAID = 3;
  WORKBENCH_COMMISSION_STATUS_CANCELLED = 4;
}

// GetWorkbenchOverviewResponse 中 has_commission_eligibility 为 optional bool 且
// 服务端始终赋值：门禁为假时 commission_summary 保持缺省，前端从首次渲染起就
// 不出现提成模块（不渲染标题、骨架、入口或零金额卡片）。
message GetWorkbenchOverviewResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  string trace_id = 4;
  GetWorkbenchOverviewData data = 5;
}

message GetWorkbenchOverviewData {
  optional bool has_commission_eligibility = 1 [(google.api.field_behavior) = REQUIRED];
  // next_effective_date 是本人最近的未来实际生效日（YYYY-MM-DD）：存在当前/未来
  // 有效方案分配且尚未到生效日时返回，供页面说明「方案尚未生效」，不把未生效
  // 解释为零金额。
  optional string next_effective_date = 2;
  // base_currency 是当前工作区组织本位币；summary 中全部金额均为该本位币口径。
  string base_currency = 3;
  WorkbenchCommissionSummary commission_summary = 4;
  repeated WorkbenchRecentOrder recent_orders = 5;
  WorkbenchTodoSummary todos = 6;
  WorkbenchFinanceSummary finance = 7;
}

// WorkbenchCommissionSummary 提成卡严格分桶：
// DRAFT=待财务确认；CONFIRMED=已确认待发；PAID=已发放；CANCELLED 不计入有效金额。
// 冲减三阶段：DRAFT=待处理、尚未扣回；CONFIRMED=已确认、尚未实际扣回；PAID=已扣回。
// 预计机会不属于任何已确认/已发金额，仅表示尚未生成的可靠估算。
message WorkbenchCommissionSummary {
  string base_currency = 1;
  int32 draft_count = 2;
  string draft_amount = 3;
  int32 confirmed_count = 4;
  string confirmed_amount = 5;
  int32 paid_count = 6;
  string paid_amount = 7;
  string paid_amount_this_year = 8;
  string paid_amount_this_month = 9;
  int32 decrease_draft_count = 10;
  string decrease_draft_amount = 11;
  int32 decrease_confirmed_count = 12;
  string decrease_confirmed_amount = 13;
  int32 decrease_paid_count = 14;
  string decrease_paid_amount = 15;
  WorkbenchEstimatedOpportunity estimated = 16;
}

// WorkbenchEstimatedOpportunity 是「预计可计提」摘要：本人已有可计算的有效应收
// 核销/对冲来源，且来源归属日期能唯一匹配本人对应身份的有效方案与员工分配，
// 但尚无对应有效基础提成单。estimated_amount 为按现有提成口径的估算值，
// 不得并入已确认或已发金额；has_more 为真时表示候选超出服务端有界扫描上限，
// 金额仅为不完整下界，页面应提示而非当作精确合计。
message WorkbenchEstimatedOpportunity {
  int32 opportunity_count = 1;
  string estimated_amount = 2;
  bool has_more = 3;
}

message WorkbenchRecentOrder {
  string order_id = 1;
  string order_no = 2;
  string business_type = 3;
  string customer_name = 4;
  string flow_status = 5;
  string termination_status = 6;
  string order_date = 7;
  string created_at = 8;
}

// WorkbenchTodoSummary 只聚合能由现有事实准确判定的作业待办，不虚构未建模的
// 责任与时限。
message WorkbenchTodoSummary {
  int32 draft_fee_count = 1;
  int32 open_abnormal_count = 2;
}

// WorkbenchFinanceSummary 按当前用户对当前工作区组织的实际权限出现：无
// commission.read 时整体缺省；can_manage_commission 仅表示具备处理入口能力，
// 实际动作仍调用原端点并重新鉴权。
message WorkbenchFinanceSummary {
  bool can_read_commission = 1;
  bool can_manage_commission = 2;
  // confirmed_commission_count 是当前组织已确认待发提成数量（组织范围）。
  int32 confirmed_commission_count = 3;
  // pending_decrease_count 是当前组织 LOCKED_FEE_SUPPLEMENT + DECREASE + DRAFT
  // 冲减建议数量（待处理、尚未扣回）。
  int32 pending_decrease_count = 4;
  int32 pending_supplement_approval_count = 5;
  repeated WorkbenchSupplementApprovalItem pending_supplement_approvals = 6;
  // supplement_approvals_truncated 为真时表示 PENDING 候选超出服务端有界扫描
  // 上限，计数仅为已扫描部分的下界。
  bool supplement_approvals_truncated = 7;
}

message WorkbenchSupplementApprovalItem {
  string request_id = 1;
  string order_id = 2;
  string order_no = 3;
  string fee_code = 4;
  string fee_name = 5;
  string currency = 6;
  string amount = 7;
  string reason = 8;
  string requested_by_name = 9;
  string requested_at = 10;
}

message ListMyCommissionsRequest {
  int32 page = 1;
  int32 page_size = 2;
  optional WorkbenchCommissionStatus status = 3;
  optional string commission_date_from = 4;
  optional string commission_date_to = 5;
}

message ListMyCommissionsResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  string trace_id = 4;
  int64 total = 5;
  int32 page = 6;
  int32 page_size = 7;
  repeated WorkbenchMyCommission data = 8;
}

message WorkbenchMyCommission {
  string id = 1;
  string commission_no = 2;
  WorkbenchCommissionStatus status = 3;
  string personnel_role = 4;
  optional string rule_name = 5;
  optional string calculation_basis = 6;
  string base_currency = 7;
  string commission_amount = 8;
  string commission_date = 9;
  optional string verification_no = 10;
  optional string netting_no = 11;
  string created_at = 12;
  repeated WorkbenchMyCommissionAdjustment adjustments = 13;
}

message WorkbenchMyCommissionAdjustment {
  string id = 1;
  string adjustment_no = 2;
  string direction = 3;
  WorkbenchCommissionStatus status = 4;
  string amount = 5;
  string reason = 6;
  string created_at = 7;
}

message ListMyReceivablesRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message ListMyReceivablesResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  string trace_id = 4;
  int64 total = 5;
  int32 page = 6;
  int32 page_size = 7;
  repeated WorkbenchMyReceivable data = 8;
}

// WorkbenchMyReceivable 是单张已确认应收账单的未结投影：金额全部为账单原币，
// 不同币种不合计；未结余额口径与账单台账一致（总额 - 有效核销 - 有效对冲）。
message WorkbenchMyReceivable {
  string bill_id = 1;
  string bill_no = 2;
  string settlement_party_name = 3;
  string currency = 4;
  string total_amount = 5;
  string unverified_amount = 6;
  optional string bill_date = 7;
  optional string due_date = 8;
  int32 overdue_days = 9;
  string confirmed_at = 10;
}

message ListMyRecentOrdersRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message ListMyRecentOrdersResponse {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  string trace_id = 4;
  int64 total = 5;
  int32 page = 6;
  int32 page_size = 7;
  repeated WorkbenchRecentOrder data = 8;
}
