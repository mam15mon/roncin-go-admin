syntax = "proto3";

package enterprise_resource.v1;

import "access/v1/access.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";

option go_package = "github.com/roncin/roncin-go-admin/server/api/enterprise_resource/v1;v1";

service EnterpriseResourceService {
  rpc SearchEnterpriseResourcePartnerOptions(SearchEnterpriseResourcePartnerOptionsRequest) returns (SearchEnterpriseResourcePartnerOptionsResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "business.enterprise_resource.read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/enterprise-resource-options/partners"};
  }
  rpc SearchEnterpriseResourceAssigneeOptions(SearchEnterpriseResourceAssigneeOptionsRequest) returns (SearchEnterpriseResourceAssigneeOptionsResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "business.enterprise_resource.read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/enterprise-resource-options/assignees"};
  }
  rpc ListEnterpriseResourceRegionOptions(ListEnterpriseResourceRegionOptionsRequest) returns (ListEnterpriseResourceRegionOptionsResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "business.enterprise_resource.read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/enterprise-resource-options/regions"};
  }
  rpc GetEnterpriseResourceCapabilities(GetEnterpriseResourceCapabilitiesRequest) returns (GetEnterpriseResourceCapabilitiesResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "business.enterprise_resource.read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/enterprise-resource-capabilities"};
  }
  rpc PrepareEnterpriseResourceImageUpload(PrepareEnterpriseResourceImageUploadRequest) returns (PrepareEnterpriseResourceImageUploadResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "business.enterprise_resource.create" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {post: "/api/v1/enterprise-resource-image-uploads" body: "*"};
  }
  rpc GetEnterpriseResourceImageAccess(GetEnterpriseResourceImageAccessRequest) returns (GetEnterpriseResourceImageAccessResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "business.enterprise_resource.read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/enterprise-resources/{id}/image-access"};
  }
  rpc ListEnterpriseResources(ListEnterpriseResourcesRequest) returns (ListEnterpriseResourcesResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "business.enterprise_resource.read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/enterprise-resources"};
  }
  rpc GetEnterpriseResource(GetEnterpriseResourceRequest) returns (GetEnterpriseResourceResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "business.enterprise_resource.read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/enterprise-resources/{id}"};
  }
  rpc CreateEnterpriseResource(CreateEnterpriseResourceRequest) returns (CreateEnterpriseResourceResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "business.enterprise_resource.create" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {post: "/api/v1/enterprise-resources" body: "*"};
  }
  rpc UpdateEnterpriseResource(UpdateEnterpriseResourceRequest) returns (UpdateEnterpriseResourceResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "business.enterprise_resource.update" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {put: "/api/v1/enterprise-resources/{id}" body: "*"};
  }
  rpc DeleteEnterpriseResource(DeleteEnterpriseResourceRequest) returns (DeleteEnterpriseResourceResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "business.enterprise_resource.delete" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {delete: "/api/v1/enterprise-resources/{id}"};
  }
  rpc BatchCreateAssociations(BatchCreateAssociationsRequest) returns (BatchCreateAssociationsResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "business.enterprise_resource.update" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {post: "/api/v1/enterprise-resource-associations/batch-create" body: "*"};
  }
  rpc BatchDeleteAssociations(BatchDeleteAssociationsRequest) returns (BatchDeleteAssociationsResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "business.enterprise_resource.update" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {post: "/api/v1/enterprise-resource-associations/batch-delete" body: "*"};
  }
  rpc BatchAssignAddressTypes(BatchAssignAddressTypesRequest) returns (BatchAssignAddressTypesResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "business.enterprise_resource.update" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {post: "/api/v1/enterprise-resource-address-types/batch-assign" body: "*"};
  }
  rpc BatchRemoveAddressTypes(BatchRemoveAddressTypesRequest) returns (BatchRemoveAddressTypesResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "business.enterprise_resource.update" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {post: "/api/v1/enterprise-resource-address-types/batch-remove" body: "*"};
  }
  rpc BatchAssignAssignees(BatchAssignAssigneesRequest) returns (BatchAssignAssigneesResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "business.enterprise_resource.update" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {post: "/api/v1/enterprise-resource-assignees/batch-assign" body: "*"};
  }
  rpc BatchRemoveAssignees(BatchRemoveAssigneesRequest) returns (BatchRemoveAssigneesResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "business.enterprise_resource.update" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {post: "/api/v1/enterprise-resource-assignees/batch-remove" body: "*"};
  }
  rpc ListEnterpriseTagGroups(ListEnterpriseTagGroupsRequest) returns (ListEnterpriseTagGroupsResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "business.enterprise_resource.read" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {get: "/api/v1/enterprise-tag-groups"};
  }
  rpc CreateEnterpriseTagGroup(CreateEnterpriseTagGroupRequest) returns (CreateEnterpriseTagGroupResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "business.enterprise_resource.create" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {post: "/api/v1/enterprise-tag-groups" body: "*"};
  }
  rpc UpdateEnterpriseTagGroup(UpdateEnterpriseTagGroupRequest) returns (UpdateEnterpriseTagGroupResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "business.enterprise_resource.update" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {put: "/api/v1/enterprise-tag-groups/{id}" body: "*"};
  }
  rpc DeleteEnterpriseTagGroup(DeleteEnterpriseTagGroupRequest) returns (DeleteEnterpriseTagGroupResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "business.enterprise_resource.delete" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {delete: "/api/v1/enterprise-tag-groups/{id}"};
  }
  rpc PreviewEnterpriseResourceImport(PreviewEnterpriseResourceImportRequest) returns (PreviewEnterpriseResourceImportResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "business.enterprise_resource.create" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {post: "/api/v1/enterprise-resources/import-preview" body: "*"};
  }
  rpc CommitEnterpriseResourceImport(CommitEnterpriseResourceImportRequest) returns (CommitEnterpriseResourceImportResponse) {
    option (access.v1.rule) = {mode: ACCESS_MODE_PERMISSION permission: "business.enterprise_resource.create" scope: DATA_SCOPE_ORGANIZATION};
    option (google.api.http) = {post: "/api/v1/enterprise-resources/import-commit" body: "*"};
  }
}

enum EnterpriseResourceType {
  ENTERPRISE_RESOURCE_TYPE_UNSPECIFIED = 0;
  ENTERPRISE_RESOURCE_TYPE_ADDRESS = 1;
  ENTERPRISE_RESOURCE_TYPE_REMARK = 2;
  ENTERPRISE_RESOURCE_TYPE_IMAGE = 3;
  ENTERPRISE_RESOURCE_TYPE_TAG = 4;
  ENTERPRISE_RESOURCE_TYPE_SHIPPER = 5;
  ENTERPRISE_RESOURCE_TYPE_CONSIGNEE = 6;
  ENTERPRISE_RESOURCE_TYPE_NOTIFY_PARTY = 7;
  ENTERPRISE_RESOURCE_TYPE_ENGLISH_CARGO_NAME = 8;
  ENTERPRISE_RESOURCE_TYPE_HS_CODE = 9;
  ENTERPRISE_RESOURCE_TYPE_MARKS = 10;
}

enum EnterpriseRemarkType {
  ENTERPRISE_REMARK_TYPE_UNSPECIFIED = 0;
  ENTERPRISE_REMARK_TYPE_BOOKING = 1;
  ENTERPRISE_REMARK_TYPE_ALLOCATION = 2;
  ENTERPRISE_REMARK_TYPE_TRANSPORT = 3;
  ENTERPRISE_REMARK_TYPE_ORDER = 4;
  ENTERPRISE_REMARK_TYPE_BILL_OF_LADING = 5;
  ENTERPRISE_REMARK_TYPE_CUSTOMER = 6;
  ENTERPRISE_REMARK_TYPE_SUPPLIER = 7;
  ENTERPRISE_REMARK_TYPE_FOREIGN_AGENT = 8;
  ENTERPRISE_REMARK_TYPE_QUOTATION = 9;
  ENTERPRISE_REMARK_TYPE_MANIFEST = 10;
  ENTERPRISE_REMARK_TYPE_PACKING_LIST = 11;
  ENTERPRISE_REMARK_TYPE_OPERATION = 12;
  ENTERPRISE_REMARK_TYPE_COMMISSION = 13;
  ENTERPRISE_REMARK_TYPE_WAREHOUSE = 14;
}

enum EnterpriseAddressType {
  ENTERPRISE_ADDRESS_TYPE_UNSPECIFIED = 0;
  ENTERPRISE_ADDRESS_TYPE_CONTAINER_OPERATION = 1;
  ENTERPRISE_ADDRESS_TYPE_PICKUP = 2;
  ENTERPRISE_ADDRESS_TYPE_DELIVERY = 3;
}

message EnterpriseResourcePartnerOption { string id = 1; string code = 2; string name = 3; }
message EnterpriseResourceAssigneeOption { string id = 1; string username = 2; string display_name = 3; }
message EnterpriseResourceRegionOption { string code = 1; string name = 2; int32 level = 3; string parent_code = 4; }
message SearchEnterpriseResourcePartnerOptionsRequest { string keyword = 1; int32 page = 2; int32 page_size = 3; }
message SearchEnterpriseResourcePartnerOptionsResponse { bool success = 1; int32 code = 2; string message = 3; repeated EnterpriseResourcePartnerOption data = 4; int64 total = 5; int32 page = 6; int32 page_size = 7; string trace_id = 8; }
message SearchEnterpriseResourceAssigneeOptionsRequest { string keyword = 1; int32 page = 2; int32 page_size = 3; }
message SearchEnterpriseResourceAssigneeOptionsResponse { bool success = 1; int32 code = 2; string message = 3; repeated EnterpriseResourceAssigneeOption data = 4; int64 total = 5; int32 page = 6; int32 page_size = 7; string trace_id = 8; }
message ListEnterpriseResourceRegionOptionsRequest { int32 level = 1 [(google.api.field_behavior) = REQUIRED]; optional string parent_code = 2; int32 page = 3; int32 page_size = 4; }
message ListEnterpriseResourceRegionOptionsResponse { bool success = 1; int32 code = 2; string message = 3; repeated EnterpriseResourceRegionOption data = 4; int64 total = 5; int32 page = 6; int32 page_size = 7; string trace_id = 8; }

message EnterpriseResourceAddress {
  string contact_name = 1;
  string contact_phone = 2;
  string country_code = 3;
  string province_code = 4;
  string city_code = 5;
  string district_code = 6;
  string address_detail = 7;
  string remark = 8;
}

message EnterpriseResourceRemark { EnterpriseRemarkType remark_type = 1; string content = 2; }

message EnterpriseResourceParty {
  string company_name = 1;
  string business_code = 2;
  string address = 3;
  string country_code = 4;
  string contact_name = 5;
  string contact_phone = 6;
  string email = 7;
  string tax_identifier = 8;
  string aeo_code = 9;
  bool custom_display = 10;
  string display_content = 11;
  string remark = 12;
}

message EnterpriseResourceImage {
  string file_name = 1;
  string mime_type = 2;
  int64 file_size = 3;
  string object_key = 4;
  string checksum = 5;
  optional int32 width = 6;
  optional int32 height = 7;
}

message GetEnterpriseResourceCapabilitiesRequest {}
message GetEnterpriseResourceCapabilitiesResponse { bool success = 1; int32 code = 2; string message = 3; bool image_enabled = 4; int64 image_max_file_size = 5; int64 image_used_storage_bytes = 6; int64 image_storage_quota_bytes = 7; string trace_id = 8; }
message PrepareEnterpriseResourceImageUploadRequest { string file_name = 1 [(google.api.field_behavior) = REQUIRED]; string mime_type = 2 [(google.api.field_behavior) = REQUIRED]; int64 file_size = 3 [(google.api.field_behavior) = REQUIRED]; string checksum = 4 [(google.api.field_behavior) = REQUIRED]; }
message PrepareEnterpriseResourceImageUploadResponse { bool success = 1; int32 code = 2; string message = 3; string upload_url = 4; string object_key = 5; map<string, string> headers = 6; string expires_at = 7; string trace_id = 8; }
message GetEnterpriseResourceImageAccessRequest { string id = 1 [(google.api.field_behavior) = REQUIRED]; }
message GetEnterpriseResourceImageAccessResponse { bool success = 1; int32 code = 2; string message = 3; string url = 4; string expires_at = 5; string trace_id = 6; }

message EnterpriseResourceTag { string group_id = 1; }

message EnterpriseResource {
  string id = 1;
  EnterpriseResourceType resource_type = 2;
  string short_name = 3;
  bool enabled = 4;
  int32 sort_order = 5;
  repeated string partner_ids = 6;
  repeated EnterpriseAddressType address_types = 7;
  repeated string assignee_ids = 8;
  oneof detail {
    EnterpriseResourceAddress address = 9;
    EnterpriseResourceRemark remark = 10;
    EnterpriseResourceParty party = 11;
    EnterpriseResourceImage image = 12;
    EnterpriseResourceTag tag = 13;
  }
  string created_by = 14;
  string updated_by = 15;
  string created_at = 16;
  string updated_at = 17;
}

message EnterpriseResourceInput {
  EnterpriseResourceType resource_type = 1 [(google.api.field_behavior) = REQUIRED];
  string short_name = 2 [(google.api.field_behavior) = REQUIRED];
  bool enabled = 3;
  int32 sort_order = 4;
  optional PartnerAssociations partner_associations = 5;
  repeated EnterpriseAddressType address_types = 6;
  repeated string assignee_ids = 7;
  oneof detail {
    EnterpriseResourceAddress address = 8;
    EnterpriseResourceRemark remark = 9;
    EnterpriseResourceParty party = 10;
    EnterpriseResourceImage image = 11;
    EnterpriseResourceTag tag = 12;
  }
}

message PartnerAssociations { repeated string partner_ids = 1; }
message ListEnterpriseResourcesRequest {
  EnterpriseResourceType resource_type = 1 [(google.api.field_behavior) = REQUIRED];
  optional string partner_id = 2;
  optional bool linked = 3;
  optional bool enabled = 4;
  string keyword = 5;
  int32 page = 6;
  int32 page_size = 7;
  optional EnterpriseAddressType address_type = 8;
  optional string assignee_id = 9;
  string sort_by = 10;
  string sort_order = 11;
}
message GetEnterpriseResourceRequest { string id = 1 [(google.api.field_behavior) = REQUIRED]; }
message CreateEnterpriseResourceRequest { EnterpriseResourceInput resource = 1 [(google.api.field_behavior) = REQUIRED]; }
message UpdateEnterpriseResourceRequest { string id = 1 [(google.api.field_behavior) = REQUIRED]; EnterpriseResourceInput resource = 2 [(google.api.field_behavior) = REQUIRED]; }
message DeleteEnterpriseResourceRequest { string id = 1 [(google.api.field_behavior) = REQUIRED]; }
message GetEnterpriseResourceResponse { bool success = 1; int32 code = 2; string message = 3; EnterpriseResource data = 4; string trace_id = 5; }
message CreateEnterpriseResourceResponse { bool success = 1; int32 code = 2; string message = 3; EnterpriseResource data = 4; string trace_id = 5; }
message UpdateEnterpriseResourceResponse { bool success = 1; int32 code = 2; string message = 3; EnterpriseResource data = 4; string trace_id = 5; }
message ListEnterpriseResourcesResponse { bool success = 1; int32 code = 2; string message = 3; repeated EnterpriseResource data = 4; int64 total = 5; int32 page = 6; int32 page_size = 7; string trace_id = 8; }
message DeleteEnterpriseResourceResponse { bool success = 1; int32 code = 2; string message = 3; string trace_id = 4; }
message BatchCreateAssociationsRequest { repeated string resource_ids = 1 [(google.api.field_behavior) = REQUIRED]; repeated string partner_ids = 2 [(google.api.field_behavior) = REQUIRED]; }
message BatchCreateAssociationsResponse { bool success = 1; int32 code = 2; string message = 3; int32 affected_count = 4; string trace_id = 5; }
message BatchDeleteAssociationsRequest { repeated string resource_ids = 1 [(google.api.field_behavior) = REQUIRED]; repeated string partner_ids = 2 [(google.api.field_behavior) = REQUIRED]; }
message BatchDeleteAssociationsResponse { bool success = 1; int32 code = 2; string message = 3; int32 affected_count = 4; string trace_id = 5; }
message BatchAssignAddressTypesRequest { repeated string resource_ids = 1 [(google.api.field_behavior) = REQUIRED]; repeated EnterpriseAddressType address_types = 2 [(google.api.field_behavior) = REQUIRED]; }
message BatchAssignAddressTypesResponse { bool success = 1; int32 code = 2; string message = 3; int32 affected_count = 4; string trace_id = 5; }
message BatchRemoveAddressTypesRequest { repeated string resource_ids = 1 [(google.api.field_behavior) = REQUIRED]; repeated EnterpriseAddressType address_types = 2 [(google.api.field_behavior) = REQUIRED]; }
message BatchRemoveAddressTypesResponse { bool success = 1; int32 code = 2; string message = 3; int32 affected_count = 4; string trace_id = 5; }
message BatchAssignAssigneesRequest { repeated string resource_ids = 1 [(google.api.field_behavior) = REQUIRED]; repeated string assignee_ids = 2 [(google.api.field_behavior) = REQUIRED]; }
message BatchAssignAssigneesResponse { bool success = 1; int32 code = 2; string message = 3; int32 affected_count = 4; string trace_id = 5; }
message BatchRemoveAssigneesRequest { repeated string resource_ids = 1 [(google.api.field_behavior) = REQUIRED]; repeated string assignee_ids = 2 [(google.api.field_behavior) = REQUIRED]; }
message BatchRemoveAssigneesResponse { bool success = 1; int32 code = 2; string message = 3; int32 affected_count = 4; string trace_id = 5; }

message EnterpriseTagGroup { string id = 1; string name = 2; string color = 3; int32 sort_order = 4; string created_at = 5; string updated_at = 6; }
message EnterpriseTagGroupInput { string name = 1 [(google.api.field_behavior) = REQUIRED]; string color = 2; int32 sort_order = 3; }
message ListEnterpriseTagGroupsRequest {}
message ListEnterpriseTagGroupsResponse { bool success = 1; int32 code = 2; string message = 3; repeated EnterpriseTagGroup data = 4; string trace_id = 5; }
message CreateEnterpriseTagGroupRequest { EnterpriseTagGroupInput group = 1 [(google.api.field_behavior) = REQUIRED]; }
message UpdateEnterpriseTagGroupRequest { string id = 1 [(google.api.field_behavior) = REQUIRED]; EnterpriseTagGroupInput group = 2 [(google.api.field_behavior) = REQUIRED]; }
message DeleteEnterpriseTagGroupRequest { string id = 1 [(google.api.field_behavior) = REQUIRED]; }
message CreateEnterpriseTagGroupResponse { bool success = 1; int32 code = 2; string message = 3; EnterpriseTagGroup data = 4; string trace_id = 5; }
message UpdateEnterpriseTagGroupResponse { bool success = 1; int32 code = 2; string message = 3; EnterpriseTagGroup data = 4; string trace_id = 5; }
message DeleteEnterpriseTagGroupResponse { bool success = 1; int32 code = 2; string message = 3; string trace_id = 4; }

message EnterpriseResourceImportConflict { string existing_resource_id = 1; string existing_short_name = 2; repeated string matched_fields = 3; }
message EnterpriseResourceImportRow { int32 row_number = 1; EnterpriseResourceInput resource = 2; repeated string errors = 3; repeated EnterpriseResourceImportConflict conflicts = 4; }
message PreviewEnterpriseResourceImportRequest { EnterpriseResourceType resource_type = 1 [(google.api.field_behavior) = REQUIRED]; repeated EnterpriseResourceInput rows = 2 [(google.api.field_behavior) = REQUIRED]; }
message CommitEnterpriseResourceImportRequest { EnterpriseResourceType resource_type = 1 [(google.api.field_behavior) = REQUIRED]; repeated EnterpriseResourceInput rows = 2 [(google.api.field_behavior) = REQUIRED]; bool overwrite_conflicts = 3; }
message PreviewEnterpriseResourceImportResponse { bool success = 1; int32 code = 2; string message = 3; repeated EnterpriseResourceImportRow rows = 4; int32 valid_count = 5; int32 invalid_count = 6; int32 created_count = 7; string trace_id = 8; int32 conflict_count = 9; bool overwrite_allowed = 10; }
message CommitEnterpriseResourceImportResponse { bool success = 1; int32 code = 2; string message = 3; repeated EnterpriseResourceImportRow rows = 4; int32 valid_count = 5; int32 invalid_count = 6; int32 created_count = 7; string trace_id = 8; int32 conflict_count = 9; int32 updated_count = 10; }
