syntax = "proto3";

package conf.v1;

import "google/protobuf/duration.proto";

option go_package = "github.com/roncin/roncin-go-admin/server/internal/conf;conf";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  Security security = 3;
  Telemetry telemetry = 4;
}

message Telemetry {
  // Export traces through OTLP when enabled. Disabled means no exporter is
  // created and the Kratos tracing middleware remains a no-op.
  bool enabled = 1;
  // OTLP gRPC endpoint in host:port form.
  string endpoint = 2;
  bool insecure = 3;
  // Must be between 0 and 1 when telemetry is enabled.
  double sample_ratio = 4;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
}

message Data {
  message Database {
    // The platform database dialect. Roncin requires "postgres".
    string driver = 1;
    // Driver-specific DSN. Keep credentials out of version control.
    string source = 2;
    // Log every generated statement. Development only.
    bool debug = 3;
    // Create or update tables from the ent schema on startup. Leave false in
    // production and apply migrations as a separate, reviewed step.
    bool auto_migrate = 4;
    int32 max_open_connections = 5;
    int32 max_idle_connections = 6;
    google.protobuf.Duration connection_max_lifetime = 7;
  }
  message Redis {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration read_timeout = 3;
    google.protobuf.Duration write_timeout = 4;
  }
  message ObjectStorage {
    bool enabled = 1;
    string endpoint = 2;
    string region = 3;
    string bucket = 4;
    string access_key = 5;
    string secret_key = 6;
    bool path_style = 7;
  }
  Database database = 1;
  Redis redis = 2;
  ObjectStorage object_storage = 3;
}

message Security {
  message Session {
    string cookie_name = 1;
    google.protobuf.Duration ttl = 2;
    bool secure = 3;
    string same_site = 4;
  }
  message WeCom {
    bool enabled = 1;
    string corp_id = 2;
    int64 agent_id = 3;
    string secret = 4;
    string redirect_uri = 5;
  }
  message DingTalk {
    bool enabled = 1;
    string client_id = 2;
    string client_secret = 3;
    string redirect_uri = 4;
    string corp_id = 5;
    string registration_token_secret = 6;
  }
  Session session = 1;
  WeCom wecom = 2;
  DingTalk dingtalk = 3;
}
