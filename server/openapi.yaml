                    type: string
                arRate:
                    type: string
                    description: ar_rate 为应收汇率（现汇卖出价）。
                apRate:
                    type: string
                    description: ap_rate 为应付汇率（现汇买入价）。
                rate:
                    type: string
                    description: rate 为基准汇率（中行折算价口径），可空。
                effectiveFrom:
                    type: string
                effectiveTo:
                    type: string
                status:
                    type: string
                errors:
                    type: array
                    items:
                        type: string
        finance.v1.ExchangeRateSetting:
            type: object
            properties:
                id:
                    type: string
                organizationId:
                    type: string
                fromCurrency:
                    type: string
                toCurrency:
                    type: string
                effectiveFrom:
                    type: string
                    description: effective_from 为带时区且精确到秒的 RFC 3339 时间（自然周周一 00:00:00，Asia/Shanghai），区间左边界包含该时刻。
                effectiveTo:
                    type: string
                    description: effective_to 为带时区且精确到秒的 RFC 3339 时间（同一自然周周日 23:59:59，Asia/Shanghai），区间右边界包含该时刻。
                arRate:
                    type: string
                    description: ar_rate 为应收汇率（现汇卖出价）：客户账单（AR）外币折本币收款使用。
                apRate:
                    type: string
                    description: ap_rate 为应付汇率（现汇买入价）：供应商账单（AP）外币折本币付款使用。
                isActive:
                    type: boolean
                createdAt:
                    type: string
                updatedAt:
                    type: string
                rate:
                    type: string
                    description: rate 为基准汇率（中行折算价口径），用于内部综合审计与报表基准。
        finance.v1.ExchangeRateSyncPreview:
            type: object
            properties:
                target:
                    type: integer
                    format: enum
                baseCurrency:
                    type: string
                    description: base_currency 为当前组织本币（同步行的 to_currency）。
                effectiveFrom:
                    type: string
                effectiveTo:
                    type: string
                source:
                    type: string
                    description: source 为数据来源明示（如「中国银行官方牌价」「新浪财经中行专线」「国际直盘行情」）。
                fallbackUsed:
                    type: boolean
                    description: fallback_used 表示主源失败后启用了备选源（非静默兜底，前端需展示）。
                rows:
                    type: array
                    items:
                        $ref: '#/components/schemas/finance.v1.ExchangeRateSyncPreviewRow'
        finance.v1.ExchangeRateSyncPreviewRow:
            type: object
            properties:
                fromCurrency:
                    type: string
                arRate:
                    type: string
