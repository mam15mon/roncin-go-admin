            tags:
                - OrderFeeService
            description: |-
                CreateOrderFeeSupplement 在业务锁或提成净额财务锁成立期间发起锁后应付费用补录申请。
                 锁类型、锁代次与财务锁证据均由服务端在 Order 行锁内判定固化；双锁均不存在时
                 稳定拒绝并引导普通费用新增。
            operationId: OrderFeeService_CreateOrderFeeSupplement
            parameters:
                - name: orderId
                  in: path
                  required: true
                  schema:
                    type: string
