    /api/v1/workbench/application-candidates:
        get:
            tags:
                - WorkbenchService
            description: |-
                ListMyApplicationCandidates 返回本人截至上一自然月末、尚未进入任何申请的
                 合格提成候选，按提成归属月过滤并服务端分页；候选由服务端按现有计提口径
                 全量解析，不信任客户端传入的员工/组织/金额。
            operationId: WorkbenchService_ListMyApplicationCandidates
            parameters:
                - name: page
                  in: query
                  schema:
                    type: integer
                    format: int32
                - name: pageSize
                  in: query
                  schema:
                    type: integer
                    format: int32
                - name: commissionMonth
                  in: query
                  description: 按提成归属月过滤（YYYY-MM）；缺省返回全部可申请候选（截至上一自然月末）。
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/workbench.v1.ListMyApplicationCandidatesResponse'
    /api/v1/workbench/commission-applications:
        get:
            tags:
                - WorkbenchService
            description: ListMyCommissionApplications 返回本人月度提成申请历史，服务端分页并支持状态过滤。
            operationId: WorkbenchService_ListMyCommissionApplications
            parameters:
                - name: page
                  in: query
                  schema:
                    type: integer
                    format: int32
                - name: pageSize
                  in: query
                  schema:
                    type: integer
                    format: int32
                - name: status
                  in: query
                  schema:
                    type: integer
                    format: enum
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/workbench.v1.ListMyCommissionApplicationsResponse'
    /api/v1/workbench/commission-applications/resubmit:
        post:
            tags:
                - WorkbenchService
            description: |-
                ResubmitMyCommissionApplication 显式重提本人被驳回的月度申请：按申请 ID 与
                 expected_version 定位原申请（会话固定本人与当前组织），服务端按上游当前
                 事实逐笔刷新明细快照金额/方案/指纹（来源失效或提成已被取消/冲销的明细
                 剔除并留审计），版本递增并回到财务待审。
            operationId: WorkbenchService_ResubmitMyCommissionApplication
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/workbench.v1.ResubmitMyCommissionApplicationRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/workbench.v1.ResubmitMyCommissionApplicationResponse'
    /api/v1/workbench/commission-applications/submit:
        post:
            tags:
                - WorkbenchService
            description: |-
                SubmitMyCommissionApplication 提交本人月度提成申请（仅用于新建）：无业务参数，
                 服务端以当前会话组织与本人身份全量重算候选并固化申请头与明细快照；当前
                 自然月、空候选与已进入有效申请的提成将被拒绝。当月已存在任何状态的申请头
                 时稳定冲突，重提必须走 ResubmitMyCommissionApplication 显式定位原申请。
            operationId: WorkbenchService_SubmitMyCommissionApplication
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/workbench.v1.SubmitMyCommissionApplicationRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/workbench.v1.SubmitMyCommissionApplicationResponse'
    /api/v1/workbench/commission-applications/{id}:
        get:
            tags:
                - WorkbenchService
            description: |-
                GetMyCommissionApplication 返回本人单张申请详情：申请头、提交/决策版本审计
                 与明细快照；查询他人申请稳定返回不存在。
            operationId: WorkbenchService_GetMyCommissionApplication
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/workbench.v1.GetMyCommissionApplicationResponse'
    /api/v1/workbench/my-commissions:
        get:
            tags:
