        workbench.v1.GetWorkbenchOverviewData:
            required:
                - hasCommissionEligibility
            type: object
            properties:
                hasCommissionEligibility:
                    type: boolean
                nextEffectiveDate:
                    type: string
                    description: |-
                        next_effective_date 是本人最近的未来实际生效日（YYYY-MM-DD）：存在当前/未来
                         有效方案分配且尚未到生效日时返回，供页面说明「方案尚未生效」，不把未生效
                         解释为零金额。
                baseCurrency:
                    type: string
                    description: base_currency 是当前工作区组织本位币；summary 中全部金额均为该本位币口径。
                commissionSummary:
                    $ref: '#/components/schemas/workbench.v1.WorkbenchCommissionSummary'
                recentOrders:
                    type: array
                    items:
                        $ref: '#/components/schemas/workbench.v1.WorkbenchRecentOrder'
                todos:
                    $ref: '#/components/schemas/workbench.v1.WorkbenchTodoSummary'
                finance:
                    $ref: '#/components/schemas/workbench.v1.WorkbenchFinanceSummary'
                applicationSummary:
                    allOf:
                        - $ref: '#/components/schemas/workbench.v1.WorkbenchApplicationSummary'
                    description: |-
                        application_summary 是本人月度提成申请摘要段：可申请分组、本月累计中与
                         审批中/已批准计数及最近申请概要；金额全部为组织本位币口径。
        workbench.v1.GetWorkbenchOverviewResponse:
            type: object
            properties:
                success:
                    type: boolean
                code:
                    type: integer
                    format: int32
                message:
                    type: string
                traceId:
                    type: string
                data:
                    $ref: '#/components/schemas/workbench.v1.GetWorkbenchOverviewData'
            description: |-
                GetWorkbenchOverviewResponse 中 has_commission_eligibility 为 optional bool 且
                 服务端始终赋值：门禁为假时 commission_summary 保持缺省，前端从首次渲染起就
                 不出现提成模块（不渲染标题、骨架、入口或零金额卡片）。
        workbench.v1.ListMyApplicationCandidatesResponse:
