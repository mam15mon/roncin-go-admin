                    type: integer
                    format: int32
                message:
                    type: string
                traceId:
                    type: string
                data:
                    $ref: '#/components/schemas/workbench.v1.WorkbenchMyCommissionApplication'
        workbench.v1.WorkbenchApplicationBrief:
            type: object
            properties:
                applicationId:
                    type: string
                applicationMonth:
                    type: string
                status:
                    type: integer
                    format: enum
                commissionCount:
                    type: integer
                    format: int32
                totalCommissionAmount:
                    type: string
                submittedAt:
                    type: string
            description: WorkbenchApplicationBrief 是最近一张申请的最小概要，用于首页入口展示。
        workbench.v1.WorkbenchApplicationCandidate:
            type: object
            properties:
                verificationId:
                    type: string
                verificationNo:
                    type: string
                nettingId:
                    type: string
                nettingNo:
                    type: string
                commissionDate:
                    type: string
                    description: 提成归属日期（YYYY-MM-DD）：核销日期或对冲确认日期。
                personnelRole:
                    type: string
                ruleId:
                    type: string
                ruleName:
                    type: string
                calculationBasis:
                    type: string
                baseCurrency:
                    type: string
                commissionAmount:
                    type: string
                cnyCommissionAmount:
                    type: string
            description: |-
                WorkbenchApplicationCandidate 是单条可申请提成候选：以核销/对冲来源为身份
                 （恰好一个非空），金额为按现有提成口径的服务端计算值，尚未生成的提成事实
                 以提交申请时受控创建为准；候选不携带 commission_id。
        workbench.v1.WorkbenchApplicationSummary:
            type: object
            properties:
                baseCurrency:
                    type: string
                applyGroups:
                    type: array
                    items:
                        $ref: '#/components/schemas/workbench.v1.WorkbenchApplyMonthGroup'
                accumulatingCount:
                    type: integer
                    format: int32
                accumulatingAmount:
                    type: string
                pendingReviewCount:
                    type: integer
                    format: int32
                approvedCount:
                    type: integer
                    format: int32
                latestApplication:
                    $ref: '#/components/schemas/workbench.v1.WorkbenchApplicationBrief'
            description: |-
                WorkbenchApplicationSummary 按自然月汇总本人申请事实：
                 可申请=截至上一自然月末仍未进入任何申请的合格提成（按提成归属月分组）；
                 本月累计中=当前自然月尚未结束、只能累计展示的合格提成；
                 审批中/已批准为本人全部历史申请计数；最近申请概要尚无申请时缺省。
        workbench.v1.WorkbenchApplyMonthGroup:
            type: object
            properties:
                commissionMonth:
                    type: string
                commissionCount:
                    type: integer
                    format: int32
                commissionAmount:
                    type: string
            description: WorkbenchApplyMonthGroup 是单个提成归属月的可申请汇总：金额为本位币合计。
        workbench.v1.WorkbenchCommissionSummary:
            type: object
            properties:
                baseCurrency:
                    type: string
                draftCount:
                    type: integer
                    format: int32
                draftAmount:
                    type: string
                confirmedCount:
                    type: integer
                    format: int32
                confirmedAmount:
                    type: string
                paidCount:
                    type: integer
                    format: int32
                paidAmount:
                    type: string
                paidAmountThisYear:
                    type: string
                paidAmountThisMonth:
                    type: string
                decreaseDraftCount:
                    type: integer
                    format: int32
                decreaseDraftAmount:
                    type: string
                decreaseConfirmedCount:
                    type: integer
                    format: int32
                decreaseConfirmedAmount:
                    type: string
                decreasePaidCount:
                    type: integer
                    format: int32
                decreasePaidAmount:
                    type: string
                estimated:
                    $ref: '#/components/schemas/workbench.v1.WorkbenchEstimatedOpportunity'
            description: |-
                WorkbenchCommissionSummary 提成卡严格分桶：
                 DRAFT=待财务确认；CONFIRMED=已确认待发；PAID=已发放；CANCELLED 不计入有效金额。
                 冲减三阶段：DRAFT=待处理、尚未扣回；CONFIRMED=已确认、尚未实际扣回；PAID=已扣回。
                 预计机会不属于任何已确认/已发金额，仅表示尚未生成的可靠估算。
        workbench.v1.WorkbenchEstimatedOpportunity:
            type: object
            properties:
                opportunityCount:
                    type: integer
                    format: int32
                estimatedAmount:
                    type: string
                hasMore:
                    type: boolean
            description: |-
                WorkbenchEstimatedOpportunity 是「预计可计提」摘要：本人已有可计算的有效应收
                 核销/对冲来源，且来源归属日期能唯一匹配本人对应身份的有效方案与员工分配，
                 但尚无对应有效基础提成单。estimated_amount 为按现有提成口径的估算值，
                 不得并入已确认或已发金额；has_more 为真时表示候选超出服务端有界扫描上限，
                 金额仅为不完整下界，页面应提示而非当作精确合计。
        workbench.v1.WorkbenchFinanceSummary:
            type: object
            properties:
                canReadCommission:
                    type: boolean
                canManageCommission:
                    type: boolean
                confirmedCommissionCount:
                    type: integer
                    description: confirmed_commission_count 是当前组织已确认待发提成数量（组织范围）。
                    format: int32
                pendingDecreaseCount:
                    type: integer
                    description: |-
                        pending_decrease_count 是当前组织 LOCKED_FEE_SUPPLEMENT + DECREASE + DRAFT
                         冲减建议数量（待处理、尚未扣回）。
                    format: int32
                pendingSupplementApprovalCount:
                    type: integer
                    format: int32
                pendingSupplementApprovals:
                    type: array
                    items:
                        $ref: '#/components/schemas/workbench.v1.WorkbenchSupplementApprovalItem'
                supplementApprovalsTruncated:
                    type: boolean
                    description: |-
                        supplement_approvals_truncated 为真时表示 PENDING 候选超出服务端有界扫描
                         上限，计数仅为已扫描部分的下界。
            description: |-
                WorkbenchFinanceSummary 按当前用户对当前工作区组织的实际权限出现：无
                 commission.read 时整体缺省；can_manage_commission 仅表示具备处理入口能力，
                 实际动作仍调用原端点并重新鉴权。
        workbench.v1.WorkbenchMyApplicationLine:
            type: object
            properties:
                id:
                    type: string
                commissionId:
                    type: string
                commissionDate:
                    type: string
                verificationNo:
                    type: string
                nettingNo:
                    type: string
                personnelRole:
                    type: string
                ruleName:
                    type: string
                calculationBasis:
                    type: string
                baseCurrency:
                    type: string
                commissionAmount:
                    type: string
                cnyCommissionAmount:
                    type: string
                createdAt:
                    type: string
            description: |-
                WorkbenchMyApplicationLine 是本人申请明细快照投影：来源、方案与金额为提交
                 当时事实，申请批准后不可修改。
        workbench.v1.WorkbenchMyCommission:
            type: object
            properties:
                id:
                    type: string
                commissionNo:
                    type: string
                status:
                    type: integer
                    format: enum
                personnelRole:
                    type: string
                ruleName:
                    type: string
                calculationBasis:
                    type: string
                baseCurrency:
                    type: string
                commissionAmount:
                    type: string
                commissionDate:
                    type: string
                verificationNo:
                    type: string
                nettingNo:
                    type: string
                createdAt:
                    type: string
                adjustments:
                    type: array
                    items:
                        $ref: '#/components/schemas/workbench.v1.WorkbenchMyCommissionAdjustment'
        workbench.v1.WorkbenchMyCommissionAdjustment:
            type: object
            properties:
                id:
                    type: string
                adjustmentNo:
                    type: string
                direction:
                    type: string
                status:
                    type: integer
                    format: enum
                amount:
                    type: string
                reason:
                    type: string
                createdAt:
                    type: string
        workbench.v1.WorkbenchMyCommissionApplication:
            type: object
            properties:
                id:
                    type: string
                applicationMonth:
                    type: string
                coverageTo:
                    type: string
                status:
                    type: integer
                    format: enum
                version:
                    type: string
                commissionCount:
                    type: integer
                    format: int32
                baseCurrency:
                    type: string
                totalCommissionAmount:
                    type: string
                totalCnyCommissionAmount:
                    type: string
                submittedAt:
                    type: string
                decidedAt:
                    type: string
                decisionReason:
                    type: string
                createdAt:
                    type: string
                updatedAt:
                    type: string
            description: |-
                WorkbenchMyCommissionApplication 是本人单张月度申请投影：金额与明细为提交
                 时固化的快照（重提按上游当前事实刷新）；决策审计字段保留最近一次决策，
                 重提不清理，员工始终能看到最近一次驳回原因。
        workbench.v1.WorkbenchMyCommissionApplicationDetail:
            type: object
            properties:
                application:
                    $ref: '#/components/schemas/workbench.v1.WorkbenchMyCommissionApplication'
                lines:
                    type: array
                    items:
                        $ref: '#/components/schemas/workbench.v1.WorkbenchMyApplicationLine'
        workbench.v1.WorkbenchMyReceivable:
            type: object
            properties:
                billId:
                    type: string
                billNo:
                    type: string
                settlementPartyName:
                    type: string
                currency:
                    type: string
                totalAmount:
                    type: string
                unverifiedAmount:
                    type: string
                billDate:
                    type: string
                dueDate:
                    type: string
                overdueDays:
                    type: integer
                    format: int32
                confirmedAt:
                    type: string
            description: |-
                WorkbenchMyReceivable 是单张已确认应收账单的未结投影：金额全部为账单原币，
                 不同币种不合计；未结余额口径与账单台账一致（总额 - 有效核销 - 有效对冲）。
        workbench.v1.WorkbenchRecentOrder:
            type: object
            properties:
                orderId:
                    type: string
                orderNo:
                    type: string
                businessType:
                    type: string
                customerName:
                    type: string
                flowStatus:
                    type: string
                terminationStatus:
                    type: string
                orderDate:
                    type: string
                createdAt:
                    type: string
        workbench.v1.WorkbenchSupplementApprovalItem:
            type: object
            properties:
                requestId:
                    type: string
                orderId:
                    type: string
                orderNo:
                    type: string
                feeCode:
                    type: string
                feeName:
                    type: string
                currency:
                    type: string
                amount:
                    type: string
                reason:
                    type: string
                requestedByName:
                    type: string
                requestedAt:
                    type: string
        workbench.v1.WorkbenchTodoSummary:
            type: object
            properties:
                unbilledFeeCount:
                    type: integer
                    description: unbilled_fee_count 是本人协作订单上状态为 UNBILLED（未建账）的费用数量。
                    format: int32
                openAbnormalCount:
                    type: integer
                    format: int32
            description: |-
                WorkbenchTodoSummary 只聚合能由现有事实准确判定的作业待办，不虚构未建模的
                 责任与时限。
tags:
    - name: AdminService
    - name: AuthService
      description: AuthService owns the browser session boundary for the management console.
    - name: BackgroundTaskService
      description: |-
        BackgroundTaskService 后台任务追踪服务，只暴露查询与回放，
         不暴露租约凭据，也不提供直接入队接口（入队由业务用例触发）。
    - name: EnterpriseResourceService
    - name: ExchangeRateService
      description: ExchangeRateService 维护各核算组织本币口径的周汇率主数据（应收/应付双轨点差）。
    - name: FeeCatalogService
      description: FeeCatalogService 维护订单费用录入使用的费用设置、计费单位和应税劳务目录。
    - name: MasterDataService
    - name: OrderAbnormalCaseService
      description: |-
        OrderAbnormalCaseService 订单异常标记服务。
         异常类型必须引用组织级 abnormal_case 主数据；标记与解决人由会话主体记录。
    - name: OrderAttachmentService
      description: OrderAttachmentService 订单附件服务。
    - name: OrderCargoItemService
      description: |-
        OrderCargoItemService 订单货物明细服务。
         计费重、线路特有仓储执行字段和申报状态按 P8/M-006 决策后置。
    - name: OrderContainerService
      description: |-
        OrderContainerService 订单集装箱服务。
         箱型必须引用组织级 container_spec 主数据；装载状态与跟踪事件建模时另行引入。
    - name: OrderFeeService
      description: |-
        OrderFeeService 订单费用录入服务。
         管理订单费用明细；费用保存后即为未建账状态，可直接维护或进入账单，
         进入账单后修改范围由财务自定义策略控制。
    - name: OrderLockService
      description: OrderLockService 订单业务锁与不可变单证版本服务。
    - name: OrderMilestoneService
      description: OrderMilestoneService 订单里程碑服务。
    - name: OrderPersonnelService
      description: OrderPersonnelService 订单协作人员服务。
    - name: OrderReleasePodService
      description: |-
        OrderReleasePodService 订单放货凭证服务。
         新建凭证固定为待签收；字段编辑在未回单前可用；状态仅允许
         PENDING→SIGNED→RETURNED 向前单步流转，签收时记录签收人与时间。
    - name: OrderService
      description: OrderService 订单核心服务。
    - name: OrderShippingDocumentService
      description: |-
        OrderShippingDocumentService 订单提单服务。
         新建提单固定为草稿态；字段编辑仅允许草稿/已确认；状态仅允许
         DRAFT→CONFIRMED→RELEASED 向前流转并携带期望状态并发条件。
    - name: OrderTagService
      description: OrderTagService 提供订单标签候选与批量维护能力。
    - name: PartnerService
    - name: SeaDocumentService
      description: SeaDocumentService 海运单证核心服务。
    - name: SeaOrderChangeService
      description: SeaOrderChangeService 海运出口拆票与改配服务。
    - name: SeaSharedContainerService
      description: SeaSharedContainerService 管理明确标记为客户拼货的跨订单共享物理箱。
    - name: SettlementService
      description: SettlementService 提供跨业务费用台账及后续账单、开票、收付和核销能力。
    - name: WorkbenchService
      description: |-
        WorkbenchService 提供登录员工「我的工作台」聚合读模型：全部接口只从会话取当前
         用户与当前工作区组织，不接收 employee_id / organization_id 等可改写参数。
         模块门禁由服务端按本人事实（方案员工分配、历史提成/调整、订单协作）与当前
         组织权限判定；完整台账、审批、冲减与发放动作仍走原有业务接口。
