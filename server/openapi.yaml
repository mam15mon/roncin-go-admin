            description: |-
                OrderCommissionSummary 订单列表可选提成摘要：仅 ListOrders 的海运出口结果
                 按需填充，订单详情不自动附加。摘要以可并存事实集合表达当前用户可见范围内
                 的提成状态，不构造整票互斥状态；普通员工视图仅含本人提成事实，不含他人
                 数量、姓名、状态、金额或「整票是否有提成」等旁路信息，本人无记录时所有
                 事实均为 false 的本人空态。
