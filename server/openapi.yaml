                    type: array
                    items:
                        type: string
        admin.v1.AuthorizeWeComUserResponse:
            type: object
            properties:
                success:
                    type: boolean
                code:
                    type: integer
                    format: int32
                message:
                    type: string
                data:
                    $ref: '#/components/schemas/admin.v1.AdminUser'
                traceId:
                    type: string
        admin.v1.CreateDingTalkInvitationRequest:
            required:
                - organizationId
            type: object
            properties:
                organizationId:
                    type: string
                    description: 目标组织；必须是调用者可写范围内的组织。
                kind:
                    type: integer
                    description: 邀请类型：TARGETED（定向单人免审码）或 GENERIC（通用入职审批码）。缺省为 TARGETED。
                    format: enum
                mobile:
                    type: string
                    description: 国内手机号；TARGETED 必填，GENERIC 留空。
                roleId:
                    type: string
                    description: 激活后授予的初始角色（属于目标组织；通用码可选，留空则审批时指定）。
                displayName:
                    type: string
                    description: 备注姓名，仅供管理员识别，账号身份以钉钉返回为准。
                expiresInHours:
                    type: integer
                    description: 有效期（小时）；缺省 168（7 天），允许 1-720。
                    format: int32
        admin.v1.CreateDingTalkInvitationResponse:
            type: object
            properties:
                success:
                    type: boolean
                code:
                    type: integer
                    format: int32
                message:
                    type: string
                data:
                    $ref: '#/components/schemas/admin.v1.DingTalkInvitation'
                invitationUrl:
                    type: string
                traceId:
                    type: string
        admin.v1.CreateOrganizationRequest:
            required:
                - code
                - name
                - kind
            type: object
            properties:
                code:
                    type: string
                name:
                    type: string
                parentId:
                    type: string
                kind:
                    type: integer
                    format: enum
                baseCurrency:
                    type: string
        admin.v1.CreateOrganizationResponse:
            type: object
            properties:
                success:
                    type: boolean
                code:
                    type: integer
                    format: int32
                message:
                    type: string
                data:
                    $ref: '#/components/schemas/admin.v1.AdminOrganization'
                traceId:
                    type: string
        admin.v1.CreateRoleRequest:
            required:
                - name
                - dataScope
            type: object
            properties:
                code:
                    type: string
                    description: 角色编码可选；留空时由服务端自动生成机器标识，组织内唯一性由数据库唯一索引兜底。
                name:
                    type: string
                dataScope:
                    type: integer
                    format: enum
                permissionKeys:
                    type: array
                    items:
                        type: string
