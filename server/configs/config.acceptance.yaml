server:
  http:
    addr: 127.0.0.1:8010
    timeout: 1s
  grpc:
    addr: 127.0.0.1:9010
    timeout: 1s
logging:
  level: ${LOG_LEVEL:debug}
data:
  database:
    driver: postgres
    source: ${DATABASE_SOURCE}
    debug: false
    auto_migrate: false
    max_open_connections: 10
    max_idle_connections: 5
    connection_max_lifetime: 1800s
  object_storage:
    enabled: ${OBJECT_STORAGE_ENABLED:false}
    endpoint: ${OBJECT_STORAGE_ENDPOINT:}
    region: ${OBJECT_STORAGE_REGION:}
    bucket: ${OBJECT_STORAGE_BUCKET:}
    access_key: ${OBJECT_STORAGE_ACCESS_KEY:}
    secret_key: ${OBJECT_STORAGE_SECRET_KEY:}
    path_style: ${OBJECT_STORAGE_PATH_STYLE:true}
security:
  session:
    cookie_name: roncin_acceptance_session
    ttl: 43200s
    secure: false
    same_site: lax
  wecom:
    enabled: false
  dingtalk:
    enabled: false
    approval_process_code: ""
    event_token: ""
    event_aes_key: ""
telemetry:
  enabled: false
