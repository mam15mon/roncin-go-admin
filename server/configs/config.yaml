server:
  http:
    addr: 0.0.0.0:8000
    timeout: 30s
  grpc:
    addr: 0.0.0.0:9000
    timeout: 1s
logging:
  level: ${LOG_LEVEL:debug}
data:
  database:
    driver: postgres
    source: ${DATABASE_SOURCE}
    # 数据库结构只通过版本化迁移变更；本地首次启动也先显式执行迁移。
    debug: true
    auto_migrate: false
    max_open_connections: 30
    max_idle_connections: 10
    connection_max_lifetime: 1800s
  object_storage:
    enabled: ${OBJECT_STORAGE_ENABLED:false}
    endpoint: ${OBJECT_STORAGE_ENDPOINT:}
    region: ${OBJECT_STORAGE_REGION:}
    bucket: ${OBJECT_STORAGE_BUCKET:}
    access_key: ${OBJECT_STORAGE_ACCESS_KEY:}
    secret_key: ${OBJECT_STORAGE_SECRET_KEY:}
    path_style: ${OBJECT_STORAGE_PATH_STYLE:true}
  order_attachment_oss:
    enabled: ${ORDER_ATTACHMENT_OSS_ENABLED:false}
    endpoint: ${ORDER_ATTACHMENT_OSS_ENDPOINT:}
    region: ${ORDER_ATTACHMENT_OSS_REGION:}
    bucket: ${ORDER_ATTACHMENT_OSS_BUCKET:}
    access_key: ${ORDER_ATTACHMENT_OSS_ACCESS_KEY:}
    secret_key: ${ORDER_ATTACHMENT_OSS_SECRET_KEY:}

security:
  session:
    cookie_name: roncin_session
    # 连续 30 天无有效会话请求后过期，使用期间自动续期。
    ttl: 2592000s
    secure: false
    same_site: lax
  passkey:
    enabled: ${PASSKEY_ENABLED:false}
    rp_id: ${PASSKEY_RP_ID:roncin.com.cn}
    rp_name: ${PASSKEY_RP_NAME:Roncin 后台}
    origins:
      - ${PASSKEY_ORIGIN:https://ops.roncin.com.cn}
  dingtalk:
    enabled: ${DINGTALK_ENABLED:false}
    client_id: ${DINGTALK_CLIENT_ID:}
    client_secret: ${DINGTALK_CLIENT_SECRET:}
    redirect_uri: ${DINGTALK_REDIRECT_URI:}
    corp_id: ${DINGTALK_CORP_ID:}
    approval_process_code: ${DINGTALK_APPROVAL_PROCESS_CODE:}
    event_token: ${DINGTALK_EVENT_TOKEN:}
    event_aes_key: ${DINGTALK_EVENT_AES_KEY:}
telemetry:
  enabled: ${OTEL_ENABLED:false}
  endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:127.0.0.1:4317}
  insecure: ${OTEL_EXPORTER_OTLP_INSECURE:true}
  sample_ratio: ${OTEL_TRACES_SAMPLER_ARG:1}
