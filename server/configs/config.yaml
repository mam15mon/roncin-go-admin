server:
  http:
    addr: 0.0.0.0:8000
    timeout: 1s
  grpc:
    addr: 0.0.0.0:9000
    timeout: 1s
data:
  database:
    driver: postgres
    source: ${DATABASE_SOURCE}
    # Development conveniences. Keep both false in production and apply schema
    # changes as a separate reviewed step.
    debug: true
    auto_migrate: true
    max_open_connections: 30
    max_idle_connections: 10
    connection_max_lifetime: 1800s
  redis:
    addr: ${REDIS_ADDR:127.0.0.1:6379}
    read_timeout: 0.2s
    write_timeout: 0.2s
security:
  session:
    cookie_name: roncin_session
    ttl: 43200s
    secure: false
    same_site: lax
telemetry:
  enabled: ${OTEL_ENABLED:false}
  endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:127.0.0.1:4317}
  insecure: ${OTEL_EXPORTER_OTLP_INSECURE:true}
  sample_ratio: ${OTEL_TRACES_SAMPLER_ARG:1}
