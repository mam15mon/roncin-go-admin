name: 持续集成

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: 前端检查与构建
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.1
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 执行前端检查
        run: pnpm run check:web
      - name: 构建前端
        run: pnpm run build:web

  server:
    name: 服务端检查与构建
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: roncin
          POSTGRES_PASSWORD: roncin_local_dev
          POSTGRES_DB: roncin_notify_verify_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roncin -d roncin_notify_verify_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: 安装 Buf
        uses: bufbuild/buf-action@v1
        with:
          version: 1.72.0
          setup_only: true
      - name: 检查 Protobuf
        run: buf lint server
      - name: 初始化 PostgreSQL 测试扩展
        env:
          PGPASSWORD: roncin_local_dev
        run: psql -h 127.0.0.1 -U roncin -d roncin_notify_verify_ci -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm SCHEMA public'
      - name: 执行服务端及真实 PostgreSQL 测试
        env:
          RONCIN_INTEGRATION_DATABASE_SOURCE: postgres://roncin:roncin_local_dev@127.0.0.1:5432/roncin_notify_verify_ci?sslmode=disable
          DATABASE_SOURCE: postgres://roncin:roncin_local_dev@127.0.0.1:5432/roncin_notify_verify_ci?sslmode=disable
          RONCIN_POSTGRES_MIGRATION_TEST: '1'
          RONCIN_TASK_REALTIME_ACCEPTANCE: '1'
        run: |
          set -o pipefail
          go -C server test -p 32 -timeout 25m -count=1 -json ./... | tee /tmp/server-tests.jsonl
          python3 - <<'PYTHON'
          import json
          from collections import Counter
          events = [json.loads(line) for line in open('/tmp/server-tests.jsonl')]
          tests = [event for event in events if event.get('Test') and event['Action'] in ('pass', 'fail', 'skip')]
          print('测试结果:', dict(Counter(event['Action'] for event in tests)))
          skipped = [event for event in tests if event['Action'] == 'skip']
          for event in skipped:
              print('跳过:', event['Package'], event['Test'])
          if skipped:
              raise SystemExit('真实 PostgreSQL 门禁不允许跳过测试')
          PYTHON
      - name: 验证重复扫描辅助工具
        run: go -C scripts/duplicate-scan-go test ./...
      - name: 检查后端分层边界
        run: go -C scripts/layer-check-go test ./... && go -C scripts/layer-check-go run .
      - name: 执行静态检查
        run: go -C server vet ./...
      - name: 构建服务端
        run: go -C server build -o /tmp/roncin-server ./cmd/server

  vulnerability:
    name: Go 依赖漏洞检查
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: 执行漏洞检查
        run: go -C server tool govulncheck ./...
